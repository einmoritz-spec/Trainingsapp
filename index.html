let exerciseProgressPeriod = 'total';

function renderExerciseProgress(name){
  const hist = exerciseHistory(name);
  const isTime = hist.length ? hist[0].isTime : (plan.exercises.find(e => e.name === name)?.type === 'time');
  const period = exerciseProgressPeriod;
  const agg = (key) => aggregateHistoryPoints(hist.map(h => ({ date: h.date, value: h[key] })), period)
    .map(p => ({ label: p.label || shortDate(p.date), value: p.value }));

  let summaryLine, chartsHTML;
  if (isTime){
    const points = agg('maxSeconds');
    const totalPoints = agg('totalSeconds');
    const best = hist.length ? Math.max(...hist.map(h => h.maxSeconds)) : 0;
    summaryLine = `Bestwert: ${fmtSec(best)}`;
    chartsHTML = `
      <div class="chart-wrap">
        <div class="chart-title">Längste Haltezeit je Einheit</div>
        ${buildLineChart(points, cssVar('--accent'), fmtSec)}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Gesamte Haltezeit je Einheit</div>
        ${buildLineChart(totalPoints, cssVar('--accent-3'), fmtSec)}
      </div>`;
  } else {
    const weightPoints = agg('maxWeight');
    const volumePoints = agg('volume');
    const volumeMaxPoints = agg('volumeMax');
    const volumeAvgPoints = agg('volumeAvg').map(p => ({ ...p, value: Math.round(p.value * 10) / 10 }));
    const rm10MaxPoints = agg('rm10Max').map(p => ({ ...p, value: Math.round(p.value * 10) / 10 }));
    const rm10AvgPoints = agg('rm10Avg').map(p => ({ ...p, value: Math.round(p.value * 10) / 10 }));
    const repsMaxPoints = agg('repsMax');
    const repsAvgPoints = agg('repsAvg').map(p => ({ ...p, value: Math.round(p.value * 10) / 10 }));
    const best = hist.length ? Math.max(...hist.map(h => h.maxWeight)) : 0;
    summaryLine = `Bestwert: ${best} kg`;
    chartsHTML = `
      <div class="chart-wrap">
        <div class="chart-title">Maximalgewicht je Einheit (kg)</div>
        ${buildLineChart(weightPoints, cssVar('--accent'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Trainingsvolumen je Einheit (kg, Wdh × Gewicht)</div>
        ${buildLineChart(volumePoints, cssVar('--accent-3'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Volumen Max (bester Satz, kg)</div>
        ${buildLineChart(volumeMaxPoints, cssVar('--accent-2'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Volumen Ø (kg)</div>
        ${buildLineChart(volumeAvgPoints, cssVar('--accent-2'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">10RM Max (geschätzt, kg)</div>
        ${buildLineChart(rm10MaxPoints, cssVar('--accent'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">10RM Ø (geschätzt, kg)</div>
        ${buildLineChart(rm10AvgPoints, cssVar('--accent'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Wdh Max je Einheit</div>
        ${buildLineChart(repsMaxPoints, cssVar('--accent-3'))}
      </div>
      <div class="chart-wrap">
        <div class="chart-title">Wdh Ø je Einheit</div>
        ${buildLineChart(repsAvgPoints, cssVar('--accent-3'))}
      </div>`;
  }

  app.innerHTML = `
    <div class="brand">
      <h1>${name}</h1>
    </div>
    <div class="back-row">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <div class="progress-summary">
      <span>${hist.length} Einheiten</span>
      <span>${summaryLine}</span>
    </div>
    <div class="period-row">
      ${Object.keys(PERIOD_LABELS).map(p => `
        <button class="period-btn ${period === p ? 'active' : ''}" data-period="${p}">${PERIOD_LABELS[p]}</button>
      `).join('')}
    </div>
    ${chartsHTML}
  `;

  document.getElementById('btnBack').onclick = () => history.back();
  app.querySelectorAll('.period-btn').forEach(btn => {
    btn.onclick = () => {
      exerciseProgressPeriod = btn.dataset.period;
      renderExerciseProgress(name);
    };
  });
}

/* ---------------------------------------------------
   START-AUSWAHL (Ganzkörper / Oberkörper / Unterkörper / Frei)
--------------------------------------------------- */
const MODE_LABELS = { ganzkoerper: 'Ganzkörper', oberkoerper: 'Oberkörper', unterkoerper: 'Unterkörper' };

// Liefert den aktuell gültigen Anzeigenamen für einen Modus — entweder den individuell
// über das Long-Press-Menü vergebenen Namen (plan.modeSettings[mode].label, z. B. "Push"
// statt "Oberkörper") oder, falls keiner gesetzt ist, den Standardnamen aus MODE_LABELS.
// Alle vier möglichen Kacheln bei "Training starten", in ihrer festen Standard-Reihenfolge.
// plan.startTileHidden ist ein Set-artiges Objekt ({ [id]: true }), das steuert, welche davon
// aktuell ausgeblendet sind (per Long-Press-Popup entfernbar, siehe openTileRemovePrompt()
// und wieder hinzufügbar über Long-Press auf eine freie Stelle, siehe openAddTilePrompt()).
const START_TILE_IDS = ['oberkoerper', 'unterkoerper', 'ganzkoerper', 'frei'];
function isStartTileHidden(id){
  return !!(plan.startTileHidden && plan.startTileHidden[id]);
}
function visibleStartTiles(){
  return START_TILE_IDS.filter(id => !isStartTileHidden(id));
}

function modeDisplayLabel(mode){
  const custom = plan.modeSettings && plan.modeSettings[mode] && plan.modeSettings[mode].label;
  return (custom && custom.trim()) ? custom.trim() : (MODE_LABELS[mode] || mode);
}

// Liefert den Übungspool-Filter für einen Modus: 'oberkoerper', 'unterkoerper', 'push',
// 'pull', 'legs' oder 'all'. Standardmäßig (kein modeSettings-Eintrag) entspricht das dem
// bisherigen Verhalten — Oberkörper/Unterkörper zeigen nur Übungen der jeweils eigenen
// category, Ganzkörper zeigt von jeher alle. Über das Long-Press-Menü lässt sich das pro
// Modus frei umstellen, inkl. der Push/Pull/Legs-Klassifizierung (ex.bodyPart) als
// alternative Aufteilung zu Ober-/Unterkörper.
function modePoolFilter(mode){
  const custom = plan.modeSettings && plan.modeSettings[mode] && plan.modeSettings[mode].poolFilter;
  const valid = new Set(['oberkoerper', 'unterkoerper', 'push', 'pull', 'legs', 'all']);
  if (valid.has(custom)) return custom;
  return (mode === 'oberkoerper' || mode === 'unterkoerper') ? mode : 'all';
}

function getModeExerciseIds(mode, variant){
  const stored = plan.modeLists && plan.modeLists[mode];
  if (stored && typeof stored === 'object' && !Array.isArray(stored)){
    const key = variant || 'A';
    return Array.isArray(stored[key]) ? stored[key] : [];
  }
  if (Array.isArray(stored)) return variant === 'B' ? [] : stored;
  if (variant === 'B') return [];
  if (mode === 'ganzkoerper') return plan.exercises.map(e => e.id);
  return plan.exercises.filter(e => e.category === mode).map(e => e.id);
}
function getModeExercises(mode, variant){
  const ids = new Set(getModeExerciseIds(mode, variant));
  return plan.exercises.filter(e => ids.has(e.id));
}

// Importiert eine einzelne, zuvor über exportSingleSession() exportierte Trainingseinheit
// und startet direkt ein neues Training mit genau denselben Übungen (in derselben
// Reihenfolge) — analog zu repeatSession(), aber die Übungsliste kommt aus der Datei statt
// aus dem lokalen Verlauf. Übungen, die im aktuellen Plan noch fehlen (z. B. Import auf
// einem anderen Gerät), werden aus den mitgelieferten Übungsdefinitionen ergänzt (Abgleich
// über id, nichts Bestehendes wird überschrieben — gleiches Prinzip wie die
// DEFAULT_PLAN-Migration in init()). Übungen ganz ohne mitgelieferte Definition und ohne
// Treffer im aktuellen Plan werden übersprungen.
async function importSingleSessionFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data.session || !Array.isArray(data.session.entries)){
        alert('Diese Datei sieht nicht wie ein exportiertes Training dieser App aus.');
        return;
      }
      const importedExercises = Array.isArray(data.exercises) ? data.exercises : [];
      let planChanged = false;
      importedExercises.forEach(ex => {
        if (ex && ex.id && !plan.exercises.some(p => p.id === ex.id)){
          plan.exercises.push({ ...ex });
          planChanged = true;
        }
      });
      if (planChanged) await saveJSON('plan', plan);

      const exerciseList = data.session.entries
        .map(e => plan.exercises.find(x => x.id === e.exerciseId))
        .filter(Boolean);
      if (!exerciseList.length){
        alert('Keine der Übungen aus dieser Datei konnte zugeordnet werden.');
        return;
      }
      if (exerciseList.length < data.session.entries.length){
        if (!confirm(`${data.session.entries.length - exerciseList.length} Übung(en) aus der Datei fehlen im Plan und werden übersprungen. Trotzdem starten?`)) return;
      }
      if (active){
        if (!confirm('Es läuft bereits ein Training. Dieses verwerfen und das importierte Training starten?')) return;
        clearInterval(timerHandle);
        clearInterval(restInterval);
        restState = null;
        active = null;
        persistActiveSession();
      }
      startSession(exerciseList);
    }catch(err){
      alert('Datei konnte nicht gelesen werden: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function renderStartSelect(){
  const splitModes = new Set(['ganzkoerper', 'oberkoerper', 'unterkoerper']);
  const visible = visibleStartTiles(); // z. B. ['oberkoerper','unterkoerper','ganzkoerper','frei'] minus ausgeblendete
  const modes = visible.filter(id => id !== 'frei');
  const showFrei = visible.includes('frei');

  const cellsHTML = modes.map(mode => {
    const label = modeDisplayLabel(mode);
    if (splitModes.has(mode)){
      return `
        <div class="start-cell start-cell-split" data-editmode="${mode}">
          <div class="split-cell-top">
            <span class="split-cell-label">${label}</span>
            <button class="split-cell-edit" data-editmode="${mode}" aria-label="${label}-Übungen bearbeiten">✎</button>
          </div>
          <div class="split-cell-row">
            <button class="split-cell-btn" data-mode="${mode}" data-variant="A">A</button>
            <button class="split-cell-btn" data-mode="${mode}" data-variant="B">B</button>
          </div>
        </div>

    return `
      <div class="start-cell">
        <button class="start-option" data-mode="${mode}">${label}</button>
        <button class="start-edit-btn" data-editmode="${mode}" aria-label="${label}-Übungen bearbeiten">✎</button>
      </div>
    `;
  }).join('');

  const freiHTML = showFrei ? `
    <div class="start-cell" data-tile-id="frei">
      <button class="start-option accent" data-mode="frei">Frei<span class="sub">Auswahl</span></button>
    </div>
  ` : '';

  // Layout je nach Anzahl sichtbarer Kacheln: bei 4 (Standard) 2×2-Raster wie bisher; bei 3
  // bleiben die ersten beiden nebeneinander in Zeile 1, die letzte füllt Zeile 2 komplett
  // breit aus; bei ≤2 verteilen sich die verbleibenden Kacheln gleichmäßig nebeneinander in
  // einer Zeile (per CSS-Klasse gesteuert, siehe .start-grid.count-2/.count-3).
  const totalCount = visible.length;
  const gridClass = totalCount === 1 ? 'count-1' : totalCount === 3 ? 'count-3' : totalCount === 2 ? 'count-2' : '';

  app.innerHTML = `
    <div class="brand">
      <h1>Training starten</h1>
    </div>
    <div class="back-row">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <div class="start-grid ${gridClass}" id="startGrid">
      ${cellsHTML}
      ${freiHTML}
    </div>
    <div class="io-row" style="margin-top:8px;">
      <button class="btn btn-ghost" id="btnImportSession">⬆ Training importieren</button>
      <button class="btn btn-ghost" id="btnAddCategory">+ Kategorie hinzufügen</button>
    </div>
    <input type="file" id="importSessionFile" accept="application/json,.json" style="display:none;">
  `;

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnImportSession').onclick = () => {
    document.getElementById('importSessionFile').click();
  };
  document.getElementById('btnAddCategory').onclick = () => openAddTilePrompt();
  document.getElementById('importSessionFile').onchange = (e) => {
    const file = e.target.files[0];
    if (file) importSingleSessionFile(file);
    e.target.value = '';
  };
  app.querySelectorAll('.start-option[data-mode]').forEach(btn => {
    btn.onclick = () => {
      const mode = btn.dataset.mode;
      if (mode === 'frei'){ goFreeSelect(); return; }
      const list = getModeExercises(mode);
      if (!list.length){
        alert(`Für „${modeDisplayLabel(mode)}" sind aktuell keine Übungen hinterlegt. Über das Stift-Symbol kannst du welche festlegen.`);
        return;
      }
      startSession(list);
    };
  });
  app.querySelectorAll('.split-cell-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const mode = btn.dataset.mode, variant = btn.dataset.variant;
      const list = getModeExercises(mode, variant);
      if (!list.length){
        // Split noch nicht eingerichtet: direkt zum Bearbeiten auf dem passenden Tab
        goModeEdit(mode, true, variant);
        return;
      }
      startSession(list);
    };
  });
  app.querySelectorAll('.start-edit-btn, .split-cell-edit').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      goModeEdit(btn.dataset.editmode);
    };
  });
  app.querySelectorAll('.start-cell-split').forEach(cell => {
    cell.onclick = () => goModeEdit(cell.dataset.editmode);
  });
  wireModeLongPress();
  wireEmptyGridLongPress();
}

// Long-Press auf eine freie Fläche UNTERHALB/NEBEN dem Kachel-Raster (nicht auf eine Kachel
// selbst) öffnet das "Kachel hinzufügen"-Popup, sofern mindestens eine Kachel aktuell
// ausgeblendet ist. Der Long-Press-Bereich ist bewusst der Rest des Grid-Containers, der
// nicht von einer .start-cell eingenommen wird (leerer Raum bei <4 sichtbaren Kacheln).
function wireEmptyGridLongPress(){
  if (!START_TILE_IDS.some(id => id !== 'frei' && isStartTileHidden(id))) return; // nichts zum Hinzufügen da
  const grid = document.getElementById('startGrid');
  if (!grid) return;
  const LONG_PRESS_MS = 450;
  const MOVE_CANCEL_PX = 10;
  let pressTimer = null;
  let startX = 0, startY = 0;

  const isOnCell = (target) => !!target.closest('.start-cell');
  const cancel = () => { clearTimeout(pressTimer); pressTimer = null; };

  grid.addEventListener('touchstart', (ev) => {
    if (isOnCell(ev.target)) return; // Klick landete auf einer bestehenden Kachel, nicht auf leerer Fläche
    const t = ev.touches[0];
    startX = t.clientX; startY = t.clientY;
    pressTimer = setTimeout(() => {
      if (navigator.vibrate) navigator.vibrate(15);
      openAddTilePrompt();
    }, LONG_PRESS_MS);
  }, { passive: true });
  grid.addEventListener('touchmove', (ev) => {
    const t = ev.touches[0];
    if (Math.abs(t.clientX - startX) > MOVE_CANCEL_PX || Math.abs(t.clientY - startY) > MOVE_CANCEL_PX) cancel();
  }, { passive: true });
  grid.addEventListener('touchend', cancel);
  grid.addEventListener('touchcancel', cancel);
}

// Long-Press auf einen Modus-Kreis (Split-Karte oder Ganzkörper-Kreis, nicht "Frei") öffnet
// ein Popup zum Umbenennen der Kategorie (z. B. "Oberkörper" → "Push") und zur Auswahl,
// aus welchem Übungspool beim Bearbeiten der A/B-Liste ausgewählt werden kann (nur
// Oberkörper-, nur Unterkörper- oder alle Übungen) — siehe openModeSettingsPrompt().
function wireModeLongPress(){
  const LONG_PRESS_MS = 450;
  const MOVE_CANCEL_PX = 10;
  const targets = [...document.querySelectorAll('.start-cell-split')];
  targets.forEach(el => {
    const mode = el.dataset.editmode || el.dataset.mode;
    if (!mode) return;
    let pressTimer = null;
    let startX = 0, startY = 0, longPressFired = false;
    const cancel = () => { clearTimeout(pressTimer); pressTimer = null; };

    el.addEventListener('contextmenu', (ev) => ev.preventDefault());
    el.addEventListener('selectstart', (ev) => ev.preventDefault());

    el.addEventListener('touchstart', (ev) => {
      longPressFired = false;
      const t = ev.touches[0];
      startX = t.clientX; startY = t.clientY;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        if (navigator.vibrate) navigator.vibrate(15);
        openModeSettingsPrompt(mode);
      }, LONG_PRESS_MS);
    }, { passive: true });
    el.addEventListener('touchmove', (ev) => {
      const t = ev.touches[0];
      if (Math.abs(t.clientX - startX) > MOVE_CANCEL_PX || Math.abs(t.clientY - startY) > MOVE_CANCEL_PX) cancel();
    }, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);

    el.addEventListener('mousedown', () => {
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        openModeSettingsPrompt(mode);
      }, LONG_PRESS_MS);
    });
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);

    el.addEventListener('click', (ev) => {
      if (longPressFired){ ev.preventDefault(); ev.stopPropagation(); longPressFired = false; }
    }, true);
  });
}

      </div>

  `;
  document.body.appendChild(overlay);

  function remove(){ const el = document.getElementById('modeSettingsOverlay'); if (el) el.remove(); }
  const close = () => { popOverlayStateIfOpen(); remove(); };

  document.getElementById('modeSettingsCancel').onclick = close;

    // Eine komplett leere "Training starten"-Seite kann nicht mehr entstehen, da die
    // "Frei"-Kachel fest ist und sich nicht entfernen lässt — hier lassen sich nur die drei
    // Modus-Kacheln (Oberkörper/Unterkörper/Ganzkörper) ausblenden, notfalls auch alle drei.
    if (!plan.startTileHidden) plan.startTileHidden = {};
    plan.startTileHidden[mode] = true;
    await saveJSON('plan', plan);
    close();
    renderStartSelect();

  document.getElementById('modeSettingsSave').onclick = async () => {
    const nameInput = document.getElementById('modeSettingsNameInput');
    const filterInput = overlay.querySelector('input[name="modeSettingsFilter"]:checked');
    if (!plan.modeSettings) plan.modeSettings = {};
    if (!plan.modeSettings[mode]) plan.modeSettings[mode] = {};
    plan.modeSettings[mode].label = nameInput.value.trim();
    plan.modeSettings[mode].poolFilter = filterInput ? filterInput.value : 'all';
    await saveJSON('plan', plan);
    close();
    renderStartSelect();

}

// Long-Press auf eine freie Fläche im Kachel-Raster (wenn weniger als alle Kacheln
// sichtbar sind) öffnet ein Popup, um zuvor entfernte Kacheln wieder einzublenden. "Frei"
// taucht hier nie auf, da sie fest ist und sich nicht entfernen lässt (siehe START_TILE_IDS-
// Filter unten, der 'frei' konsequent ausschließt). Bei Oberkörper/Unterkörper/Ganzkörper
// folgt danach ein zweiter Schritt zur direkten Wahl des Übungspools (Alle/Push/Pull/Legs/
// Nur Oberkörper/Nur Unterkörper) — spart den Umweg, die Kachel erst hinzuzufügen und dann
// separat per Long-Press wieder zu öffnen, um den Pool zu ändern.
function openAddTilePrompt(){
  const hidden = START_TILE_IDS.filter(id => id !== 'frei' && isStartTileHidden(id));
  if (!hidden.length){
    alert('Alle Kategorien sind bereits sichtbar.');
    return;
  }

  // WICHTIG: Der komplette Wizard (Schritt 1 + Schritt 2) teilt sich EINEN einzigen
  // History-Eintrag (einmal pushOverlayState() beim allerersten Öffnen). Schritt 1 → 2
  // wechselt NUR den Inhalt des Overlays (removeOverlay() + neues innerHTML), OHNE dabei
  // selbst nochmal history.back()/pushState() aufzurufen — das vorherige Verhalten (jeder
  // Schritt pusht/poppt seinen eigenen Eintrag) führte zu einer Race Condition zwischen dem
  // asynchronen history.back() und dem direkt danach folgenden pushState(), wodurch der
  // History-Stack durcheinandergeriet und "Speichern" in Schritt 2 nicht mehr zuverlässig
  // zur aktualisierten Kachel-Ansicht zurückfand.
  function removeOverlay(){
    const el = document.getElementById('addTileOverlay');
    if (el) el.remove();
  }
  function closeWizard(){
    popOverlayStateIfOpen();
    removeOverlay();
  }

  function renderStep1(){
    removeOverlay();
    const overlay = document.createElement('div');
    overlay.className = 'add-exercise-overlay centered-overlay';
    overlay.id = 'addTileOverlay';
    overlay.innerHTML = `
      <div class="add-exercise-modal" style="max-height:none;">
        <div class="add-exercise-modal-header">
          <div class="add-exercise-modal-title">Kachel hinzufügen</div>
          <button class="add-exercise-modal-close" id="addTileClose" aria-label="Abbrechen">✕</button>
        </div>
        <div class="new-exercise-modal-body">
          <div class="wizard-choice-list">
            ${hidden.map(id => `<button class="wizard-choice" data-add-tile="${id}">${modeDisplayLabel(id)}</button>`).join('')}
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById('addTileClose').onclick = closeWizard;
    overlay.querySelectorAll('[data-add-tile]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.addTile;
        // Bei "Unterkörper" ist eine Pool-Auswahl redundant: Unterkörper- und Legs-Übungen
        // sind praktisch dieselbe Menge (siehe Push/Pull/Legs-Zuordnung), Push/Pull/Ganzkörper/
        // Oberkörper würden hier ohnehin nie sinnvoll gewählt — daher direkt mit dem
        // naheliegenden "Nur Unterkörper-Übungen"-Filter anlegen, ohne zweiten Schritt.
        if (id === 'unterkoerper'){
          if (plan.startTileHidden) delete plan.startTileHidden[id];
          if (!plan.modeSettings) plan.modeSettings = {};
          if (!plan.modeSettings[id]) plan.modeSettings[id] = {};
          plan.modeSettings[id].poolFilter = 'unterkoerper';
          await saveJSON('plan', plan);
          closeWizard();
          renderStartSelect();
          return;
        }
        renderStep2(id);
      };
    });
    overlay.onclick = (ev) => { if (ev.target === overlay) closeWizard(); };
  }

  // Zweiter Schritt: Übungspool für die neu hinzugefügte Kachel direkt mit auswählen —
  // dasselbe Optionsset wie im bestehenden Kategorie-Bearbeiten-Popup (openModeSettingsPrompt),
  // hier aber gleich beim Anlegen statt erst danach separat per Long-Press erreichbar. Bei
  // "Oberkörper" werden nur die drei tatsächlich sinnvollen Optionen gezeigt (Unterkörper/
  // Legs/Ganzkörper würden dort nie gewählt) — "Ganzkörper" behält die volle Auswahl, da
  // dort wirklich jede Kombination denkbar ist.
  function renderStep2(id){
    removeOverlay();
    const overlay = document.createElement('div');
    overlay.className = 'add-exercise-overlay centered-overlay';
    overlay.id = 'addTileOverlay';
    const allPoolOptions = [
      { value: 'all', label: 'Alle Übungen' },
      { value: 'oberkoerper', label: 'Nur Oberkörper-Übungen' },
      { value: 'unterkoerper', label: 'Nur Unterkörper-Übungen' },
      { value: 'push', label: 'Nur Push-Übungen' },
      { value: 'pull', label: 'Nur Pull-Übungen' },
      { value: 'legs', label: 'Nur Legs-Übungen (Beine + unterer Rücken)' },
    ];
    const poolOptions = id === 'oberkoerper'
      ? [
          { value: 'oberkoerper', label: 'Alle Oberkörper-Übungen' },
          { value: 'push', label: 'Nur Push-Übungen' },
          { value: 'pull', label: 'Nur Pull-Übungen' },
        ]
      : allPoolOptions;
    overlay.innerHTML = `
      <div class="add-exercise-modal" style="max-height:none;">
        <div class="add-exercise-modal-header">
          <div class="add-exercise-modal-title">Übungen zur Auswahl</div>
          <button class="add-exercise-modal-close" id="addTileClose2" aria-label="Abbrechen">✕</button>
        </div>
        <div class="new-exercise-modal-body">
          <div class="wizard-choice-list">
            ${poolOptions.map(o => `<button class="wizard-choice" data-add-tile-pool="${o.value}">${o.label}</button>`).join('')}
          </div>
        </div>
        <div class="add-exercise-modal-header" style="border-top:1px solid var(--border); border-bottom:none;">
          <button class="btn btn-ghost" id="addTileBack" style="width:100%;">‹ Zurück</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById('addTileClose2').onclick = closeWizard;
    document.getElementById('addTileBack').onclick = renderStep1;
    overlay.querySelectorAll('[data-add-tile-pool]').forEach(btn => {
      btn.onclick = async () => {
        if (plan.startTileHidden) delete plan.startTileHidden[id];
        if (!plan.modeSettings) plan.modeSettings = {};
        if (!plan.modeSettings[id]) plan.modeSettings[id] = {};
        plan.modeSettings[id].poolFilter = btn.dataset.addTilePool;
        await saveJSON('plan', plan);
        closeWizard();
        renderStartSelect();
      };
    });
    overlay.onclick = (ev) => { if (ev.target === overlay) closeWizard(); };
  }

  pushOverlayState(closeWizard);
  renderStep1();
}

let modeEditData = null; // { A: {selected:Set, order:[]}, B: {selected:Set, order:[]} }
let modeEditTab = 'A';

function buildModeEditVariant(ids, mode){
  const poolFilter = modePoolFilter(mode);
  const isBodyPartFilter = (poolFilter === 'push' || poolFilter === 'pull' || poolFilter === 'legs');
  const pool = poolFilter === 'all'
    ? plan.exercises
    : isBodyPartFilter
      ? plan.exercises.filter(e => e.bodyPart === poolFilter)
      : plan.exercises.filter(e => e.category === poolFilter);
  const allIds = new Set(pool.map(e => e.id));
  const ungrouped = (poolFilter === 'oberkoerper' || poolFilter === 'unterkoerper' || isBodyPartFilter);
  const savedOrder = ids.filter(id => allIds.has(id));
  const groups = {};

  if (ungrouped){
    // Muskelgruppe ist das führende Sortierkriterium (z. B. bleiben alle
    // "Rücken"-Übungen hintereinander), die gespeicherte Reihenfolge zählt
    // nur noch als Tie-Break INNERHALB derselben Muskelgruppe.
    const muscleGroupIndex = g => {
      const i = MUSCLE_GROUP_ORDER.indexOf(g);
      return i === -1 ? MUSCLE_GROUP_ORDER.length : i;
    };
    const sortedPool = [...pool].sort((a, b) => {
      const ga = muscleGroupIndex(a.muscleGroup), gb = muscleGroupIndex(b.muscleGroup);
      if (ga !== gb) return ga - gb;
      const ia = savedOrder.indexOf(a.id), ib = savedOrder.indexOf(b.id);
      if (ia === -1 && ib === -1) return 0;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    groups._all = sortedPool.map(e => e.id);
  } else {
    pool.forEach(ex => {
      const g = ex.muscleGroup || 'Sonstige';
      (groups[g] = groups[g] || []).push(ex.id);
    });
    // bereits gespeicherte Reihenfolge innerhalb jeder Muskelgruppen-Sektion respektieren
    Object.keys(groups).forEach(g => {
      groups[g].sort((a, b) => {
        const ia = savedOrder.indexOf(a), ib = savedOrder.indexOf(b);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    });
  }

  return {
    selected: new Set(savedOrder),
    // Reihenfolge, in der die Übungen tatsächlich angekreuzt wurden — unabhängig von der
    // Anzeige-Reihenfolge (die nach Muskelgruppe gruppiert ist, damit man beim Auswählen
    // leichter alles findet). Startet mit der gespeicherten Reihenfolge, wird bei jedem
    // Toggle live aktualisiert (siehe Klick-Handler weiter unten) und ist maßgeblich für die
    // Reihenfolge, in der die Übungen später im Training erscheinen.
    checkOrder: [...savedOrder],
    groups,
    ungrouped
  };
}

let modeGroupOpen = new Set();

function renderModeEdit(mode, startTab){
  modeEditTab = startTab === 'B' ? 'B' : 'A';
  modeGroupOpen = new Set();
  modeEditData = {
    A: buildModeEditVariant(getModeExerciseIds(mode, 'A'), mode),
    B: buildModeEditVariant(getModeExerciseIds(mode, 'B'), mode)
  };
  const label = modeDisplayLabel(mode);

  app.innerHTML = `
    <div class="brand">
      <h1>${label} bearbeiten</h1>
    </div>
    <div class="back-row">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <p class="mode-edit-hint">Wähle, welche Übungen bei „${label}" dabei sind — antippen zum Auswählen, gedrückt halten zum Verschieben. Trage in <strong>Split B</strong> Übungen ein, wenn du zwei unterschiedliche Varianten abwechseln willst (z. B. bei vielen Übungen) — sonst reicht Split A allein.</p>
    <div class="period-row" id="modeEditTabs">
      <button class="period-btn ${modeEditTab === 'A' ? 'active' : ''}" data-tab="A">Split A</button>
      <button class="period-btn ${modeEditTab === 'B' ? 'active' : ''}" data-tab="B">Split B</button>
    </div>
    <div id="modeEditRows"></div>
    <button class="btn btn-primary" id="btnSaveMode" style="margin-top:8px;">Speichern</button>
  `;

  function renderTabs(){
    document.querySelectorAll('#modeEditTabs .period-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === modeEditTab);
    });
  }

  function orderedGroupNames(groups){
    const ordered = MUSCLE_GROUP_ORDER.filter(g => groups[g] && groups[g].length);
    Object.keys(groups).forEach(g => { if (groups[g] && groups[g].length && !ordered.includes(g)) ordered.push(g); });
    return ordered;
  }

  function itemRowHTML(id, g, state){
    const ex = plan.exercises.find(e => e.id === id);
    if (!ex) return '';
    const img = ex.imageData;
    const muscleLabel = ex.mainMuscle || ex.muscleGroup || '';
    return `
      <div class="free-row ${state.selected.has(id) ? 'checked' : ''}" data-id="${id}" data-group="${g}">
        <div class="free-row-check">✓</div>
        <div class="free-row-media">
          ${img ? `<img class="free-row-thumb" src="${img}" alt="">` : `<span class="free-row-thumb-fallback">${initials(ex.name)}</span>`}
        </div>
        <div class="free-row-mid">
          <div class="free-row-name">${ex.name}</div>
          <div class="free-row-muscle">${muscleLabel}</div>
        </div>
      </div>
    `;
  }

  function renderRows(){
    const state = modeEditData[modeEditTab];
    const container = document.getElementById('modeEditRows');

    if (state.ungrouped){
      const ids = state.groups._all || [];
      if (!ids.length){
        container.innerHTML = '<div class="history-empty">Noch keine Übungen im Plan.</div>';
        return;
      }
      container.innerHTML = ids.map(id => itemRowHTML(id, '_all', state)).join('');
      wireModeRowDrag(state);
      return;
    }

    const groupNames = orderedGroupNames(state.groups);
    if (!groupNames.length){
      container.innerHTML = '<div class="history-empty">Noch keine Übungen im Plan.</div>';
      return;
    }
    container.innerHTML = groupNames.map(g => {
      const ids = state.groups[g];
      const isOpen = modeGroupOpen.has(g);
      const selCount = ids.filter(id => state.selected.has(id)).length;
      const itemsHTML = ids.map(id => itemRowHTML(id, g, state)).join('');
      return `
        <div class="muscle-group">
          <button class="muscle-group-header" data-group="${g}" type="button">
            <span class="mg-name">${g}</span>
            <span class="mg-meta">${selCount ? selCount + '/' : ''}${ids.length} Übung${ids.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${itemsHTML}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        const g = btn.dataset.group;
        if (modeGroupOpen.has(g)) modeGroupOpen.delete(g); else modeGroupOpen.add(g);
        renderRows();
      };
    });

    wireModeRowDrag(state);
  }

  function wireModeRowDrag(state){
    const LONG_PRESS_MS = 350;
    const MOVE_CANCEL_PX = 8;
    const rowStep = 68;

    document.querySelectorAll('#modeEditRows .free-row').forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        const group = el.dataset.group;
        const id = el.dataset.id;
        const arr = state.groups[group];
        const fromIndex = arr.indexOf(id);
        let targetIndex = fromIndex;
        const startX = e.clientX, startY = e.clientY;
        let lastX = startX, lastY = startY;
        let mode2 = 'pending';

        const groupEls = () => Array.from(document.querySelectorAll(`#modeEditRows .free-row[data-group="${CSS.escape(group)}"]`));

        const longPressTimer = setTimeout(() => {
          if (mode2 !== 'pending') return;
          mode2 = 'armed';
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
          el.style.transition = 'transform .1s ease';
          el.style.transform = 'scale(1.02)';
          if (navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);

        const onMove = (ev) => {
          const dyStep = ev.clientY - lastY;
          const dxStep = ev.clientX - lastX;
          lastX = ev.clientX; lastY = ev.clientY;

          if (mode2 === 'pending'){
            window.scrollBy(0, -dyStep);
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX){
              mode2 = 'scrolling';
              clearTimeout(longPressTimer);
            }
            return;
          }
          if (mode2 === 'scrolling'){
            window.scrollBy(0, -dyStep);
            return;
          }
          if (mode2 === 'armed'){
            mode2 = 'dragging';
            el.style.transition = 'none';
            el.style.zIndex = 5;
            groupEls().forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
          }
          ev.preventDefault();
          const dy = ev.clientY - startY;
          el.style.transform = `translateY(${dy}px) scale(1.03)`;
          el.style.boxShadow = '0 8px 16px rgba(0,0,0,0.4)';

          const shift = Math.round(dy / rowStep);
          const newTarget = Math.max(0, Math.min(arr.length - 1, fromIndex + shift));
          if (newTarget !== targetIndex){
            targetIndex = newTarget;
            groupEls().forEach((t, i) => {
              if (t === el) return;
              let offset = 0;
              if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -rowStep;
              else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = rowStep;
              t.style.transform = offset ? `translateY(${offset}px)` : '';
            });
          }
        };

        const finish = () => {
          clearTimeout(longPressTimer);
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onCancel);
          groupEls().forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
        };
        const onUp = () => {
          const finalMode = mode2;
          finish();
          if (finalMode === 'dragging' && targetIndex !== fromIndex){
            const [moved] = arr.splice(fromIndex, 1);
            arr.splice(targetIndex, 0, moved);
            // Manuelles Umsortieren per Drag soll die spätere Trainingsreihenfolge genauso
            // beeinflussen wie das Ankreuzen selbst — daher wird die Position des verschobenen
            // Items in checkOrder synchron an seine neue Nachbarschaft in der Anzeige (arr)
            // angepasst, aber nur relativ zu anderen bereits selektierten Items (unselektierte
            // Items in arr haben ohnehin keinen Eintrag in checkOrder).
            if (state.selected.has(id)){
              state.checkOrder = state.checkOrder.filter(x => x !== id);
              const selectedArr = arr.filter(x => state.selected.has(x));
              const posInSelected = selectedArr.indexOf(id);
              if (posInSelected <= 0){
                state.checkOrder.unshift(id);
              } else {
                const prevId = selectedArr[posInSelected - 1];
                const insertAt = state.checkOrder.indexOf(prevId) + 1;
                state.checkOrder.splice(insertAt, 0, id);
              }
            }
            renderRows();
          } else if (finalMode !== 'scrolling'){
            if (state.selected.has(id)){
              state.selected.delete(id);
              state.checkOrder = state.checkOrder.filter(x => x !== id);
            } else {
              state.selected.add(id);
              state.checkOrder.push(id);
            }
            renderRows();
          }
        };
        const onCancel = () => { finish(); };

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onCancel);
      });
    });
  }
  renderRows();

  document.querySelectorAll('#modeEditTabs .period-btn').forEach(btn => {
    btn.onclick = () => {
      modeEditTab = btn.dataset.tab;
      renderTabs();
      renderRows();
    };
  });

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnSaveMode').onclick = async () => {
    if (!plan.modeLists) plan.modeLists = {};
    // Reihenfolge = tatsächliche Ankreuz-Reihenfolge (checkOrder), NICHT die
    // Anzeige-Reihenfolge nach Muskelgruppe — genau die Reihenfolge, in der später auch im
    // Training trainiert wird, soll der Reihenfolge entsprechen, in der man abgehakt hat.
    const flatten = state => state.checkOrder.filter(id => state.selected.has(id));
    plan.modeLists[mode] = {
      A: flatten(modeEditData.A),
      B: flatten(modeEditData.B)
    };
    await saveJSON('plan', plan);
    history.back();
  };
}

            <span class="mg-meta">${selCount ? selCount + '/' : ''}${ids.length} Übung${ids.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${itemsHTML}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        const g = btn.dataset.group;
        if (freeGroupOpen.has(g)) freeGroupOpen.delete(g); else freeGroupOpen.add(g);
        renderRows();
      };
    });

    wireFreeRowDrag();
  }

  function wireFreeRowDrag(){
    const LONG_PRESS_MS = 350;
    const MOVE_CANCEL_PX = 8;
    const rowStep = 68; // Zeilenhöhe (60px) + Abstand (8px), muss zur CSS-Lücke passen

    document.querySelectorAll('.free-row').forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        const group = el.dataset.group;
        const id = el.dataset.id;
        const arr = freeGroups[group];
        const fromIndex = arr.indexOf(id);
        let targetIndex = fromIndex;
        const startX = e.clientX, startY = e.clientY;
        let lastX = startX, lastY = startY;
        let mode = 'pending'; // pending -> armed -> dragging, oder pending -> scrolling

        const groupEls = () => Array.from(document.querySelectorAll(`.free-row[data-group="${CSS.escape(group)}"]`));

        const longPressTimer = setTimeout(() => {
          if (mode !== 'pending') return;
          mode = 'armed';
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
          el.style.transition = 'transform .1s ease';
          el.style.transform = 'scale(1.02)';
          if (navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);

        const onMove = (ev) => {
          const dyStep = ev.clientY - lastY;
          const dxStep = ev.clientX - lastX;
          lastX = ev.clientX; lastY = ev.clientY;

          if (mode === 'pending'){
            // Solange die Zeile noch nicht "gehalten" wird (Long-Press-Schwelle nicht
            // erreicht), lässt touch-action:pan-y auf .free-row den Browser das vertikale
            // Scrollen bereits selbst nativ übernehmen (inkl. Momentum) — hier wird nur noch
            // erkannt, WANN sich die Geste als Scrollen entpuppt, um den Drag-Timer abzubrechen.
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX){
              mode = 'scrolling';
              clearTimeout(longPressTimer);
            }
            return;
          }
          if (mode === 'scrolling'){
            // Native Fortsetzung des Scrollens durch den Browser selbst (touch-action:pan-y) —
            // hier ist nichts mehr zu tun.
            return;
          }
          if (mode === 'armed'){
            mode = 'dragging';
            el.style.transition = 'none';
            el.style.zIndex = 5;
            groupEls().forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
          }
          ev.preventDefault();
          const dy = ev.clientY - startY;
          el.style.transform = `translateY(${dy}px) scale(1.03)`;
          el.style.boxShadow = '0 8px 16px rgba(0,0,0,0.4)';

          const shift = Math.round(dy / rowStep);
          const newTarget = Math.max(0, Math.min(arr.length - 1, fromIndex + shift));
          if (newTarget !== targetIndex){
            targetIndex = newTarget;
            groupEls().forEach((t, i) => {
              if (t === el) return;
              let offset = 0;
              if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -rowStep;
              else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = rowStep;
              t.style.transform = offset ? `translateY(${offset}px)` : '';
            });
          }
        };

        const finish = () => {
          clearTimeout(longPressTimer);
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onCancel);
          groupEls().forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
        };
        const onUp = () => {
          const finalMode = mode;
          finish();
          if (finalMode === 'dragging' && targetIndex !== fromIndex){
            const [moved] = arr.splice(fromIndex, 1);
            arr.splice(targetIndex, 0, moved);
            renderRows();
          } else if (finalMode !== 'scrolling'){
            if (freeSelected.has(id)) freeSelected.delete(id); else freeSelected.add(id);
            renderRows();
          }
        };
        const onCancel = () => { finish(); };

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onCancel);
      });
    });
  }
  renderRows();

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnGo').onclick = () => {
    const orderedIds = orderedGroupNames().flatMap(g => freeGroups[g]);
    const list = orderedIds.filter(id => freeSelected.has(id)).map(id => plan.exercises.find(e => e.id === id));
    if (!list.length){ alert('Bitte mindestens eine Übung auswählen.'); return; }
    startSession(list);
  };
}

// Lädt eine Bilddatei, skaliert sie auf max. 300px Kantenlänge herunter
// und liefert sie als komprimiertes JPEG-DataURL zurück (klein genug fürs Storage).
function downscaleImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Bild konnte nicht geladen werden'));
      img.onload = () => {
        const maxDim = 300;
        let { width, height } = img;
        if (width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    const payload = { version: 1, exportedAt: new Date().toISOString(), plan, sessions, lastPerformance };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trainingsplan-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('btnImport').onclick = () => {
    document.getElementById('importFile').click();
  };
  document.getElementById('importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        if (!data.plan || !Array.isArray(data.plan.exercises)){
          alert('Diese Datei sieht nicht wie ein gültiger Export dieser App aus.');
          return;
        }
        if (!confirm('Import überschreibt deine aktuellen Übungen, Einheiten und den gespeicherten Fortschritt auf diesem Gerät. Fortfahren?')) return;
        plan = data.plan;
        sessions = Array.isArray(data.sessions) ? data.sessions : [];
        lastPerformance = data.lastPerformance && typeof data.lastPerformance === 'object' ? data.lastPerformance : {};
        await saveJSON('plan', plan);
        await saveJSON('sessions', sessions);
        await saveJSON('lastPerformance', lastPerformance);
        planSearchQuery = '';
        planGroupOpen = new Set();
        alert('Import erfolgreich.');
        renderSettings();
      }catch(err){
        alert('Datei konnte nicht gelesen werden: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  document.getElementById('btnReset').onclick = () => {
    openResetConfirmPrompt(async () => {
      clearInterval(timerHandle);
      clearInterval(restInterval);
      restState = null;
      active = null;
      plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
      sessions = [];
      lastPerformance = {};
      planSearchQuery = '';
      planGroupOpen = new Set();
      await saveJSON('plan', plan);
      await saveJSON('sessions', sessions);
      await saveJSON('lastPerformance', lastPerformance);
      await saveJSON('activeSession', null);
      alert('App wurde zurückgesetzt.');
      replaceView('home');
      renderHome();
    });
  };
}

// Zeigt ein Popup-Formular zum Anlegen einer komplett neuen Übung — mit denselben Feldern
// wie eine bestehende Zeile im Übungen-Editor (renderExerciseRowHTML(), auf ein temporäres
// Draft-Objekt angewendet). Beim Speichern wird die fertig ausgefüllte Übung direkt in
// plan.exercises eingefügt und gespeichert; die Muskelgruppen-Zuordnung (ex.muscleGroup) ist
// dabei die einzige Stelle, die die Einsortierung in Fortschritt/Frei-Auswahl/Modus-Editor
// steuert (siehe Abschnitt 14 der Trainingsdoku) — kein zusätzlicher Schritt nötig, die
// Übung erscheint danach automatisch überall an der richtigen Stelle.
// Führt beim Anlegen einer neuen Übung nach und nach durch die wichtigsten Fragen statt
// alles auf einmal in einem langen Formular zu zeigen — bewusst weggelassen werden dabei
// Felder, die ohnehin auf sinnvollen Standardwerten bleiben (3 Sätze, 8-12 Wdh, 0 kg
// Startgewicht) oder die automatisch aus anderen Antworten abgeleitet werden (Push/Pull/
// Legs aus der Muskelgruppe, siehe MUSCLE_GROUP_TO_BODYPART; "Muskeln Detail" bleibt leer
// und mainMuscle fällt beim Speichern auf die Muskelgruppe zurück — exakt wie im alten
// Einzelformular). Das Bild ist der letzte Schritt und lässt sich überspringen ("Später"),
// die Übung wird dann ohne Bild gespeichert und kann jederzeit im Übungen-Editor nachträglich
// ein Bild bekommen.
function openNewExerciseModal(){
  const MUSCLE_GROUP_TO_BODYPART = { Beine: 'legs', Bauch: 'legs', Schultern: 'push', Brust: 'push', Rücken: 'pull' };
  let draft = { id: null, name: '', sets: 3, repsMin: 8, repsMax: 12, secondsMin: 30, secondsMax: 60, weight: 0, category: 'oberkoerper', muscleGroup: 'Sonstige', mainMuscle: '', muscles: '', type: 'reps', assisted: false, bodyweightExercise: false };
  let stepIndex = 0;

  // Schritt-Definitionen: jeder Schritt liefert sein Inhalts-HTML und verkabelt seine
  // Eingaben selbst. "next()" wird von den einzelnen Schritten aufgerufen, sobald genug
  // Information vorliegt (z. B. direkt nach Tippen einer Option), nicht erst über einen
  // separaten "Weiter"-Button — das hält den Ablauf zügig.
  function stepsFor(){
    const steps = [];

    steps.push({
      title: 'Wie heißt die Übung?',
      render: (body, next) => {
        body.innerHTML = `
          <input type="text" id="wizName" value="${(draft.name || '').replace(/"/g,'&quot;')}" placeholder="z. B. Kreuzheben" style="width:100%; padding:14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:16px;">
          <button class="btn btn-primary" id="wizNameNext" style="width:100%; margin-top:16px;">Weiter</button>
        `;
        const input = body.querySelector('#wizName');
        input.focus();
        const submit = () => {
          if (!input.value.trim()){ alert('Bitte einen Namen eintragen.'); return; }
          draft.name = input.value.trim();
          next();
        };
        input.onkeydown = (ev) => { if (ev.key === 'Enter'){ ev.preventDefault(); input.blur(); submit(); } };
        body.querySelector('#wizNameNext').onclick = submit;
      }
    });

    steps.push({
      title: 'Körperbereich',
      render: (body, next) => {
        body.innerHTML = `
          <div class="wizard-choice-list">
            <button class="wizard-choice ${draft.category !== 'unterkoerper' ? 'selected' : ''}" data-val="oberkoerper">Oberkörper</button>
            <button class="wizard-choice ${draft.category === 'unterkoerper' ? 'selected' : ''}" data-val="unterkoerper">Unterkörper</button>
          </div>
        `;
        body.querySelectorAll('.wizard-choice').forEach(btn => {
          btn.onclick = () => { draft.category = btn.dataset.val; next(); };
        });
      }
    });

    steps.push({
      title: 'Wie wird trainiert?',
      render: (body, next) => {
        body.innerHTML = `
          <div class="wizard-choice-list">
            <button class="wizard-choice ${draft.type !== 'time' ? 'selected' : ''}" data-val="reps">Wiederholungen</button>
            <button class="wizard-choice ${draft.type === 'time' ? 'selected' : ''}" data-val="time">Zeit (z. B. Plank)</button>
          </div>
        `;
        body.querySelectorAll('.wizard-choice').forEach(btn => {
          btn.onclick = () => { draft.type = btn.dataset.val; next(); };
        });
      }
    });

    steps.push({
      title: 'Muskelgruppe',
      render: (body, next) => {
        body.innerHTML = `
          <div class="wizard-choice-list">
            ${MUSCLE_GROUP_ORDER.map(g => `<button class="wizard-choice ${draft.muscleGroup === g ? 'selected' : ''}" data-val="${g}">${g}</button>`).join('')}
          </div>
        `;
        body.querySelectorAll('.wizard-choice').forEach(btn => {
          btn.onclick = () => {
            draft.muscleGroup = btn.dataset.val;
            // Push/Pull/Legs automatisch ableiten (siehe MUSCLE_GROUP_TO_BODYPART) — für
            // "Arme" bewusst kein Automatismus (Bizeps=Pull, Trizeps=Push, nicht eindeutig),
            // bleibt dann ohne Zuordnung und lässt sich später im Übungen-Editor nachtragen.
            draft.bodyPart = MUSCLE_GROUP_TO_BODYPART[btn.dataset.val] || null;
            next();
          };
        });
      }
    });

    // Nur bei Wiederholungs-Übungen relevant (Zeit-Übungen wie Plank kennen kein Gewicht).
    if (draft.type !== 'time'){
      steps.push({
        title: 'Gewichtsart',
        render: (body, next) => {
          body.innerHTML = `
            <div class="wizard-choice-list">
              <button class="wizard-choice ${(!draft.assisted && !draft.bodyweightExercise) ? 'selected' : ''}" data-val="normal">Normales Gewicht</button>
              <button class="wizard-choice ${draft.assisted ? 'selected' : ''}" data-val="assisted">Unterstützt (z. B. Klimmzugmaschine)</button>
              <button class="wizard-choice ${draft.bodyweightExercise ? 'selected' : ''}" data-val="bodyweight">Eigenkörpergewicht (z. B. Klimmzüge)</button>
            </div>
          `;
          body.querySelectorAll('.wizard-choice').forEach(btn => {
            btn.onclick = () => {
              draft.assisted = btn.dataset.val === 'assisted';
              draft.bodyweightExercise = btn.dataset.val === 'bodyweight';
              next();
            };
          });
        }
      });
    }

    steps.push({
      title: 'Bild hinzufügen',
      subtitle: 'Optional — kannst du auch später im Übungen-Editor nachtragen.',
      render: (body, next) => {
        body.innerHTML = `
          ${draft.imageData ? `<img src="${draft.imageData}" alt="" style="width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:14px;">` : ''}
          <label class="btn btn-ghost" style="display:block; text-align:center; margin-bottom:10px;">
            ${draft.imageData ? 'Anderes Bild wählen' : 'Bild auswählen'}
            <input type="file" accept="image/*" id="wizImageInput" style="display:none;">
          </label>
          <button class="btn btn-primary" id="wizFinish" style="width:100%;">${draft.imageData ? 'Fertig' : 'Später · Fertig'}</button>
        `;
        body.querySelector('#wizImageInput').onchange = async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          try{
            draft.imageData = await downscaleImageFile(file);
            render(); // Schritt neu zeichnen, um Vorschau zu zeigen
          }catch(err){
            alert('Bild konnte nicht verarbeitet werden: ' + err.message);
          }
        };
        body.querySelector('#wizFinish').onclick = () => finish();
      }
    });

    return steps;
  }

  async function finish(){
    const newExercise = { ...draft, id: uid() };
    if (!newExercise.mainMuscle) newExercise.mainMuscle = newExercise.muscleGroup || '';
    plan.exercises.push(newExercise);
    planGroupOpen.add(newExercise.muscleGroup || 'Sonstige');
    await saveJSON('plan', plan);
    closeOverlay();
    renderPlanEditor();
  }

  function closeOverlay(){
    popOverlayStateIfOpen();
    removeOverlayEl();
  }
  function removeOverlayEl(){
    const el = document.getElementById('newExerciseOverlay');
    if (el) el.remove();
  }

  function render(fromPopState){
    const steps = stepsFor();
    if (stepIndex >= steps.length) stepIndex = steps.length - 1;
    const step = steps[stepIndex];

    const existing = document.getElementById('newExerciseOverlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'add-exercise-overlay centered-overlay';
    overlay.id = 'newExerciseOverlay';
    overlay.innerHTML = `
      <div class="add-exercise-modal" style="max-height:none;">
        <div class="add-exercise-modal-header">
          <div>
            <div class="wizard-progress">Schritt ${stepIndex + 1} von ${steps.length}</div>
            <div class="add-exercise-modal-title">${step.title}</div>
            ${step.subtitle ? `<div class="wizard-subtitle">${step.subtitle}</div>` : ''}
          </div>
          <button class="add-exercise-modal-close" id="newExerciseClose" aria-label="Abbrechen">✕</button>
        </div>
        <div class="new-exercise-modal-body" id="wizardBody"></div>
        ${stepIndex > 0 ? `<div class="add-exercise-modal-header" style="border-top:1px solid var(--border); border-bottom:none;">
          <button class="btn btn-ghost" id="wizBack" style="width:100%;">‹ Zurück</button>
        </div>` : ''}
      </div>
    `;
    document.body.appendChild(overlay);

    // Jeder Wizard-Schritt bekommt seinen eigenen History-Eintrag: Zurück-Taste geht damit
    // erst durch die Schritte zurück, bevor sie ganz aus dem Popup herausführt (statt beim
    // ersten Zurück-Tap direkt zur "Training starten"-Übersicht zu springen). Kommt render()
    // selbst durch einen popstate-Aufruf zustande (fromPopState), wird kein zusätzlicher
    // History-Eintrag gepusht — sonst würde jeder Zurück-Schritt gleichzeitig einen neuen
    // Vorwärts-Eintrag erzeugen.
    if (!fromPopState){
      pushOverlayState(() => {
        if (stepIndex > 0){
          stepIndex -= 1;
          render(true);
        } else {
          removeOverlayEl();
        }
      });
    }

    overlay.onclick = (ev) => { if (ev.target === overlay) closeOverlay(); };
    document.getElementById('newExerciseClose').onclick = closeOverlay;
    const backBtn = document.getElementById('wizBack');
    if (backBtn) backBtn.onclick = () => { popOverlayStateIfOpen(); stepIndex -= 1; render(); };

    const body = document.getElementById('wizardBody');
    const next = () => { stepIndex += 1; render(); };
    step.render(body, next);
  }

  render();
}

function renderPlanEditor(){
  app.innerHTML = `
    <div class="brand">
      <h1>Übungen</h1>
    </div>
    <div class="back-row">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <input type="text" id="planSearch" class="plan-search" placeholder="Übung oder Muskel suchen…" value="${(planSearchQuery || '').replace(/"/g,'&quot;')}">
    <div id="planRowsContainer"></div>
    <button class="btn btn-ghost" id="btnAdd" style="margin:4px 0 12px;">+ Übung hinzufügen</button>
    <button class="btn btn-primary" id="btnSave" style="margin-top:4px;">Speichern</button>
  `;

  function collectFormIntoPlan(){
    const textFields = new Set(['name', 'category', 'muscles', 'muscleGroup', 'bodyPart']);
    document.querySelectorAll('.plan-row').forEach(row=>{
      const i = Number(row.dataset.i);
      row.querySelectorAll('[data-field]').forEach(input=>{
        const field = input.dataset.field;
        plan.exercises[i][field] = textFields.has(field) ? input.value : Number(input.value);
      });
      row.querySelectorAll('[data-checkfield]').forEach(input=>{
        plan.exercises[i][input.dataset.checkfield] = input.checked;
      });
    });
  }

  function matchesSearch(ex, q){
    if (!q) return true;
    const hay = `${ex.name} ${ex.muscles || ''} ${ex.muscleGroup || ''}`.toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  function renderPlanRows(){
    const container = document.getElementById('planRowsContainer');
    const q = planSearchQuery.trim();
    const indexed = plan.exercises.map((ex, i) => ({ ex, i })).filter(({ ex }) => matchesSearch(ex, q));

    const groups = {};
    indexed.forEach(item => {
      const g = item.ex.muscleGroup || 'Sonstige';
      (groups[g] = groups[g] || []).push(item);
    });
    const orderedGroups = MUSCLE_GROUP_ORDER.filter(g => groups[g]);
    Object.keys(groups).forEach(g => { if (!orderedGroups.includes(g)) orderedGroups.push(g); });

    if (!orderedGroups.length){
      container.innerHTML = '<div class="history-empty">Keine Übungen gefunden.</div>';
      return;
    }

    container.innerHTML = orderedGroups.map(g => {
      const items = groups[g];
      const isOpen = q ? true : planGroupOpen.has(g);
      return `
        <div class="muscle-group">
          <button class="muscle-group-header" data-group="${g}" type="button">
            <span class="mg-name">${g}</span>
            <span class="mg-meta">${items.length} Übung${items.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${items.map(({ ex, i }) => renderExerciseRowHTML(ex, i)).join('')}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        const g = btn.dataset.group;
        if (planGroupOpen.has(g)) planGroupOpen.delete(g); else planGroupOpen.add(g);
        renderPlanRows();
      };
    });
    container.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        plan.exercises.splice(Number(btn.dataset.remove), 1);
        renderPlanRows();
      };
    });
    container.querySelectorAll('.type-select').forEach(sel => {
      sel.onchange = () => {
        collectFormIntoPlan();
        const i = Number(sel.dataset.i);
        plan.exercises[i].type = sel.value;
        if (sel.value === 'time'){
          if (plan.exercises[i].secondsMin == null) plan.exercises[i].secondsMin = 30;
          if (plan.exercises[i].secondsMax == null) plan.exercises[i].secondsMax = 60;
        } else {
          if (plan.exercises[i].repsMin == null) plan.exercises[i].repsMin = 8;
          if (plan.exercises[i].repsMax == null) plan.exercises[i].repsMax = 12;
          if (plan.exercises[i].weight == null) plan.exercises[i].weight = 0;
        }
        renderPlanRows();
      };
    });
    container.querySelectorAll('[data-checkfield]').forEach(input => {
      input.onchange = () => {
        const row = input.closest('.plan-row');
        const i = Number(row.dataset.i);
        plan.exercises[i][input.dataset.checkfield] = input.checked;
      };
    });
    container.querySelectorAll('[data-imageupload]').forEach(input => {
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        collectFormIntoPlan();
        const i = Number(input.dataset.imageupload);
        try{
          const dataUrl = await downscaleImageFile(file);
          plan.exercises[i].imageData = dataUrl;
          renderPlanRows();
        }catch(err){
          alert('Bild konnte nicht verarbeitet werden: ' + err.message);
        }
      };
    });
    container.querySelectorAll('[data-imageremove]').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        const i = Number(btn.dataset.imageremove);
        delete plan.exercises[i].imageData;
        renderPlanRows();
      };
    });
  }

  renderPlanRows();

  document.getElementById('planSearch').oninput = (e) => {
    collectFormIntoPlan();
    planSearchQuery = e.target.value;
    renderPlanRows();
  };
  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnAdd').onclick = () => {
    collectFormIntoPlan();
    openNewExerciseModal();
  };
  document.getElementById('btnSave').onclick = async () => {
    collectFormIntoPlan();
    await saveJSON('plan', plan);
    history.back();
  };
}

/* ---------------------------------------------------
   ACTIVE SESSION
--------------------------------------------------- */
function buildEntry(ex){
  const type = ex.type === 'time' ? 'time' : 'reps';
  const storedHistory = lastPerformance[ex.id];
  // Neue Struktur: Array der letzten bis zu 2 Sessions (jeweils ein Array von Sätzen).
  // Alte Struktur (nur die letzte Session als flaches Array von Sätzen) wird mitunterstützt.
  const history = Array.isArray(storedHistory) && storedHistory.length && Array.isArray(storedHistory[0])
    ? storedHistory
    : (Array.isArray(storedHistory) && storedHistory.length ? [storedHistory] : []);
  const remembered = history[0] || null;
  const defaultSets = type === 'time'
    ? Array.from({length: ex.sets}, () => ({ seconds: null, done: false }))
    : Array.from({length: ex.sets}, () => ({ reps: null, weight: ex.weight || null, done: false }));
  return {
    exerciseId: ex.id,
    name: ex.name,
    type,
    target: type === 'time'
      ? { sets: ex.sets, secondsMin: ex.secondsMin, secondsMax: ex.secondsMax }
      : { sets: ex.sets, repsMin: ex.repsMin, repsMax: ex.repsMax, weight: ex.weight },
    // Referenz für die Anzeige "Letztes Mal" / "Vorletztes Mal": bis zu die letzten 2 Sessions.
    referenceHistory: history.length ? history.map(sets => sets.map(s => ({ ...s }))) : null,
    sets: (remembered && remembered.length) ? remembered.map(s => ({ ...s, done: false })) : defaultSets
  };
}

function startSession(exerciseList){
  clearInterval(restInterval);
  restState = null;
  addExerciseOpen = false;
  active = {
    startedAt: Date.now(),
    currentIndex: 0,
    entries: exerciseList.map(buildEntry)
  };
  pushView('active');
  renderActive();
  timerHandle = setInterval(updateTimerDisplay, 1000);
  persistActiveSession();
}

// Startet ein neues Training mit denselben Übungen wie eine vergangene Einheit.
// Übungen, die inzwischen aus dem Plan gelöscht wurden, werden übersprungen.
function repeatSession(session){
  const exerciseList = session.entries
    .map(e => plan.exercises.find(x => x.id === e.exerciseId))
    .filter(Boolean);
  if (!exerciseList.length){
    alert('Keine der Übungen aus dieser Einheit ist noch in deinem Plan vorhanden.');
    return;
  }
  if (active){
    if (!confirm('Es läuft bereits ein Training. Dieses verwerfen und die alte Einheit erneut starten?')) return;
    clearInterval(timerHandle);
    clearInterval(restInterval);
    restState = null;
    active = null;
    persistActiveSession();
  }
  startSession(exerciseList);
}

function updateTimerDisplay(){
  const el = document.getElementById('plateTime');
  if (!el) return;
  const sec = Math.floor((Date.now() - active.startedAt)/1000);
  el.textContent = fmtDuration(sec);
}

let addExerciseOpen = false;
let addExerciseGroupOpen = new Set();
function initials(name){
  const words = name.trim().split(/\s+/);
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function isEntryDone(entry){
  return entry.sets.length > 0 && entry.sets.every(s => s.done);
}
function advanceToNextExercise(){
  if (active.currentIndex < active.entries.length - 1) active.currentIndex++;
}
// Simuliert natives, flüssig ausklingendes Momentum-Scrolling (wie in den meisten Apps),
// nachdem der Finger losgelassen wurde. Wird gebraucht, weil touch-action:none auf den
// Kacheln natives Scrollen unterbindet und wir es deshalb per JS nachbilden müssen.
function applyScrollMomentum(axis, initialVelocity, stripEl){
  // initialVelocity ist in px/ms; zu kleine Werte lohnen keine Animation.
  if (!axis || Math.abs(initialVelocity) < 0.02) return;
  let velocity = Math.max(-3, Math.min(3, initialVelocity)); // px/ms, gedeckelt
  const friction = 0.95; // Abklingfaktor pro Frame (~60fps)
  let lastTs = null;

  function step(ts){
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(32, ts - lastTs); // Frame-Zeit deckeln gegen Ausreißer
    lastTs = ts;
    const delta = velocity * dt;
    if (axis === 'x'){
      if (stripEl) stripEl.scrollLeft += delta;
    } else {
      window.scrollBy(0, delta);
    }
    velocity *= Math.pow(friction, dt / 16.67);
    if (Math.abs(velocity) > 0.02){
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
}

function wireThumbDrag(){
  const strip = app.querySelector('.thumb-strip');
  const thumbs = Array.from(app.querySelectorAll('.thumb[data-thumb]'));
  const step = 70; // Kachelbreite (60px) + Abstand (10px), muss zur CSS-Lücke passen
  const LONG_PRESS_MS = 350;
  const MOVE_CANCEL_PX = 8;

  thumbs.forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      const fromIndex = Number(el.dataset.thumb);
      let targetIndex = fromIndex;
      const startX = e.clientX;
      const startY = e.clientY;
      let lastX = startX;
      let lastY = startY;
      // mode: 'pending' (noch unentschieden) -> 'armed' (lang genug gehalten) -> 'dragging'
      //        oder 'pending' -> 'scrolling' (Finger hat sich zu früh bewegt)
      let mode = 'pending';
      let scrollAxis = null; // 'x' oder 'y', wird beim ersten deutlichen Ausschlag festgelegt
      let lastMoveTime = performance.now();
      let velocity = 0; // px/ms in der aktiven Scroll-Achse, für Momentum nach dem Loslassen

      const longPressTimer = setTimeout(() => {
        if (mode !== 'pending') return;
        mode = 'armed';
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        el.style.transition = 'transform .1s ease';
        el.style.transform = 'scale(1.08)';
        if (navigator.vibrate) navigator.vibrate(10);
      }, LONG_PRESS_MS);

      const beginDrag = () => {
        mode = 'dragging';
        el.style.transition = 'none';
        el.style.zIndex = 5;
        thumbs.forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
      };

      const onMove = (ev) => {
        const now = performance.now();
        const dt = Math.max(1, now - lastMoveTime);
        const dxStep = ev.clientX - lastX;
        const dyStep = ev.clientY - lastY;
        lastX = ev.clientX;
        lastY = ev.clientY;
        lastMoveTime = now;

        if (mode === 'pending'){
          // touch-action:none blockiert natives Scrollen auf den Kacheln komplett,
          // deshalb bilden wir das Scrollen selbst nach, solange noch nicht "gehalten" wurde.
          // Erst wenn eine Richtung eindeutig erkannt ist, wird nur noch diese eine Achse bewegt,
          // damit schräges Wischen nicht gleichzeitig die Seite hoch/runter schiebt.
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          if (!scrollAxis && (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX)){
            scrollAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            mode = 'scrolling';
            clearTimeout(longPressTimer);
            if (scrollAxis === 'x'){ if (strip) strip.scrollLeft -= dxStep; }
            else { window.scrollBy(0, -dyStep); }
          }
          return;
        }
        if (mode === 'scrolling'){
          if (scrollAxis === 'x'){ velocity = -dxStep / dt; if (strip) strip.scrollLeft -= dxStep; }
          else { velocity = -dyStep / dt; window.scrollBy(0, -dyStep); }
          return;
        }
        if (mode === 'armed') beginDrag();

        ev.preventDefault();
        const dx = ev.clientX - startX;
        el.style.transform = `translateX(${dx}px) translateY(-6px) scale(1.1)`;
        el.style.boxShadow = '0 10px 18px rgba(0,0,0,0.45)';

        const shift = Math.round(dx / step);
        const newTarget = Math.max(0, Math.min(thumbs.length - 1, fromIndex + shift));
        if (newTarget !== targetIndex){
          targetIndex = newTarget;
          thumbs.forEach((t, i) => {
            if (t === el) return;
            let offset = 0;
            if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -step;
            else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = step;
            t.style.transform = offset ? `translateX(${offset}px)` : '';
          });
        }
      };

      const finish = () => {
        clearTimeout(longPressTimer);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onCancel);
        thumbs.forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
      };

      const onUp = () => {
        const finalMode = mode;
        const finalAxis = scrollAxis;
        const finalVelocity = velocity;
        finish();
        if (finalMode === 'dragging' && targetIndex !== fromIndex){
          const [moved] = active.entries.splice(fromIndex, 1);
          active.entries.splice(targetIndex, 0, moved);
          active.currentIndex = targetIndex;
          renderActive();
        } else if (finalMode === 'scrolling'){
          applyScrollMomentum(finalAxis, finalVelocity, strip);
        } else {
          active.currentIndex = fromIndex;
          renderActive();
        }
      };
      const onCancel = () => { finish(); };

      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onCancel);
    });
  });
}

function renderActive(){
  persistActiveSession();
  if (active.currentIndex >= active.entries.length) active.currentIndex = Math.max(0, active.entries.length - 1);
  const ei = active.currentIndex;
  const entry = active.entries[ei];
  const currentPlanEx = entry ? plan.exercises.find(x => x.id === entry.exerciseId) : null;

  const thumbsHTML = active.entries.map((e, i) => {
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const img = planEx && planEx.imageData;
    return `
    <button class="thumb ${i === ei ? 'active' : ''} ${isEntryDone(e) ? 'done' : ''}" data-thumb="${i}" aria-label="${e.name}">
      <span class="thumb-media">
        ${img ? `<img class="thumb-img" src="${img}" alt="">` : `<span class="thumb-initials">${initials(e.name)}</span>`}

    </button>

  }).join('') + `<button class="thumb thumb-add" id="thumbAdd" aria-label="Übung hinzufügen">+</button>`;

  const addedIds = new Set(active.entries.map(x => x.exerciseId));
  const available = plan.exercises.filter(x => !addedIds.has(x.id));
  const availableGroups = {};
  available.forEach(x => {
    const g = x.muscleGroup || 'Sonstige';
    (availableGroups[g] = availableGroups[g] || []).push(x);
  });
  const orderedAvailableGroups = MUSCLE_GROUP_ORDER.filter(g => availableGroups[g] && availableGroups[g].length);
  Object.keys(availableGroups).forEach(g => { if (!orderedAvailableGroups.includes(g)) orderedAvailableGroups.push(g); });

  const addExerciseHTML = !addExerciseOpen ? '' : `
    <div class="add-exercise-overlay" id="addExerciseOverlay">
      <div class="add-exercise-modal">
        <div class="add-exercise-modal-header">
          <div class="add-exercise-modal-title">Übung hinzufügen</div>
          <button class="add-exercise-modal-close" id="btnCloseAddExercise" aria-label="Schließen">✕</button>
        </div>
        <div class="add-exercise-modal-body">
          ${available.length ? orderedAvailableGroups.map(g => {
            const items = availableGroups[g];
            const collapsible = items.length > 5;
            const isOpen = !collapsible || addExerciseGroupOpen.has(g);
            const itemsHTML = items.map(x => `
              <div class="add-exercise-row" data-addex="${x.id}" role="button" tabindex="0">
                ${x.imageData ? `<img class="add-exercise-thumb" src="${x.imageData}" alt="">` : `<span class="add-exercise-thumb-fallback">${initials(x.name)}</span>`}
                <div class="add-exercise-mid">
                  <div class="add-exercise-name">${x.name}</div>
                  <div class="add-exercise-meta">${x.mainMuscle || x.muscleGroup || ''}</div>
                </div>
                <span class="add-exercise-plus">+</span>
              </div>
            `).join('');
            if (!collapsible){
              return `<div class="add-exercise-group-label">${g}</div>${itemsHTML}`;
            }
            return `
              <button class="muscle-group-header" data-addexgroup="${g}" type="button">
                <span class="mg-name">${g}</span>
                <span class="mg-meta">${items.length} Übungen ${isOpen ? '▾' : '▸'}</span>
              </button>
              <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
                ${itemsHTML}
              </div>
            `;
          }).join('') : '<div class="history-empty">Alle Übungen aus dem Plan sind bereits in dieser Einheit.</div>'}
        </div>
      </div>
    </div>
  `;

  const setsHeaderHTML = entry ? (entry.type === 'time' ? `
    <div class="sets-header sets-header-time">
      <span class="sets-header-cell">#</span>
      <span class="sets-header-cell">Sek.</span>
      <span class="sets-header-cell"></span>
      <span class="sets-header-cell"></span>
    </div>
  ` : `

      <input type="number" inputmode="numeric" enterkeyhint="done" placeholder="Wdh" value="${set.reps ?? ''}" data-field="reps">

      <button class="set-check ${set.done ? 'checked' : ''}" data-checkset="${si}" aria-label="Satz ${si+1} erledigt">✓</button>
      <button class="icon-x" data-removeset="${si}" aria-label="Satz ${si+1} entfernen">✕</button>

  const referenceHTML = (entry && entry.referenceHistory && entry.referenceHistory.length) ? `
    <div class="reference-block">

          ${sets.map((r,i) => `
            <div class="reference-row">
              <span>#${i+1}</span>
              <span>${entry.type === 'time' ? fmtSec(r.seconds) : `${r.reps ?? '–'} × ${r.weight ?? '–'} kg`}</span>
            </div>
          `).join('')}
        </div>
      `).join('')}

  ` : '';

  const needsBodyWeightWarning = !!(currentPlanEx && (currentPlanEx.assisted || currentPlanEx.bodyweightExercise) && !plan.bodyWeight);
  const bodyWeightWarningHTML = needsBodyWeightWarning ? `
    <div class="reference-block" style="border-color:var(--accent-2); margin-bottom:12px;">
      ⚠️ Kein Körpergewicht hinterlegt — VOL zeigt aktuell nur das eingestellte Gerätegewicht statt des tatsächlich bewegten Gewichts. Trag dein Körpergewicht im Übungen-Tab ein, damit es korrekt berechnet wird.

  ` : '';

  const exerciseCardHTML = !entry ? '<div class="history-empty">Keine Übungen in dieser Einheit.</div>' : `

            ev.preventDefault();
            input.blur(); // löst onchange aus und schließt die virtuelle Tastatur
          }
        };
        input.onchange = () => {
          const val = input.value === '' ? null : Number(input.value);
          const field = input.dataset.field;
          entry.sets[si][field] = val;
          persistActiveSession();
        };
        if (entry.type !== 'time'){
          input.oninput = () => {
            const s = entry.sets[si];
            const reps = input.dataset.field === 'reps' ? (input.value === '' ? null : Number(input.value)) : s.reps;
            const weight = input.dataset.field === 'weight' ? (input.value === '' ? null : Number(input.value)) : s.weight;
            const volEl = row.querySelector('.set-vol');
            if (volEl) volEl.textContent = setMetricValue(reps, weight, currentPlanEx, activeSetMetricMode) ?? '–';
          };
