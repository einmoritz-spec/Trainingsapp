  };
}

function renderPlanEditor(){
  app.innerHTML = `
    <div class="brand">
      <h1>Übungen</h1>
    </div>
    <div class="back-row">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <input type="text" id="planSearch" class="plan-search" placeholder="Übung oder Muskel suchen…" value="${(planSearchQuery || '').replace(/"/g,'&quot;')}">
    <div id="planRowsContainer"></div>
    <button class="btn btn-ghost" id="btnAdd" style="margin:4px 0 12px;">+ Übung hinzufügen</button>
    <button class="btn btn-primary" id="btnSave" style="margin-top:4px;">Speichern</button>
  `;

  function collectFormIntoPlan(){
    const textFields = new Set(['name', 'category', 'muscles', 'muscleGroup']);
    document.querySelectorAll('.plan-row').forEach(row=>{
      const i = Number(row.dataset.i);
      row.querySelectorAll('[data-field]').forEach(input=>{
        const field = input.dataset.field;
        plan.exercises[i][field] = textFields.has(field) ? input.value : Number(input.value);
      });
      row.querySelectorAll('[data-checkfield]').forEach(input=>{
        plan.exercises[i][input.dataset.checkfield] = input.checked;
      });
    });
  }

  function matchesSearch(ex, q){
    if (!q) return true;
    const hay = `${ex.name} ${ex.muscles || ''} ${ex.muscleGroup || ''}`.toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  function renderPlanRows(){
    const container = document.getElementById('planRowsContainer');
    const q = planSearchQuery.trim();
    const indexed = plan.exercises.map((ex, i) => ({ ex, i })).filter(({ ex }) => matchesSearch(ex, q));

    const groups = {};
    indexed.forEach(item => {
      const g = item.ex.muscleGroup || 'Sonstige';
      (groups[g] = groups[g] || []).push(item);
    });
    const orderedGroups = MUSCLE_GROUP_ORDER.filter(g => groups[g]);
    Object.keys(groups).forEach(g => { if (!orderedGroups.includes(g)) orderedGroups.push(g); });

    if (!orderedGroups.length){
      container.innerHTML = '<div class="history-empty">Keine Übungen gefunden.</div>';
      return;
    }

    container.innerHTML = orderedGroups.map(g => {
      const items = groups[g];
      const isOpen = q ? true : planGroupOpen.has(g);
      return `
        <div class="muscle-group">
          <button class="muscle-group-header" data-group="${g}" type="button">
            <span class="mg-name">${g}</span>
            <span class="mg-meta">${items.length} Übung${items.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${items.map(({ ex, i }) => renderExerciseRowHTML(ex, i)).join('')}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        const g = btn.dataset.group;
        if (planGroupOpen.has(g)) planGroupOpen.delete(g); else planGroupOpen.add(g);
        renderPlanRows();
      };
    });
    container.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        plan.exercises.splice(Number(btn.dataset.remove), 1);
        renderPlanRows();
      };
    });
    container.querySelectorAll('.type-select').forEach(sel => {
      sel.onchange = () => {
        collectFormIntoPlan();
        const i = Number(sel.dataset.i);
        plan.exercises[i].type = sel.value;
        if (sel.value === 'time'){
          if (plan.exercises[i].secondsMin == null) plan.exercises[i].secondsMin = 30;
          if (plan.exercises[i].secondsMax == null) plan.exercises[i].secondsMax = 60;
        } else {
          if (plan.exercises[i].repsMin == null) plan.exercises[i].repsMin = 8;
          if (plan.exercises[i].repsMax == null) plan.exercises[i].repsMax = 12;
          if (plan.exercises[i].weight == null) plan.exercises[i].weight = 0;
        }
        renderPlanRows();
      };
    });
    container.querySelectorAll('[data-checkfield]').forEach(input => {
      input.onchange = () => {
        const row = input.closest('.plan-row');
        const i = Number(row.dataset.i);
        plan.exercises[i][input.dataset.checkfield] = input.checked;
      };
    });
    container.querySelectorAll('[data-imageupload]').forEach(input => {
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        collectFormIntoPlan();
        const i = Number(input.dataset.imageupload);
        try{
          const dataUrl = await downscaleImageFile(file);
          plan.exercises[i].imageData = dataUrl;
          renderPlanRows();
        }catch(err){
          alert('Bild konnte nicht verarbeitet werden: ' + err.message);
        }
      };
    });
    container.querySelectorAll('[data-imageremove]').forEach(btn => {
      btn.onclick = () => {
        collectFormIntoPlan();
        const i = Number(btn.dataset.imageremove);
        delete plan.exercises[i].imageData;
        renderPlanRows();
      };
    });
  }

  renderPlanRows();

  document.getElementById('planSearch').oninput = (e) => {
    collectFormIntoPlan();
    planSearchQuery = e.target.value;
    renderPlanRows();
  };
  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnAdd').onclick = () => {
    collectFormIntoPlan();
    plan.exercises.push({ id: uid(), name: 'Neue Übung', sets: 3, repsMin: 8, repsMax: 12, weight: 0, category: 'oberkoerper', muscleGroup: 'Sonstige', mainMuscle: '', muscles: '', type: 'reps' });
    planGroupOpen.add('Sonstige');
    renderPlanRows();
  };
  document.getElementById('btnSave').onclick = async () => {
    collectFormIntoPlan();
    await saveJSON('plan', plan);
    history.back();
  };
}

--------------------------------------------------- */
function buildEntry(ex){
  const type = ex.type === 'time' ? 'time' : 'reps';
  const storedHistory = lastPerformance[ex.id];
  // Neue Struktur: Array der letzten bis zu 2 Sessions (jeweils ein Array von Sätzen).
  // Alte Struktur (nur die letzte Session als flaches Array von Sätzen) wird mitunterstützt.
  const history = Array.isArray(storedHistory) && storedHistory.length && Array.isArray(storedHistory[0])
    ? storedHistory
    : (Array.isArray(storedHistory) && storedHistory.length ? [storedHistory] : []);
  const remembered = history[0] || null;
  const defaultSets = type === 'time'
    ? Array.from({length: ex.sets}, () => ({ seconds: null, done: false }))
    : Array.from({length: ex.sets}, () => ({ reps: null, weight: ex.weight || null, done: false }));
  return {
    exerciseId: ex.id,
    name: ex.name,
    type,
    target: type === 'time'
      ? { sets: ex.sets, secondsMin: ex.secondsMin, secondsMax: ex.secondsMax }
      : { sets: ex.sets, repsMin: ex.repsMin, repsMax: ex.repsMax, weight: ex.weight },
    // Referenz für die Anzeige "Letztes Mal" / "Vorletztes Mal": bis zu die letzten 2 Sessions.
    referenceHistory: history.length ? history.map(sets => sets.map(s => ({ ...s }))) : null,
    sets: (remembered && remembered.length) ? remembered.map(s => ({ ...s, done: false })) : defaultSets
  };
}

function startSession(exerciseList){
  clearInterval(restInterval);
  restState = null;
  addExerciseOpen = false;
  active = {
    startedAt: Date.now(),
    currentIndex: 0,
    entries: exerciseList.map(buildEntry)
  };
  pushView('active');
  renderActive();
  timerHandle = setInterval(updateTimerDisplay, 1000);
  persistActiveSession();
}

// Startet ein neues Training mit denselben Übungen wie eine vergangene Einheit.
// Übungen, die inzwischen aus dem Plan gelöscht wurden, werden übersprungen.
function repeatSession(session){
  const exerciseList = session.entries
    .map(e => plan.exercises.find(x => x.id === e.exerciseId))
    .filter(Boolean);
  if (!exerciseList.length){
    alert('Keine der Übungen aus dieser Einheit ist noch in deinem Plan vorhanden.');
    return;
  }
  if (active){
    if (!confirm('Es läuft bereits ein Training. Dieses verwerfen und die alte Einheit erneut starten?')) return;
    clearInterval(timerHandle);
    clearInterval(restInterval);
    restState = null;
    active = null;
    persistActiveSession();
  }
  startSession(exerciseList);
}

function updateTimerDisplay(){
  const el = document.getElementById('plateTime');
  if (!el) return;
  const sec = Math.floor((Date.now() - active.startedAt)/1000);
  el.textContent = fmtDuration(sec);
}

let addExerciseOpen = false;
let addExerciseGroupOpen = new Set();
function initials(name){
  const words = name.trim().split(/\s+/);
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function isEntryDone(entry){
  return entry.sets.length > 0 && entry.sets.every(s => s.done);
}
function advanceToNextExercise(){
  if (active.currentIndex < active.entries.length - 1) active.currentIndex++;
}
// Simuliert natives, flüssig ausklingendes Momentum-Scrolling (wie in den meisten Apps),
// nachdem der Finger losgelassen wurde. Wird gebraucht, weil touch-action:none auf den
// Kacheln natives Scrollen unterbindet und wir es deshalb per JS nachbilden müssen.
function applyScrollMomentum(axis, initialVelocity, stripEl){
  // initialVelocity ist in px/ms; zu kleine Werte lohnen keine Animation.
  if (!axis || Math.abs(initialVelocity) < 0.02) return;
  let velocity = Math.max(-3, Math.min(3, initialVelocity)); // px/ms, gedeckelt
  const friction = 0.95; // Abklingfaktor pro Frame (~60fps)
  let lastTs = null;

  function step(ts){
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(32, ts - lastTs); // Frame-Zeit deckeln gegen Ausreißer
    lastTs = ts;
    const delta = velocity * dt;
    if (axis === 'x'){
      if (stripEl) stripEl.scrollLeft += delta;
    } else {
      window.scrollBy(0, delta);
    }
    velocity *= Math.pow(friction, dt / 16.67);
    if (Math.abs(velocity) > 0.02){
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
}

function wireThumbDrag(){
  const strip = app.querySelector('.thumb-strip');
  const thumbs = Array.from(app.querySelectorAll('.thumb[data-thumb]'));
  const step = 70; // Kachelbreite (60px) + Abstand (10px), muss zur CSS-Lücke passen
  const LONG_PRESS_MS = 350;
  const MOVE_CANCEL_PX = 8;

  thumbs.forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      const fromIndex = Number(el.dataset.thumb);
      let targetIndex = fromIndex;
      const startX = e.clientX;
      const startY = e.clientY;
      let lastX = startX;
      let lastY = startY;
      // mode: 'pending' (noch unentschieden) -> 'armed' (lang genug gehalten) -> 'dragging'
      //        oder 'pending' -> 'scrolling' (Finger hat sich zu früh bewegt)
      let mode = 'pending';
      let scrollAxis = null; // 'x' oder 'y', wird beim ersten deutlichen Ausschlag festgelegt
      let lastMoveTime = performance.now();
      let velocity = 0; // px/ms in der aktiven Scroll-Achse, für Momentum nach dem Loslassen

      const longPressTimer = setTimeout(() => {
        if (mode !== 'pending') return;
        mode = 'armed';
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        el.style.transition = 'transform .1s ease';
        el.style.transform = 'scale(1.08)';
        if (navigator.vibrate) navigator.vibrate(10);
      }, LONG_PRESS_MS);

      const beginDrag = () => {
        mode = 'dragging';
        el.style.transition = 'none';
        el.style.zIndex = 5;
        thumbs.forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
      };

      const onMove = (ev) => {
        const now = performance.now();
        const dt = Math.max(1, now - lastMoveTime);
        const dxStep = ev.clientX - lastX;
        const dyStep = ev.clientY - lastY;
        lastX = ev.clientX;
        lastY = ev.clientY;
        lastMoveTime = now;

        if (mode === 'pending'){
          // touch-action:none blockiert natives Scrollen auf den Kacheln komplett,
          // deshalb bilden wir das Scrollen selbst nach, solange noch nicht "gehalten" wurde.
          // Erst wenn eine Richtung eindeutig erkannt ist, wird nur noch diese eine Achse bewegt,
          // damit schräges Wischen nicht gleichzeitig die Seite hoch/runter schiebt.
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          if (!scrollAxis && (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX)){
            scrollAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            mode = 'scrolling';
            clearTimeout(longPressTimer);
            if (scrollAxis === 'x'){ if (strip) strip.scrollLeft -= dxStep; }
            else { window.scrollBy(0, -dyStep); }
          }
          return;
        }
        if (mode === 'scrolling'){
          if (scrollAxis === 'x'){ velocity = -dxStep / dt; if (strip) strip.scrollLeft -= dxStep; }
          else { velocity = -dyStep / dt; window.scrollBy(0, -dyStep); }
          return;
        }
        if (mode === 'armed') beginDrag();

        ev.preventDefault();
        const dx = ev.clientX - startX;
        el.style.transform = `translateX(${dx}px) translateY(-6px) scale(1.1)`;
        el.style.boxShadow = '0 10px 18px rgba(0,0,0,0.45)';

        const shift = Math.round(dx / step);
        const newTarget = Math.max(0, Math.min(thumbs.length - 1, fromIndex + shift));
        if (newTarget !== targetIndex){
          targetIndex = newTarget;
          thumbs.forEach((t, i) => {
            if (t === el) return;
            let offset = 0;
            if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -step;
            else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = step;
            t.style.transform = offset ? `translateX(${offset}px)` : '';
          });
        }
      };

      const finish = () => {
        clearTimeout(longPressTimer);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onCancel);
        thumbs.forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
      };

      const onUp = () => {
        const finalMode = mode;
        const finalAxis = scrollAxis;
        const finalVelocity = velocity;
        finish();
        if (finalMode === 'dragging' && targetIndex !== fromIndex){
          const [moved] = active.entries.splice(fromIndex, 1);
          active.entries.splice(targetIndex, 0, moved);
          active.currentIndex = targetIndex;
          renderActive();
        } else if (finalMode === 'scrolling'){
          applyScrollMomentum(finalAxis, finalVelocity, strip);
        } else {
          active.currentIndex = fromIndex;
          renderActive();
        }
      };
      const onCancel = () => { finish(); };

      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onCancel);
    });
  });
}

function renderActive(){
  persistActiveSession();
  if (active.currentIndex >= active.entries.length) active.currentIndex = Math.max(0, active.entries.length - 1);
  const ei = active.currentIndex;
  const entry = active.entries[ei];
  const currentPlanEx = entry ? plan.exercises.find(x => x.id === entry.exerciseId) : null;

  const thumbsHTML = active.entries.map((e, i) => {
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const img = planEx && planEx.imageData;
    return `
    <button class="thumb ${i === ei ? 'active' : ''} ${isEntryDone(e) ? 'done' : ''}" data-thumb="${i}" aria-label="${e.name}">
      <span class="thumb-media">
        ${img ? `<img class="thumb-img" src="${img}" alt="">` : `<span class="thumb-initials">${initials(e.name)}</span>`}
      </span>
      ${isEntryDone(e) ? '<span class="thumb-check">✓</span>' : ''}
    </button>
  `;
  }).join('') + `<button class="thumb thumb-add" id="thumbAdd" aria-label="Übung hinzufügen">+</button>`;

  const addedIds = new Set(active.entries.map(x => x.exerciseId));
  const available = plan.exercises.filter(x => !addedIds.has(x.id));
  const availableGroups = {};
  available.forEach(x => {
    const g = x.muscleGroup || 'Sonstige';
    (availableGroups[g] = availableGroups[g] || []).push(x);
  });
  const orderedAvailableGroups = MUSCLE_GROUP_ORDER.filter(g => availableGroups[g] && availableGroups[g].length);
  Object.keys(availableGroups).forEach(g => { if (!orderedAvailableGroups.includes(g)) orderedAvailableGroups.push(g); });

  const addExerciseHTML = !addExerciseOpen ? '' : `
    <div class="add-exercise-overlay" id="addExerciseOverlay">
      <div class="add-exercise-modal">
        <div class="add-exercise-modal-header">
          <div class="add-exercise-modal-title">Übung hinzufügen</div>
          <button class="add-exercise-modal-close" id="btnCloseAddExercise" aria-label="Schließen">✕</button>
        </div>
        <div class="add-exercise-modal-body">
          ${available.length ? orderedAvailableGroups.map(g => {
            const items = availableGroups[g];
            const collapsible = items.length > 5;
            const isOpen = !collapsible || addExerciseGroupOpen.has(g);
            const itemsHTML = items.map(x => `
              <div class="add-exercise-row" data-addex="${x.id}" role="button" tabindex="0">
                ${x.imageData ? `<img class="add-exercise-thumb" src="${x.imageData}" alt="">` : `<span class="add-exercise-thumb-fallback">${initials(x.name)}</span>`}
                <div class="add-exercise-mid">
                  <div class="add-exercise-name">${x.name}</div>
                  <div class="add-exercise-meta">${x.mainMuscle || x.muscleGroup || ''}</div>
                </div>
                <span class="add-exercise-plus">+</span>
              </div>
            `).join('');
            if (!collapsible){
              return `<div class="add-exercise-group-label">${g}</div>${itemsHTML}`;
            }
            return `
              <button class="muscle-group-header" data-addexgroup="${g}" type="button">
                <span class="mg-name">${g}</span>
                <span class="mg-meta">${items.length} Übungen ${isOpen ? '▾' : '▸'}</span>
              </button>
              <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
                ${itemsHTML}
              </div>
            `;
          }).join('') : '<div class="history-empty">Alle Übungen aus dem Plan sind bereits in dieser Einheit.</div>'}
        </div>
      </div>
    </div>
  `;

  const setsHeaderHTML = entry ? (entry.type === 'time' ? `
    <div class="sets-header sets-header-time">
      <span class="sets-header-cell">#</span>
      <span class="sets-header-cell">Sek.</span>
      <span class="sets-header-cell"></span>
      <span class="sets-header-cell"></span>
    </div>
  ` : `
    <div class="sets-header">
      <span class="sets-header-cell">#</span>
      <span class="sets-header-cell">KG</span>
      <span class="sets-header-cell">WDH</span>
      <span class="sets-header-cell">VOL</span>
      <span class="sets-header-cell"></span>
      <span class="sets-header-cell"></span>
    </div>
  `) : '';

  const setsHTML = entry ? entry.sets.map((set, si) => entry.type === 'time' ? `
    <div class="set-row set-row-time ${set.done ? 'set-done' : ''}" data-set="${si}">
      <span class="set-idx">${si+1}</span>
      <input type="number" inputmode="numeric" enterkeyhint="done" placeholder="Sekunden" value="${set.seconds ?? ''}" data-field="seconds">
      <button class="set-check ${set.done ? 'checked' : ''}" data-checkset="${si}" aria-label="Satz ${si+1} erledigt">✓</button>
      <button class="icon-x" data-removeset="${si}" aria-label="Satz ${si+1} entfernen">✕</button>
    </div>
  ` : `
    <div class="set-row ${set.done ? 'set-done' : ''}" data-set="${si}">
      <span class="set-idx">${si+1}</span>
      <input type="number" inputmode="decimal" enterkeyhint="done" placeholder="kg" step="0.5" value="${currentPlanEx && currentPlanEx.noWeight ? '' : (set.weight ?? '')}" data-field="weight" ${currentPlanEx && currentPlanEx.noWeight ? 'disabled' : ''}>
      <input type="number" inputmode="numeric" enterkeyhint="done" placeholder="Wdh" value="${set.reps ?? ''}" data-field="reps">
      <span class="set-vol">${(currentPlanEx && currentPlanEx.noWeight) ? '–' : ((set.reps && set.weight) ? Math.round(set.reps * effectiveSetWeight(currentPlanEx, set.weight)) : '–')}</span>
      <button class="set-check ${set.done ? 'checked' : ''}" data-checkset="${si}" aria-label="Satz ${si+1} erledigt">✓</button>
      <button class="icon-x" data-removeset="${si}" aria-label="Satz ${si+1} entfernen">✕</button>
    </div>
  `).join('') : '';

  const referenceHTML = (entry && entry.referenceHistory && entry.referenceHistory.length) ? `
    <div class="reference-block">
      ${entry.referenceHistory.map((sets, hi) => `
        <div class="reference-title">${hi === 0 ? 'Letztes Mal' : 'Vorletztes Mal'}</div>
        ${sets.map((r,i) => `
          <div class="reference-row">
            <span>#${i+1}</span>
            <span>${entry.type === 'time' ? fmtSec(r.seconds) : `${r.reps ?? '–'} × ${r.weight ?? '–'} kg`}</span>
          </div>
        `).join('')}
      `).join('')}
    </div>
  ` : '';

  const needsBodyWeightWarning = !!(currentPlanEx && (currentPlanEx.assisted || currentPlanEx.bodyweightExercise) && !plan.bodyWeight);
  const bodyWeightWarningHTML = needsBodyWeightWarning ? `
    <div class="reference-block" style="border-color:var(--accent-2); margin-bottom:12px;">
      ⚠️ Kein Körpergewicht hinterlegt — VOL zeigt aktuell nur das eingestellte Gerätegewicht statt des tatsächlich bewegten Gewichts. Trag dein Körpergewicht im Übungen-Tab ein, damit es korrekt berechnet wird.
    </div>
  ` : '';

  const exerciseCardHTML = !entry ? '<div class="history-empty">Keine Übungen in dieser Einheit.</div>' : `
    <div class="exercise-card">
      ${bodyWeightWarningHTML}
      <div class="exercise-title-row">
        <div>
          <div class="exercise-title">${entry.name}</div>
          <div class="exercise-target">Ziel: ${entry.target.sets} × ${entry.type === 'time'
            ? `${entry.target.secondsMin}-${entry.target.secondsMax} Sek.`
            : `${entry.target.repsMin}-${entry.target.repsMax} Wdh${entry.target.weight ? ' · ' + entry.target.weight + ' kg' : ''}`}</div>
        </div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button class="icon-x" id="btnCheckAllExercise" aria-label="Ganze Übung abhaken">✓</button>
          <button class="icon-x" id="btnRemoveExercise" aria-label="${entry.name} aus dieser Einheit entfernen">✕</button>
        </div>
      </div>
      <div class="sets" id="currentSets">
        ${setsHeaderHTML}
        ${setsHTML}
      </div>
      <button class="add-set" id="btnAddSet">+ Satz</button>
      ${referenceHTML}
    </div>
  `;

  app.innerHTML = `
    <div class="brand">
      <h1>Training läuft</h1>
    </div>
    <div class="back-row no-print">
      <button class="gear" id="btnCancel">Abbrechen</button>
    </div>
    <div class="time-box ${restState ? 'resting' : ''}" id="plateEl">
      <div class="time-box-time" id="plateTime">00:00</div>
      <div class="time-box-rest" id="plateRest"></div>
      <div class="time-box-bar" id="restBar"></div>
    </div>
    <div class="rest-row">
      <button class="rest-btn" data-rest="30">30s</button>
      <button class="rest-btn" data-rest="60">60s</button>
      <button class="rest-btn" data-rest="90">90s</button>
    </div>
    <div class="thumb-strip">${thumbsHTML}</div>
    ${exerciseCardHTML}
    ${addExerciseHTML}
    <div style="height:70px"></div>
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="btn btn-danger" id="btnEnd">Training beenden</button>
      </div>
    </div>
  `;

  updateTimerDisplay();
  if (restState){
    document.getElementById('restBar').classList.add('visible');
    tickRest();
  }
  highlightRestButtons();

  wireThumbDrag();
  const thumbAddBtn = document.getElementById('thumbAdd');
  if (thumbAddBtn) thumbAddBtn.onclick = () => {
    addExerciseOpen = !addExerciseOpen;
    renderActive();
  };
  const addExerciseOverlay = document.getElementById('addExerciseOverlay');
  if (addExerciseOverlay){
    addExerciseOverlay.onclick = (ev) => {
      if (ev.target === addExerciseOverlay){
        addExerciseOpen = false;
        renderActive();
      }
    };
    const closeBtn = document.getElementById('btnCloseAddExercise');
    if (closeBtn) closeBtn.onclick = () => {
      addExerciseOpen = false;
      renderActive();
    };
    addExerciseOverlay.querySelectorAll('[data-addexgroup]').forEach(btn => {
      btn.onclick = () => {
        const g = btn.dataset.addexgroup;
        if (addExerciseGroupOpen.has(g)) addExerciseGroupOpen.delete(g); else addExerciseGroupOpen.add(g);
        renderActive();
      };
    });
  }

  if (entry){
    document.getElementById('currentSets').querySelectorAll('.set-row').forEach(row => {
      const si = Number(row.dataset.set);
      row.querySelectorAll('input').forEach(input => {
        input.onkeydown = (ev) => {
          if (ev.key === 'Enter'){
            ev.preventDefault();
            input.blur(); // löst onchange aus und schließt die virtuelle Tastatur
          }
        };
        input.onchange = () => {
          const val = input.value === '' ? null : Number(input.value);
          const field = input.dataset.field;
          entry.sets[si][field] = val;
          persistActiveSession();
        };
        if (entry.type !== 'time'){
          input.oninput = () => {
            const s = entry.sets[si];
            const reps = input.dataset.field === 'reps' ? (input.value === '' ? null : Number(input.value)) : s.reps;
            const weight = input.dataset.field === 'weight' ? (input.value === '' ? null : Number(input.value)) : s.weight;
            const volEl = row.querySelector('.set-vol');
            if (volEl) volEl.textContent = (reps && weight) ? Math.round(reps * effectiveSetWeight(currentPlanEx, weight)) : '–';
          };
        }
      });
    });

    app.querySelectorAll('[data-checkset]').forEach(btn => {
      btn.onclick = () => {
        const si = Number(btn.dataset.checkset);
        const wasDone = entry.sets[si].done;
        entry.sets[si].done = !wasDone;
        if (!wasDone){
          // Satz wurde gerade abgehakt: komplett leere Folge-Sätze automatisch
          // mit denselben Werten (kg + Wdh bzw. Sekunden) vorausfüllen, damit man
          // bei gleichbleibendem Gewicht/Wdh nicht jeden Satz neu eintippen muss.
          const doneSet = entry.sets[si];
          for (let j = si + 1; j < entry.sets.length; j++){
            const nextSet = entry.sets[j];
            const isUntouched = entry.type === 'time'
              ? (nextSet.seconds === null || nextSet.seconds === undefined)
              : (nextSet.reps === null || nextSet.reps === undefined) && (nextSet.weight === null || nextSet.weight === undefined);
            if (!isUntouched) break; // ab dem ersten bereits befüllten Satz nicht weiter überschreiben
            if (entry.type === 'time'){
              nextSet.seconds = doneSet.seconds;
            } else {
              nextSet.reps = doneSet.reps;
              nextSet.weight = doneSet.weight;
            }
          }
        }
        if (isEntryDone(entry)) advanceToNextExercise();
        renderActive();
      };
    });

    app.querySelectorAll('[data-removeset]').forEach(btn => {
      btn.onclick = () => {
        const si = Number(btn.dataset.removeset);
        entry.sets.splice(si, 1);
        renderActive();
      };
    });

    document.getElementById('btnAddSet').onclick = () => {
      if (entry.type === 'time'){
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({ seconds: (last && last.seconds) || null, done: false });
      } else {
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({
          reps: (last && last.reps) || null,
          weight: (last && last.weight) || entry.target.weight || null,
          done: false
        });
      }
      renderActive();
    };

    document.getElementById('btnCheckAllExercise').onclick = () => {
      entry.sets.forEach(s => s.done = true);
      advanceToNextExercise();
      renderActive();
    };

    document.getElementById('btnRemoveExercise').onclick = () => {
      if (confirm(`"${entry.name}" aus dieser Einheit entfernen?`)){
        active.entries.splice(ei, 1);
        if (active.currentIndex >= active.entries.length) active.currentIndex = Math.max(0, active.entries.length - 1);
        renderActive();
      }
    };
  }

  app.querySelectorAll('[data-addex]').forEach(row => {
    row.onclick = () => {
      const ex = plan.exercises.find(x => x.id === row.dataset.addex);
      if (ex){
        active.entries.push(buildEntry(ex));
        active.currentIndex = active.entries.length - 1;
        addExerciseOpen = false;
        renderActive();
      }
    };
  });

  document.getElementById('btnEnd').onclick = endSession;
  document.getElementById('btnCancel').onclick = () => {
    if (confirm('Training wirklich abbrechen? Die Einheit wird nicht in deinem Verlauf gespeichert.')){
      clearInterval(timerHandle);
      clearInterval(restInterval);
      restState = null;
      active = null;
      persistActiveSession();
      replaceView('home');
      renderHome();
    }
  };
  app.querySelectorAll('.rest-btn').forEach(btn => {
    btn.onclick = () => startRest(Number(btn.dataset.rest));
  });
  document.getElementById('plateEl').onclick = () => {
    if (restState){
      clearInterval(restInterval);
      restInterval = null;
      endRest(false);
    }
  };
}

/* ---------------------------------------------------
   REST TIMER (Pausenzeiten mit Balken-Fortschritt)
--------------------------------------------------- */
let restState = null;   // { endTime, duration }
let restInterval = null;

function startRest(seconds){
  clearInterval(restInterval);
  restState = { endTime: Date.now() + seconds*1000, duration: seconds };
  const rest = document.getElementById('plateRest');
  const bar = document.getElementById('restBar');
  const box = document.getElementById('plateEl');
  if (rest) rest.classList.add('visible');
  if (bar) bar.classList.add('visible');
  if (box) box.classList.add('resting');
  highlightRestButtons();
  restInterval = setInterval(tickRest, 100);
  tickRest();
}

function tickRest(){
  if (!restState) return;
  const remainingMs = Math.max(0, restState.endTime - Date.now());
  const remaining = Math.ceil(remainingMs/1000);
  const restEl = document.getElementById('plateRest');
  if (restEl) restEl.textContent = 'Pause ' + fmtDuration(remaining);
  const bar = document.getElementById('restBar');
  if (bar){
    const frac = Math.max(0, Math.min(1, remainingMs / (restState.duration*1000)));
    bar.style.width = (frac*100).toFixed(1) + '%';
  }
  if (remainingMs <= 0){
    clearInterval(restInterval);
    restInterval = null;
    endRest(true);
  }
}

function endRest(playSound){
  restState = null;
  const bar = document.getElementById('restBar');
  if (bar){ bar.classList.remove('visible'); bar.style.width = '0%'; }
  const box = document.getElementById('plateEl');
  if (box) box.classList.remove('resting');
  const rest = document.getElementById('plateRest');
  if (rest){ rest.classList.remove('visible'); rest.textContent = ''; }
  highlightRestButtons();
  if (playSound) playBeep();
}

function highlightRestButtons(){
  document.querySelectorAll('.rest-btn').forEach(btn => {
    btn.classList.toggle('is-active', !!restState && Number(btn.dataset.rest) === restState.duration);
  });
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.55);
  }catch(e){ /* Audio nicht verfügbar, kein Problem */ }
}

async function endSession(){
  clearInterval(timerHandle);
  clearInterval(restInterval);
  restState = null;
  const durationSec = Math.floor((Date.now() - active.startedAt)/1000);
  const session = {
    id: uid(),
    date: new Date(active.startedAt).toISOString(),
    durationSec,
    entries: active.entries
      .map(e => ({
        exerciseId: e.exerciseId,
        name: e.name,
        type: e.type,
        target: e.target,
        // Leere Sätze (kein Feld außer "done" ausgefüllt) gelten als gelöscht.
        sets: e.sets.filter(s => Object.entries(s).some(([k,v]) => k !== 'done' && v !== null && v !== undefined))
      }))
      // Übungen ganz ohne verbliebene Sätze gelten als nicht durchgeführt
      // und werden komplett verworfen (erscheinen nicht in Zusammenfassung/PDF).
      .filter(e => e.sets.length > 0)
  };
  sessions.push(session);
  session.entries.forEach(e => {
    if (e.exerciseId && e.sets.length){
      const history = Array.isArray(lastPerformance[e.exerciseId]) && Array.isArray(lastPerformance[e.exerciseId][0])
        ? lastPerformance[e.exerciseId]
        : (lastPerformance[e.exerciseId] ? [lastPerformance[e.exerciseId]] : []); // alte Struktur (nur 1 Session) migrieren
      lastPerformance[e.exerciseId] = [e.sets.map(s => ({ ...s })), ...history].slice(0, 2);
    }
  });
  await saveJSON('sessions', sessions);
  await saveJSON('lastPerformance', lastPerformance);
  active = null;
  await saveJSON('activeSession', null);
  replaceView('home');
  renderSessionSummary(session);
}

/* ---------------------------------------------------
   ABSCHLUSS-SCREEN NACH TRAINING
--------------------------------------------------- */
function computeWeekStreak(){
  if (!sessions.length) return 0;
  const weekKeys = new Set(sessions.map(s => weekBucket(new Date(s.date)).key));
  let streak = 0;
  let d = new Date();
  while (true){
    const key = weekBucket(d).key;
    if (weekKeys.has(key)){
      streak++;
      d.setDate(d.getDate() - 7);
    } else break;
  }
  return streak;
}

function computeSessionTrends(session){
  const priorSessions = sessions
    .filter(s => s.id !== session.id && new Date(s.date) < new Date(session.date))
    .sort((a,b) => new Date(b.date) - new Date(a.date)); // neueste zuerst

  return session.entries.map(e => {
    const isTime = e.type === 'time';
    let prevEntry = null;
    for (const s of priorSessions){
      const match = s.entries.find(x => x.exerciseId === e.exerciseId);
      if (match && match.sets && match.sets.length){ prevEntry = match; break; }
    }
    let currVol = null, prevVol = null;
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const lowerIsBetter = !!(planEx && planEx.assisted);
    if (isTime){
      const currVals = e.sets.map(s => s.seconds).filter(v => v !== null && v !== undefined);
      currVol = currVals.length ? currVals.reduce((a,v) => a + v, 0) : null;
      if (prevEntry){
        const prevVals = prevEntry.sets.map(s => s.seconds).filter(v => v !== null && v !== undefined);
        prevVol = prevVals.length ? prevVals.reduce((a,v) => a + v, 0) : null;
      }
    } else {
      const currValid = e.sets.filter(s => s.reps !== null && s.reps !== undefined && s.weight !== null && s.weight !== undefined);
      currVol = currValid.length ? currValid.reduce((a,s) => a + s.reps*effectiveSetWeight(planEx, s.weight), 0) : null;
      if (prevEntry){
        const prevValid = prevEntry.sets.filter(s => s.reps !== null && s.reps !== undefined && s.weight !== null && s.weight !== undefined);
        prevVol = prevValid.length ? prevValid.reduce((a,s) => a + s.reps*effectiveSetWeight(planEx, s.weight), 0) : null;
      }
    }
    let trend = 'new';
    if (prevVol !== null && currVol !== null){
      // Hinweis: currVol/prevVol basieren bei Nicht-Zeit-Übungen auf effectiveSetWeight(),
      // das assisted-Übungen bereits so normalisiert, dass höher immer besser ist — daher
      // hier KEINE zusätzliche Umkehrung über lowerIsBetter mehr (sonst doppelt verkehrt).
      if (currVol > prevVol) trend = 'up';
      else if (currVol < prevVol) trend = 'down';
      else trend = 'same';
    }
    return { exerciseId: e.exerciseId, name: e.name, isTime, currVol, prevVol, trend, sets: e.sets, lowerIsBetter };
  });
}

// Ermittelt pro nicht-Zeit-basierter Übung dieser Session, wie viele Kennzahlen einen
// neuen Allzeitrekord (records) bzw. eine Steigerung zum letzten Mal (improved) darstellen
// (siehe computeExerciseMetricComparison). Eine Übung gilt als Highlight, sobald records > 0
// oder improved > 0 ist — unabhängig davon, ob sie zum ersten Mal protokolliert wurde.
function computeExerciseHighlights(session){
  const highlights = [];
  let starCount = 0;
  let improvedCount = 0;
  session.entries.forEach(e => {
    if (e.type === 'time') return;
    const result = computeExerciseMetricComparison(session, e.exerciseId);
    if (result && result.current.hasData){
      const records = countAllTimeRecords(result.comparison);
      // Eine Kennzahl zählt nur dann als "verbessert" (grün), wenn sie NICHT bereits
      // ein Allzeitrekord ist (gelb) — ein Allzeitrekord ist per Definition immer auch
      // eine Verbesserung, soll aber nicht doppelt gezählt/angezeigt werden.
      const improved = Object.values(result.comparison).filter(m => m.lastPct !== null && m.allTimePct === null && !m.isNewAllTime).length;
      // isNew: Übung wurde noch nie zuvor protokolliert (keine der Kennzahlen hat einen
      // "echten" Allzeitrekord-Prozentwert, aber es gibt trotzdem Rekorde durch isNewAllTime).
      const isNew = !result.hasHistory && records > 0;
      starCount += records;
      improvedCount += improved;
      if (records > 0 || improved > 0){
        highlights.push({ exerciseId: e.exerciseId, name: e.name, sets: e.sets, records, improved, isNew });
      }
    }
  });
  return { highlights, starCount, improvedCount };
}

function pdfSafeText(str){
  // jsPDFs Standardschriften (Helvetica etc.) können nur WinAnsi/Latin-1 darstellen —
  // Emojis und Pfeile/Sonderzeichen außerhalb davon führen sonst zu Zeichensalat im PDF.
  return String(str)
    .replace(/💪/g, '')
    .replace(/🔥/g, '')
    .replace(/▲/g, '(verbessert)')
    .replace(/✨/g, '(Neu)')
    .replace(/→/g, '->')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function buildFullSummaryPdfBlob(session, opts){
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  opts = opts || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marginX = 16;
  const pageWidth = 210 - marginX * 2;
  const pageBottom = 282;
  let y = 20;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text(pdfSafeText('Trainingsplan — Zusammenfassung'), marginX, y);
  y += 9;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(60);
  let metaLine = `${fmtDate(session.date)}  ·  Dauer ${fmtDuration(session.durationSec)}`;
  if (opts.sessionNumber) metaLine += `  ·  Einheit Nr. ${opts.sessionNumber}`;
  if (opts.streak) metaLine += `  ·  ${opts.streak} ${opts.streak === 1 ? 'Woche' : 'Wochen'} am Stück`;
  doc.text(pdfSafeText(metaLine), marginX, y);
  y += 10;
  doc.setDrawColor(210);
  doc.line(marginX, y, 210 - marginX, y);
  y += 8;

  // Erfolge pro Übung nachschlagen (records/isNewAllTime > lastPct — sich gegenseitig
  // ausschließend, wie in der Zusammenfassung auf dem Bildschirm), damit jede Übung ihre
  // kompakte Markierung bekommt (Neu / Nx Rekord / Nx verbessert), ohne dass für Übungen
  // ohne jegliche Kennzahlen (z. B. Zeit-Übungen) etwas falsch angezeigt wird.
  const highlightMap = {};
  if (opts.highlights){
    opts.highlights.forEach(h => { highlightMap[h.exerciseId] = h; });
  }

  session.entries.forEach(e => {
    const imgSize = 20;
    const textX = marginX + imgSize + 4;
    const maxTextWidth = 210 - textX - marginX;

    const setsText = e.type === 'time'
      ? e.sets.map(s => fmtSec(s.seconds)).join(' · ')
      : e.sets.map(s => `${s.reps}×${s.weight ?? 0}kg`).join(' · ');

    const h = highlightMap[e.exerciseId];
    let badgeText = '';
    if (h && h.isNew) badgeText = 'Neu';
    else if (h && h.records > 0) badgeText = h.records > 1 ? `${h.records}x Rekord` : 'Rekord';
    else if (h && h.improved > 0) badgeText = h.improved > 1 ? `${h.improved}x verbessert` : 'verbessert';

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    const nameLines = doc.splitTextToSize(pdfSafeText(e.name), maxTextWidth);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const bodyLines = doc.splitTextToSize(pdfSafeText(setsText || '—'), maxTextWidth);
    const textBlockH = nameLines.length * 5 + bodyLines.length * 4.2 + (badgeText ? 4.5 : 0) + 4;
    const blockH = Math.max(textBlockH, imgSize + 6);

    if (y + blockH > pageBottom){
      doc.addPage();
      y = 20;
    }

    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    if (planEx && planEx.imageData){
      try{ doc.addImage(planEx.imageData, 'JPEG', marginX, y, imgSize, imgSize); }catch(err){ /* Bild überspringen, falls ungültig */ }
    }

    let ty = y + 4;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
    doc.text(nameLines, textX, ty);
    ty += nameLines.length * 5;
    if (badgeText){
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
      const isGold = badgeText === 'Neu' || badgeText.includes('Rekord');
      if (isGold) doc.setTextColor(180, 140, 30); else doc.setTextColor(90, 170, 90);
      doc.text(pdfSafeText(badgeText), textX, ty);
      ty += 4.5;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(bodyLines, textX, ty);
    ty += bodyLines.length * 4.2;

    y += Math.max(blockH, ty - y + 3);
    doc.setDrawColor(230);
    doc.line(marginX, y - 3, 210 - marginX, y - 3);
  });

  return doc.output('blob');
}

// Zeigt einen kurzen Toast mit Rückgängig-Option (z. B. nach dem Löschen einer Einheit).
// Die eigentliche Aktion ist zu diesem Zeitpunkt bereits ausgeführt — onUndo macht sie
// rückgängig, wird der Toast ignoriert (Zeitablauf oder manuelles Wegtippen andernorts),
// bleibt die Aktion endgültig. Es kann immer nur ein Toast gleichzeitig sichtbar sein; ein
// neuer Aufruf ersetzt einen evtl. noch sichtbaren alten Toast sofort (inkl. dessen Timer).
let undoToastTimeout = null;
function showUndoToast(message, onUndo){
  const existing = document.getElementById('undoToast');
  if (existing) existing.remove();
  if (undoToastTimeout) clearTimeout(undoToastTimeout);

  const toast = document.createElement('div');
  toast.className = 'undo-toast';
  toast.id = 'undoToast';
  toast.innerHTML = `
    <span class="undo-toast-text">${message}</span>
    <button class="undo-toast-btn" id="undoToastBtn">Rückgängig</button>
  `;
  document.body.appendChild(toast);

  const remove = () => { const el = document.getElementById('undoToast'); if (el) el.remove(); };
  document.getElementById('undoToastBtn').onclick = () => {
    clearTimeout(undoToastTimeout);
    remove();
    onUndo();
  };
  undoToastTimeout = setTimeout(remove, 5000);
}

function downloadBlob(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function shareSession(session, opts){
  opts = opts || {};
  const { highlights } = computeExerciseHighlights(session);
  const dateStub = (session.date || '').slice(0,10);

  // Immer die vollständige Zusammenfassung (alle Übungen in Reihenfolge, mit kompakten
  // Erfolgs-Markierungen) — sowohl fürs native Teilen als auch als Download-Fallback,
  // entspricht genau dem, was auch auf dem Bildschirm zu sehen ist.
  let fullBlob = null;
  try{ fullBlob = buildFullSummaryPdfBlob(session, { ...opts, highlights }); }catch(err){ fullBlob = null; }
  if (fullBlob){
    try{
      const file = new File([fullBlob], `trainingsplan-zusammenfassung-${dateStub}.pdf`, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: 'Trainingseinheit' });
        return;
      }
    }catch(err){
      return; // Nutzer hat den Teilen-Dialog abgebrochen — kein Fehler
    }
    downloadBlob(fullBlob, `trainingsplan-zusammenfassung-${dateStub}.pdf`);
    return;
  }

  // Letzter Fallback ohne PDF (z. B. jsPDF nicht geladen): Text teilen
  const lines = [];
  lines.push(`💪 Trainingseinheit`);
  lines.push(`${fmtDate(session.date)} · Dauer ${fmtDuration(session.durationSec)}`);
  lines.push('');
  session.entries.forEach(e => {
    const setsText = e.type === 'time'
      ? e.sets.map(s => fmtSec(s.seconds)).join(', ')
      : e.sets.map(s => `${s.reps}×${s.weight ?? 0}kg`).join(', ');
    lines.push(`${e.name}: ${setsText || '—'}`);
  });
  const text = lines.join('\n');

  if (navigator.share){
    try{ await navigator.share({ title: 'Trainingseinheit', text }); }
    catch(err){ /* Nutzer hat abgebrochen — kein Fehler */ }
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('Teilen wird auf diesem Gerät nicht direkt unterstützt — die Zusammenfassung wurde stattdessen in die Zwischenablage kopiert.');
  }catch(err){
    alert('Teilen wird auf diesem Gerät leider nicht unterstützt.');
  }
}

      <button class="btn btn-primary" id="btnPdf">Speichern</button>
    </div>
    <div class="detail-actions no-print" style="margin-top:10px;">
      <button class="btn btn-ghost" id="btnExportSession">Training exportieren</button>
    </div>
    <button class="btn btn-primary no-print" id="btnRepeat" style="margin-top:10px;">🔁 Nochmal trainieren</button>
  `;

  app.querySelectorAll('.summary-row[data-exerciseid]').forEach(row => {
    row.onclick = () => goExerciseSessionDetail(s.id, row.dataset.exerciseid);
  });

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnRepeat').onclick = () => repeatSession(s);
  document.getElementById('btnToggleFull').onclick = () => {
    const wrap = document.getElementById('fullTableWrap');
    const chevron = document.getElementById('fullToggleChevron');
    const btn = document.getElementById('btnToggleFull');
    const isOpen = wrap.classList.toggle('open');
    chevron.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', String(isOpen));
  };
  document.getElementById('btnPdf').onclick = () => {
    const dateStub = (s.date || '').slice(0,10);
    const sessionNumber = sessions.findIndex(x => x.id === s.id) + 1;
    const streak = computeWeekStreak();
    let blob = null;
    try{ blob = buildFullSummaryPdfBlob(s, { sessionNumber, streak, highlights: exerciseHighlights }); }catch(err){ blob = null; }
    if (blob){
      downloadBlob(blob, `trainingsplan-zusammenfassung-${dateStub}.pdf`);
    } else {
      window.print();
    }
  };
  document.getElementById('btnShare').onclick = () => shareSession(s, {});
  document.getElementById('btnExportSession').onclick = () => {
    exportSingleSession(s);
  };
  document.getElementById('btnDelete').onclick = async () => {
    if (!confirm('Diese Einheit wirklich löschen?')) return;
    const removedIndex = sessions.findIndex(x => x.id === id);
    const removedSession = sessions[removedIndex];
    sessions = sessions.filter(x => x.id !== id);
    await saveJSON('sessions', sessions);
    history.back();
    showUndoToast('Einheit gelöscht.', async () => {
      sessions.splice(removedIndex, 0, removedSession);
      await saveJSON('sessions', sessions);
      goSessionDetail(removedSession.id);
    });
  };
}

function showFatalError(err){
  const msg = (err && err.message) ? err.message : String(err);
  const stack = (err && err.stack) ? err.stack : '';
  app.innerHTML = `
    <div class="brand"><h1>Etwas ist schiefgelaufen</h1></div>
    <div class="history-empty" style="text-align:left; white-space:pre-wrap; word-break:break-word;">
      Die App konnte nicht vollständig laden.

      Fehlermeldung:
      ${msg}

      ${stack ? '\n' + stack : ''}

      Tipp: Falls du die Datei über die Dateien-App geöffnet hast, stelle sicher,
      dass sie wirklich in Safari geöffnet wird (nicht nur als Vorschau) —
      antippen und halten, dann „Öffnen mit" → Safari wählen.
    </div>
  `;
}

window.addEventListener('error', (e) => { showFatalError(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { showFatalError(e.reason); });

try{
  init().catch(showFatalError);
}catch(err){
  showFatalError(err);
}
</script>
</body>
</html>
