<style>

:root{
  --bg: #121316;
  --surface: #1c1e22;
  --surface-2: #24272c;
  --text: #ece9e4;
  --muted: #8a8e95;
  --accent: #d9c74a;
  --accent-2: #b3453a;
  --accent-3: #6f9bd1;
  --border: #33363b;
  --radius: 10px;
}
/* Light Mode: wird per JS auf <html> gesetzt (data-theme="light", siehe applyTheme() /
   Einstellungen → Darstellung). Alle Farbrollen bleiben dieselben Variablennamen, nur die
   Werte drehen sich um — jede Stelle in der App, die bereits var(--bg)/var(--text)/etc.
   nutzt, funktioniert dadurch automatisch auch im Light Mode ohne weitere Anpassung. */
html[data-theme="light"]{
  --bg: #f5f4f1;
  --surface: #ffffff;
  --surface-2: #ececea;
  --text: #1c1d20;
  --muted: #6b6f76;
  --border: #dcdad5;
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
/* Textmarkierung ist app-weit deaktiviert (verhindert, dass Android bei Long-Press auf
   Buttons/Zeilen versehentlich Fließtext daneben markiert oder das native "Kopieren"-Menü
   öffnet) — nur in echten Eingabefeldern soll man weiterhin Text auswählen/markieren können. */
input, textarea{
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
}
button{ font-family: inherit; cursor: pointer; }
input{ font-family: inherit; }
::selection{ background: var(--accent); color: #121316; }

.app{ max-width: 640px; margin: 0 auto; padding: 20px 16px 100px; }

/* ---------- Startseite: "Verlauf zuerst"-Layout (Daumenbereich) ---------- */
/* Schiebt Verlauf/Nav-Zeile/"Training starten" als zusammenhängenden Block gezielt in den
   unteren, mit dem Daumen leicht erreichbaren Bildschirmbereich, statt ihn direkt unter der
   Überschrift zu zeigen — der Freiraum oben ist bewusst leer, damit z. B. beim Halten des
   Handys mit einer Hand nichts im schwer erreichbaren oberen Bereich liegt. Nutzt dieselbe
   sichtbare Höhe wie window.visualViewport (siehe wireViewportAwareOverlays), damit sich
   das auch bei ein-/ausgeblendeter Adressleiste im mobilen Browser sauber anpasst. */
.home-thumb-wrap{
  display:flex; flex-direction:column;
  min-height: calc(100vh - 120px); /* 100dvh wäre exakter, min-height als robuster Fallback */
  min-height: calc(100dvh - 120px);
}
.home-thumb-spacer{ flex:1 1 auto; min-height:12px; }
.home-thumb-block{ flex-shrink:0; }

/* ---------- Top identity ---------- */
.brand{ margin-bottom: 14px; }
.brand h1{
  font-family:'Bebas Neue', sans-serif;
  font-size: clamp(24px, 8vw, 34px);
  letter-spacing: 1px;
  line-height: 1.05;
  word-break: break-word;
  margin:0;
}
.gear{
  background:none; border:1px solid var(--border); color:var(--muted);
  border-radius: 8px; padding:8px 12px; font-size:13px;
}
.gear:hover{ color: var(--text); border-color: var(--muted); }
.back-row{ margin-bottom: 18px; }
.back-btn-icon{
  background:none; border:none; padding:6px; margin:-6px 0 0 -6px;
  display:inline-flex; align-items:center; justify-content:center;
}
.back-btn-icon img{ width:22px; height:22px; display:block; }
.back-row .gear{ display:inline-block; width:auto; padding:9px 16px; font-size:13px; }

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; text-align:center;
  border-radius: var(--radius); border:1px solid var(--border);
  background: var(--surface); color: var(--text);
  padding: 16px; font-size:16px; font-weight:600;
  transition: transform .08s ease, background .15s ease;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--accent); color:#121316; border-color: var(--accent);
  font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:1px;
  padding: 20px;
}
.btn-danger{ background: var(--accent-2); border-color: var(--accent-2); color:#fff; }

.metric-card-title{ font-weight:700; font-size:19px; }
.metric-card-subtitle{ font-size:13px; color: var(--muted); margin-top:2px; }

/* ---------- Trainings-Widget (Balkendiagramm) ---------- */
.training-widget{

.training-widget-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

/* ---------- Progress list ---------- */
.progress-row{

/* ---------- Charts ---------- */
.chart-wrap{

}

.chart-label{ font-family:'JetBrains Mono', monospace; font-size:10px; fill: var(--muted); }

/* ---------- Timer-Kasten (kompakt, wächst bei Pause) ---------- */
.time-box{
  position: relative; margin: 4px auto 20px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 14px 24px; overflow: visible; cursor: pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition: padding .25s ease, border-color .25s ease;
}
/* Während der Pause übernimmt der animierte SVG-Rahmen (.time-box-ring) die komplette
   Umrandung — der normale CSS-border wird dafür unsichtbar, damit es nicht doppelt
   umrandet aussieht (ein statischer Rahmen UND ein laufender Fortschrittsrahmen). */
.time-box.resting{ padding: 18px 24px 22px; border-color: transparent; }
/* Während der Pause tritt die normal weiterlaufende Trainingszeit optisch komplett zurück
   (ausgeblendet) und der Pausen-Countdown rückt an ihre Stelle — größer und mittig —, damit
   der Fokus eindeutig auf der Restzeit der Pause liegt statt auf zwei gleichzeitig
   tickenden Uhren. Nur die Zeit selbst ist farbig (Akzentfarbe), das Wort "Pause" bleibt
   dezent grau, damit die Zahl die Aufmerksamkeit bekommt.
--------------------------------------------------- */
.time-box.resting .time-box-time-row{ display:none; }
.time-box-time-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
.time-box-time{
  font-family:'JetBrains Mono', monospace; font-size: 32px; font-weight:700;
  color: var(--accent); letter-spacing:1px;
}
/* Pause-Symbol (zwei Balken) neben der Trainingszeit — erscheint, sobald die Trainingszeit
   per Tap auf die Zeit (siehe toggleSessionPause()) angehalten wurde. Wird bewusst NICHT
   über ein Font-Zeichen gelöst (Rendering variiert stark je Gerät/Font), sondern als zwei
   simple Balken in der Akzentfarbe, passend zur Zeit-Anzeige selbst. */
.time-box-pause-icon{ display:none; align-items:center; gap:4px; }
.time-box-pause-icon .pause-bar{ width:5px; height:24px; background: var(--accent); border-radius:2px; }
.time-box-rest{
  text-align:center; margin-top:0; height:0; overflow:hidden;
  opacity:0; transition: opacity .15s ease, height .15s ease, margin-top .15s ease;
}
.time-box-rest.visible{ opacity:1; height:auto; margin-top:6px; }
.time-box-rest-label{
  display:block; font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700;
  letter-spacing:1px; color: var(--muted);
}
.time-box-rest-time{
  display:block; font-family:'JetBrains Mono', monospace; font-size:32px; font-weight:700;
  color: var(--accent); letter-spacing:1px;
}
/* Der Pausen-Fortschritt läuft als Rahmen einmal komplett um die Box herum (statt als
   gerader Balken unten) — ein <svg><rect></svg>, dessen Umriss per stroke-dasharray/
   -dashoffset animiert wird (siehe tickRest()). Startpunkt ist die Mitte der Oberkante,
   damit die Restzeit optisch "von oben im Uhrzeigersinn abläuft", ähnlich einer Analoguhr. */
.time-box-ring{
  position:absolute; inset:-1px; width:calc(100% + 2px); height:calc(100% + 2px);
  pointer-events:none; opacity:0; transition: opacity .2s ease;
}
.time-box-ring.visible{ opacity:1; }
.time-box-ring rect{
  fill:none; stroke: var(--accent); stroke-width:2.5;
  transition: stroke-dashoffset .1s linear;
}

/* ---------- Rest timer buttons ---------- */
/* Ein zusammenhängender, abgerundeter Kasten statt drei einzelner Kreis-Buttons — intern per
   dünner Trennlinie (border-right auf allen außer dem letzten Button) in drei gleich große
   Bereiche geteilt. */
.rest-row{
  display:flex; justify-content:center; margin: 0 0 28px;
  background: var(--surface); border:1px solid var(--border); border-radius:16px;
  overflow:hidden; max-width:280px; margin-left:auto; margin-right:auto;
}

  font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  transition: background .12s ease, color .15s ease;
}
.rest-btn:last-child{ border-right:none; }
.rest-btn:active{ background: var(--surface-2); }
.rest-btn.is-active{ background: var(--surface-2); color: var(--accent); }

/* ---------- Übungs-Bilderleiste (aktives Training) ---------- */
.thumb-strip{

}

.thumb-check{

  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}
.thumb-add{

}
.thumb-add:active{ border-color: var(--accent); color: var(--accent); }

/* ---------- Exercise cards ---------- */
.exercise-card{

}

}

.set-check.checked{ background:#7cc576; border-color:#7cc576; color:#121316; }
.set-row.set-done{ opacity:0.55; }
.entry-menu{ margin: 0 0 12px; display:flex; flex-direction:column; gap:6px; }
.entry-menu-item{
  text-align:left; background: var(--surface-2); border:1px solid var(--border); color: var(--text);

.reference-block{
  margin-top:16px; padding:10px 12px; background: var(--surface-2);
  border-radius: var(--radius); border:1px dashed var(--border);
}
.reference-group{ margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); }

  font-size:12px; color: var(--muted); padding:1px 0;
}
.set-row{
  display:grid; grid-template-columns: 22px 1fr 1fr 44px 32px 26px;
  align-items:center; gap:6px; margin-bottom:8px;
}
.set-row.set-row-time{ grid-template-columns: 22px 1fr 32px 26px; }

  display:grid; grid-template-columns: 22px 1fr 1fr 44px 32px 26px;
  align-items:center; gap:6px; margin-bottom:8px;
}
.sets-header.sets-header-time{ grid-template-columns: 22px 1fr 32px 26px; }
.sets-header-cell{
  font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted);
  text-align:center;
}
.sets-header-cell:first-child{ text-align:left; }
.sets-header-cell-toggle{
  background:none; border:none; padding:2px 4px; font-family:inherit; cursor:pointer;
  color: var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px;
}
.set-idx{
  width:auto; font-family:'JetBrains Mono', monospace; color: var(--muted); font-size:13px;
  display:flex; align-items:center; gap:4px;
}
.set-vol{
  font-family:'JetBrains Mono', monospace; color: var(--muted); font-size:15px; text-align:center;
}
.set-row input{
  background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:10px 4px; font-family:'JetBrains Mono', monospace; font-size:15px; text-align:center;
  min-width:0; width:100%;
}
.set-row input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
.set-row input:disabled{ opacity:0.35; background: var(--surface); }
.add-set{
  background:none; border:none; color: var(--accent); font-size:13px; font-weight:600; padding:6px 0;
}
/* "+ Satz" / Alle-abhaken als eigene Zeile MIT DEMSELBEN GRID-MARKUP wie eine echte
   .set-row (6 tatsächliche Kind-Elemente statt nur 2 mit manuellen grid-column-Werten) —
   garantiert dadurch pixelgenau dieselbe Spaltenberechnung wie bei den Satz-Häkchen
   darüber, unabhängig davon, wie der Browser Grid-Spalten bei ungleicher Element-Anzahl
   im Detail auflöst. add-set-spacer sind unsichtbare 0-Breite-Füllelemente für die nicht
   genutzten Spalten (#, kg, Wdh, VOL, X).
*/
.add-set-row{
  display:grid; grid-template-columns: 22px 1fr 1fr 44px 32px 26px;
  align-items:center; gap:6px; margin-bottom:8px;
}
.add-set-row.set-row-time{ grid-template-columns: 22px 1fr 32px 26px; }
.add-set-spacer{ visibility:hidden; }
.add-set-row .add-set{ grid-column: 1 / span 4; justify-self:start; }
.add-set-row.set-row-time .add-set{ grid-column: 1 / span 2; }
.check-all-btn{
  width:30px; height:30px; border-radius:8px; border:2px solid #7cc576;
  background:#7cc576; color:#121316; font-size:15px; font-weight:700;
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.check-all-btn:active{ opacity:0.8; }

/* ---------- Übung hinzufügen (aktives Training) ---------- */
/* ---------- Übung-hinzufügen-Modal (aktives Training) ---------- */
.add-exercise-overlay{
  position:fixed; left:0; right:0; top:0; background:rgba(0,0,0,0.6); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  /* height wird zusätzlich per JS (wireViewportAwareOverlays) auf window.visualViewport.height
     gesetzt, sobald sich die virtuelle Tastatur öffnet/schließt — normales 100%/100vh würde
     sich weiterhin auf die volle Fensterhöhe INKLUSIVE des von der Tastatur verdeckten
     Bereichs beziehen, wodurch Eingabefelder-Popups hinter der Tastatur verschwinden. */
  height:100%;
}

/* ---------- History-Kontextmenü (Long-Press) ---------- */
.history-context-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:55;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.history-context-menu{
  width:auto; background: var(--surface); border:1px solid var(--border);
  border-radius:16px; overflow:hidden;
  display:flex; align-items:stretch; justify-content:center;
}
.history-context-icon-btn{
  background:none; border:none; width:64px; height:64px; flex-shrink:0;
  position:relative; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  border-right:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.history-context-icon-btn:last-child{ border-right:none; }
.history-context-icon-btn:active{ background: var(--surface-2); }

/* Teilen-Symbol: eingebettetes Bild (vom Nutzer bereitgestelltes Icon) statt CSS-Konstruktion */
.history-context-icon-btn.share img{
  width:22px; height:22px; display:block; -webkit-user-select:none; user-select:none;
  pointer-events:none; -webkit-touch-callout:none;
}

/* Löschen (rotes X) und Schließen (graues X): zwei rotierte Linien statt Textzeichen,
   damit Android den Long-Press nicht als Textauswahl interpretiert. */
.history-context-icon-btn.delete::before, .history-context-icon-btn.delete::after,
.history-context-icon-btn.close::before, .history-context-icon-btn.close::after{
  content:''; position:absolute; top:50%; left:50%; width:16px; height:2px; border-radius:1px;
}
.history-context-icon-btn.delete::before, .history-context-icon-btn.delete::after{ background: var(--accent-2); }
.history-context-icon-btn.close::before, .history-context-icon-btn.close::after{ background: var(--muted); }
.history-context-icon-btn.delete::before, .history-context-icon-btn.close::before{ transform: translate(-50%,-50%) rotate(45deg); }
.history-context-icon-btn.delete::after, .history-context-icon-btn.close::after{ transform: translate(-50%,-50%) rotate(-45deg); }


/* ---------- Neue-Übung-Modal ---------- */
.new-exercise-modal-body{ overflow-y:auto; padding:16px; }
.wizard-progress{
  font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); margin-bottom:4px;
}
.wizard-subtitle{ font-size:12px; color: var(--muted); margin-top:4px; }
/* Blocksatz für erklärende Fließtexte (Popup-Beschreibungen, Hinweise in den
   Einstellungen etc.) — sorgt für einen sauberen, glatten rechten Textrand statt des
   standardmäßig unruhigen Flatterrands bei mehrzeiligem Text. */
.justify-text{ text-align: justify; text-justify: inter-word; }
.wizard-choice-list{ display:flex; flex-direction:column; gap:10px; }
.wizard-choice{
  width:100%; text-align:left; background: var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:14px 16px; font-size:15px; color: var(--text); font-weight:500;
}
.wizard-choice:active{ background: var(--surface); }
.wizard-choice.selected{ border-color: var(--accent); color: var(--accent); }

/* ---------- Scroll-Wheel Zahleneingabe ---------- */
.scroll-wheel-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:70;
  display:flex; align-items:flex-end; justify-content:center;
}
.scroll-wheel-sheet{
  width:100%; max-width:640px; background: var(--bg);
  border-top-left-radius:20px; border-top-right-radius:20px;
  border:1px solid var(--border); border-bottom:none;
  animation: wheelSheetIn .22s ease;
}
@keyframes wheelSheetIn{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.scroll-wheel-header{
  padding:16px 16px 12px; border-bottom:1px solid var(--border);
  text-align:center;
}
.scroll-wheel-label{ font-weight:700; font-size:15px; color: var(--text); text-transform:uppercase; letter-spacing:1.5px; display:block; }
.scroll-wheel-viewport{
  position:relative; height:220px; overflow:hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 70%, transparent 100%);
}
.scroll-wheel-highlight{
  position:absolute; top:50%; left:0; right:0; height:44px; transform:translateY(-50%);
  background: var(--surface-2); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  pointer-events:none;
}
.scroll-wheel-track{
  /* Position wird komplett per JS über transform:translateY() gesteuert (eigene
     Touch-Physik mit Momentum/Trägheit statt nativem overflow-scroll + CSS scroll-snap,
     siehe openScrollWheelForInput) — kein natives Scrollen auf diesem Element. */
  position:relative; top:50%; margin-top:-22px;
  touch-action:none; will-change: transform;
  -webkit-user-select:none; user-select:none;
}
.scroll-wheel-item{
  height:44px; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-size:20px; color: var(--muted);
  transition: color .12s ease, transform .12s ease, opacity .12s ease;
  opacity:0.45; transform: scale(0.9);
  -webkit-user-select:none; user-select:none; cursor:pointer;
}
.scroll-wheel-item.active{ color: var(--text); opacity:1; transform: scale(1.08); font-weight:700; }

/* ---------- Ziffernblock (Keypad) Zahleneingabe ---------- */
.keypad-sheet{
  width:100%; max-width:420px; margin:0 auto; background: var(--surface);
  border-top-left-radius:20px; border-top-right-radius:20px;
  border:1px solid var(--border); border-bottom:none;
  padding:16px; animation: wheelSheetIn .22s ease;
}
.keypad-display-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.keypad-display{
  flex:1; font-family:'JetBrains Mono', monospace; font-size:34px; font-weight:700;
  color: var(--text); text-align:right; padding:10px 4px; min-height:48px;
  overflow-x:auto; white-space:nowrap;
}
.keypad-confirm{
  width:64px; height:64px; flex-shrink:0; border-radius:14px;
  background: var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.keypad-confirm:active{ background: var(--surface); }
.keypad-check{ position:relative; width:22px; height:16px; display:block; }
.keypad-check::before{
  content:''; position:absolute; left:0; top:6px; width:9px; height:2.5px;
  background: var(--accent); border-radius:1px; transform:rotate(45deg); transform-origin:left center;
}
.keypad-check::after{
  content:''; position:absolute; left:6px; top:10.5px; width:17px; height:2.5px;
  background: var(--accent); border-radius:1px; transform:rotate(-45deg); transform-origin:left center;
}
.keypad-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
}
.keypad-key{
  background: var(--surface-2); border:1px solid var(--border); border-radius:14px;
  height:64px; font-family:'JetBrains Mono', monospace; font-size:26px; font-weight:600;
  color: var(--text); display:flex; align-items:center; justify-content:center;
  -webkit-user-select:none; user-select:none;
}
.keypad-key:active{ background: var(--surface); }
.keypad-key-disabled{ opacity:0.3; }
.keypad-key-del{ position:relative; }
.keypad-key-del::before{
  content:''; position:absolute; left:50%; top:50%; width:20px; height:2.5px;
  background: var(--muted); border-radius:1px; transform:translate(-50%,-50%) rotate(45deg);
}
.keypad-key-del::after{
  content:''; position:absolute; left:50%; top:50%; width:20px; height:2.5px;
  background: var(--muted); border-radius:1px; transform:translate(-50%,-50%) rotate(-45deg);
}
.keypad-inline{ padding:14px 16px 16px; border-top:1px solid var(--border); }
.keypad-inline .keypad-display-row{ margin-bottom:12px; }
.keypad-inline .keypad-key{ height:52px; font-size:22px; }
.keypad-inline .keypad-confirm{ width:52px; height:52px; }

/* ---------- Toggle-Switch (Einstellungen) ---------- */
/* ---------- Akzentfarben-Auswahl (Einstellungen) ---------- */
.accent-swatch-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.accent-swatch{
  aspect-ratio:1/1; border-radius:14px; border:2px solid transparent;
  position:relative; transition: transform .1s ease;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.accent-swatch:active{ transform: scale(0.92); }
.accent-swatch.selected{ border-color: var(--text); }
.accent-swatch.selected::after{
  content:''; position:absolute; top:50%; left:50%; width:9px; height:5px;
  transform:translate(-50%,-60%) rotate(-45deg);
  border-left:2.5px solid #121316; border-bottom:2.5px solid #121316;
}
/* Kleiner Stern oben rechts markiert Favoriten aus der freien Farbpalette (Long-Press
   entfernt sie wieder, siehe wireAccentFavoriteLongPress). Fünfzackiger Stern als
   Polygon-Clip, da hierfür kein Unicode-Zeichen (nicht selektierbar) verwendet wird. */
.accent-swatch[data-favorite="1"]::before{
  content:''; position:absolute; top:4px; right:4px; width:11px; height:11px;
  background:#fff; opacity:0.85;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.accent-palette-field{
  position:relative; width:100%; height:180px; border-radius:12px; overflow:hidden;
  touch-action:none; -webkit-user-select:none; user-select:none;
  /* Hue wird per JS als --hue-hex gesetzt (aktueller reiner Farbton bei voller Sättigung
     und Helligkeit); links-nach-rechts läuft die Sättigung (weiß -> Farbton), oben-nach-
     unten die Helligkeit (transparent -> schwarz), klassisches HSV-Auswahlfeld. */
  background: linear-gradient(to bottom, transparent, #000),
              linear-gradient(to right, #fff, var(--hue-hex, #ff0000));
}
.accent-palette-cursor{
  position:absolute; width:22px; height:22px; border-radius:50%;
  border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.5);
  transform:translate(-50%,-50%); pointer-events:none;
}
.accent-hue-slider{
  position:relative; width:100%; height:22px; border-radius:11px; margin-top:14px;
  touch-action:none; -webkit-user-select:none; user-select:none;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
}
.accent-hue-cursor{
  position:absolute; top:50%; width:26px; height:26px; border-radius:50%;
  border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.5);
  transform:translate(-50%,-50%); pointer-events:none; background: var(--hue-hex, #ff0000);
}
.accent-custom-btn{
  width:100%; margin-top:14px; padding:13px 16px; border-radius:10px;
  border:1px solid var(--border); background: var(--surface-2); color: var(--text);
  font-size:14px; font-weight:500; display:flex; align-items:center; gap:10px;
}
.accent-custom-btn:active{ background: var(--surface); }
.accent-custom-btn-icon{
  width:22px; height:22px; border-radius:50%; flex-shrink:0; object-fit:cover; display:block;
}
.accent-picker-sheet{
  width:100%; max-width:400px; margin:0 auto; background: var(--bg);
  border-top-left-radius:20px; border-top-right-radius:20px;
  border:1px solid var(--border); border-bottom:none; padding:16px;
  animation: wheelSheetIn .22s ease;
}
.accent-picker-preview-row{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.accent-picker-preview{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border); flex-shrink:0;
}
.accent-picker-hex-input{
  flex:1; font-family:'JetBrains Mono', monospace; font-size:15px; color: var(--text);
  background: var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:9px 12px; min-width:0;
}
.accent-picker-hex-input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
.accent-picker-fav-btn{
  width:40px; height:40px; border-radius:10px; border:1px solid var(--border);
  background: var(--surface-2); flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.accent-picker-fav-btn:active{ background: var(--surface); }
.accent-picker-fav-star{
  width:20px; height:20px; display:block; position:relative; background: var(--muted);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.accent-picker-fav-star::after{
  content:''; position:absolute; inset:2.5px; background: var(--surface-2);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.accent-picker-fav-btn.active .accent-picker-fav-star{ background: var(--accent); }
.accent-picker-fav-btn.active .accent-picker-fav-star::after{ display:none; }

.toggle-switch{
  position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0;
  background: var(--surface-2); border:1px solid var(--border); border-radius:999px;
  transition: background .18s ease;
}
.toggle-switch.on{ background: var(--accent); border-color: var(--accent); }
.toggle-knob{
  position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
  background:#fff; transition: transform .18s ease;
}
.toggle-switch.on .toggle-knob{ transform: translateX(20px); background:#121316; }
.new-exercise-modal-body .plan-row{ margin-bottom:0; }
.new-exercise-modal-body .remove{ display:none; }

/* ---------- Performancemodus: Steigerungs-Vorschlag-Popup ---------- */
.perf-suggest-overlay{ position:fixed; inset:0; z-index:74; background:transparent; }
.perf-suggest-popup{
  position:fixed; z-index:75; visibility:hidden; opacity:0;

}

/* ---------- Workouts-Übersicht: Jahres-Zusammenfassung ---------- */
.workouts-year-header{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius);
  padding:14px 16px; color: var(--text); text-align:left; margin-top:18px;
}
.workouts-year-header:first-of-type{ margin-top:0; }
.workouts-year-header .mg-name{
  font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.5px; color: var(--accent);
}
.workouts-year-header .mg-meta{
  font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted);
  display:flex; align-items:center; gap:8px;
}
.workouts-year-body{ margin-top:12px; padding-left:2px; }
.workouts-year-body .muscle-group-header:first-child{ margin-top:0; }
.io-row{ display:flex; gap:10px; margin: 4px 0 12px; }
.io-row .btn{ flex:1; }
.danger-zone{
  margin-top:28px; padding-top:18px; border-top:1px dashed var(--border);
}
.danger-zone-title{
  font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--accent-2);
  margin-bottom:8px; font-weight:700;
}
.danger-zone-text{ font-size:12px; color: var(--muted); line-height:1.4; margin:0 0 12px; }

/* ---------- Start-Auswahl (Ganzkörper/Ober/Unter/Frei) ---------- */
.start-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  max-width: 320px; margin: 4px auto 24px;
}
/* Bei einer UNGERADEN Anzahl sichtbarer Kacheln (3 oder 5): alle bis auf die letzte bleiben
   im normalen 2er-Raster, die letzte füllt die komplette Breite der letzten Zeile aus (statt
   halb leer neben einer Lücke zu stehen) — dafür braucht sie ein anderes Seitenverhältnis,
   da sie jetzt doppelt so breit wie hoch ist. :last-child statt einer festen nth-child-Zahl,
   damit das unabhängig davon funktioniert, ob es 3 oder 5 Kacheln sind (z. B. durch
   zusätzliche Custom-Kategorien, siehe MAX_CUSTOM_CATEGORIES). */
.start-grid.count-odd .start-cell:last-child,
.start-grid.count-odd .start-cell:last-child .start-option,
.start-grid.count-odd .start-cell:last-child .start-cell-split{
  grid-column: 1 / -1;
}
.start-grid.count-odd .start-cell:last-child .start-option,
.start-grid.count-odd .start-cell:last-child .start-cell-split{
  aspect-ratio: auto; height:110px; flex-direction:row; gap:16px;
}
/* Bei ≤2 sichtbaren Kacheln: nebeneinander in einer Zeile statt im 2×2-Raster mit halb
   leerer zweiter Zeile — jede Kachel behält ihr quadratisches Seitenverhältnis. */
.start-grid.count-2{ grid-template-columns: 1fr 1fr; max-width: 280px; }
.start-grid.count-2 .start-cell{ grid-column: span 1; }
/* Bleibt nur noch "Frei" übrig (alle anderen Kacheln entfernt): füllt den kompletten
   verfügbaren Platz breit aus statt als einzelnes kleines Quadrat verloren dazustehen. */
.start-grid.count-1{ grid-template-columns: 1fr; max-width: 320px; }
.start-grid.count-1 .start-option{ aspect-ratio: auto; height:160px; }
.start-option{
  aspect-ratio: 1 / 1; border-radius: 24px;
  border:1px solid var(--border); background: var(--surface); color: var(--text);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:'Bebas Neue', sans-serif; font-size:17px; letter-spacing:0.5px; line-height:1.1;
  padding: 10px; transition: transform .08s ease, border-color .15s ease, background .15s ease;
}
.start-option .sub{
  display:block; font-family:'Inter', sans-serif; font-size:9.5px; text-transform:uppercase;
  letter-spacing:1px; color: var(--muted); font-weight:600; margin-top:3px;
}
.start-option:active{ transform: scale(0.95); background: var(--surface-2); }
.start-option.accent{ border-color: var(--accent); color: var(--accent); }
/* "Frei"-Kachel: bewusst dezent/ausgegraut statt in Akzentfarbe, nur ein großes Plus
   mittig — hebt sich damit klar von den "richtigen" Trainingskategorien ab. Zusätzlich
   reduzierte Opazität, damit Rahmen UND Plus spürbar blasser wirken als bei den anderen drei
   Kacheln (die bloße Randfarbe var(--border) allein sah dort optisch fast identisch aus).*/
.start-option.frei{ border-color: var(--border); color: var(--muted); font-size:40px; font-weight:300; opacity:0.45; }
.start-cell{ position:relative; width:100%; }
.start-cell .start-option{ width:100%; }
.start-edit-btn{
  position:absolute; top:-6px; right:-6px; width:28px; height:28px; border-radius:9px;
  background: var(--surface-2); border:1px solid var(--border); color: var(--muted);
  font-size:13px; display:flex; align-items:center; justify-content:center; z-index:2;
}
.start-edit-btn:active{ color: var(--accent); border-color: var(--accent); }
.mode-edit-hint{ font-size:13px; color: var(--muted); margin:0 0 16px; line-height:1.4; }

/* ---------- Split-Kachel (A/B direkt in der Start-Auswahl) ---------- */
.start-cell-split{
  aspect-ratio: 1 / 1; border-radius: 24px;
  border:1px solid var(--border); background: var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding: 10px; transition: background .15s ease, border-color .15s ease;
}
.start-cell-split:active{ background: var(--surface-2); border-color: var(--muted); }
.split-cell-top{ display:flex; align-items:center; gap:4px; }
.split-cell-label{
  font-family:'Bebas Neue', sans-serif; font-size:13px; letter-spacing:0.5px; color: var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px;
}
.split-cell-edit{
  background:none; border:none; color: var(--muted); font-size:12px; padding:2px; flex-shrink:0;
}
.split-cell-edit:active{ color: var(--accent); }
.split-cell-row{ display:flex; gap:8px; }
.split-cell-btn{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-family:'Bebas Neue', sans-serif; font-size:18px;
  transition: transform .08s ease, border-color .15s ease, color .15s ease;
}
.split-cell-btn:active{ transform: scale(0.93); border-color: var(--accent); color: var(--accent); }

/* ---------- Freie Übungsauswahl ---------- */
.select-row{
  display:flex; align-items:center; gap:10px;
  padding: 13px 16px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); margin-bottom:10px;
}
.select-row.checked{ border-color: var(--accent); }
.select-toggle{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.select-check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color: transparent;
}
.select-row.checked .select-check{ background: var(--accent); border-color: var(--accent); color:#121316; }
.select-name{ font-weight:600; }
.select-meta{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
.select-move{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
.move-btn{
  width:26px; height:22px; border-radius:6px; border:1px solid var(--border);
  background: var(--surface-2); color: var(--muted); font-size:10px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.move-btn:disabled{ opacity:.25; pointer-events:none; }
.move-btn:active{ color: var(--accent); border-color: var(--accent); }
.card-move-row{ display:flex; gap:8px; margin: 2px 0 10px; }

/* ---------- Frei-Auswahl (Bilder + Drag & Drop) ---------- */
.free-row{
  display:flex; align-items:center; gap:12px;
  height:60px; padding:0 14px; box-sizing:border-box;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  margin-bottom:8px; user-select: none; position:relative;
  /* pan-y statt none: erlaubt dem Browser natives, träges (Momentum-)Vertikal-Scrollen der
     Liste. Der Long-Press-Handler in wireFreeRowDrag() erkennt trotzdem zuverlässig den
     Moment, in dem eine Zeile stattdessen zum Umsortieren "gehalten" wird (siehe dortiger
     "pending"-Modus) und ruft dann selbst preventDefault() auf dem jeweiligen Move-Event auf. */
  touch-action: pan-y;
}
.free-row.checked{ border-color: var(--accent); }
.free-row-check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color: transparent;
}
.free-row.checked .free-row-check{ background: var(--accent); border-color: var(--accent); color:#121316; }
.free-row-media{ flex-shrink:0; }
.free-row-thumb{ width:40px; height:40px; border-radius:9px; object-fit:cover; display:block; pointer-events:none; }
.free-row-thumb-fallback{
  width:40px; height:40px; border-radius:9px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11px; color: var(--text);
}
.free-row-mid{ flex:1; min-width:0; }
.free-row-name{ font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.free-row-muscle{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
.card-move-row .move-btn{ width:auto; height:auto; padding:7px 10px; font-size:11px; flex:1; }

/* ---------- Session detail ---------- */
.detail-header{ margin-bottom: 12px; }
.detail-header h2{ font-family:'Bebas Neue', sans-serif; font-size:30px; margin:0 0 4px; letter-spacing:1px; }
.detail-stats{ display:flex; gap:8px 18px; flex-wrap:wrap; font-family:'JetBrains Mono', monospace; font-size:13px; color: var(--muted); line-height:1.3; }
.detail-stats span{ white-space:nowrap; }
.detail-full-toggle{
  width:100%; background:none; border:1px dashed var(--border); color: var(--muted);
  border-radius: var(--radius); padding:14px; font-size:14px; font-weight:600;
  margin-top:18px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;
}
.detail-full-toggle:active{ color: var(--text); border-color: var(--muted); }
.detail-full-toggle-chevron{ transition: transform .2s ease; display:inline-block; }
.detail-full-toggle-chevron.open{ transform: rotate(180deg); }
.detail-full-table-wrap{
  overflow: hidden; max-height:0; transition: max-height .25s ease;
}
.detail-full-table-wrap.open{ max-height: 6000px; }
table.detail-table{ width:100%; border-collapse: collapse; margin-top: 14px; }
table.detail-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted);
  padding: 8px 6px; border-bottom:1px solid var(--border);
}
table.detail-table td{
  padding: 8px 6px; font-family:'JetBrains Mono', monospace; font-size:13px;
}
table.detail-table tr.exercise-start td{ border-top:1px solid var(--border); }
table.detail-table tbody tr:first-child td{ border-top:none; }
.detail-actions{ display:flex; gap:8px; margin-top: 22px; justify-content:center; }
.detail-actions .btn{ flex:0 1 auto; padding:12px 14px; font-size:13.5px; }

/* ---------- Fixed bottom bar for active session ---------- */
/* ---------- Undo-Toast ---------- */
.undo-toast{
  position:fixed; left:16px; right:16px; bottom:20px; z-index:60;
  max-width:608px; margin:0 auto;
  background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius);
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: undoToastIn .2s ease;
}
@keyframes undoToastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.undo-toast-text{ font-size:14px; color: var(--text); }
.undo-toast-btn{
  background:none; border:none; color: var(--accent); font-weight:700; font-size:14px;
  padding:4px 8px; flex-shrink:0;
}

.bottom-bar{
  position:fixed; left:0; right:0; bottom:0;
  background: linear-gradient(180deg, transparent, var(--bg) 30%);
  padding: 20px 16px 22px;
}
.bottom-bar-inner{ max-width: 640px; margin:0 auto; display:flex; gap:10px; }
.bottom-bar-inner .btn{ flex:1; }

/* ---------- Print (PDF export) ---------- */
@media print{
  @page{ margin: 10mm; }
  html, body{ height:auto !important; min-height:0 !important; }
  body{ background:#fff; color:#000; }

  .summary-print-meta{

    padding:12px 20px; margin:2px auto 10px; border-radius:16px;

  .summary-badge-label{ color:#666; }
  .stats-row{ margin-bottom:14px; }
  .stat-card{ background:#fff; border-color:#ccc; padding:10px; }

  .history-row, .history-month-label{ color:#000; }
}

/* ---------------------------------------------------
   Storage helpers
--------------------------------------------------- */
async function loadJSON(key, fallback){
  try{
    if (window.storage){
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    }
  }catch(e){ /* window.storage nicht verfügbar hier — auf localStorage ausweichen */ }
  try{
    const raw = localStorage.getItem('eisenprotokoll:' + key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveJSON(key, value){
  try{
    if (window.storage){
      const res = await window.storage.set(key, JSON.stringify(value), false);
      if (res) return;
    }
  }catch(e){ /* window.storage nicht verfügbar hier — auf localStorage ausweichen */ }
  try{
    localStorage.setItem('eisenprotokoll:' + key, JSON.stringify(value));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
    alert('Speichern hat nicht geklappt: ' + e.message);
  }
}
