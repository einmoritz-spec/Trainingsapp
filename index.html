// Über den Farbwähler per Stern als Favorit gespeicherte eigene Farbtöne — persistiert in
// plan.favoriteAccentColors (Array aus Hex-Strings), werden zusätzlich zur festen
// ACCENT_COLORS-Palette im Swatch-Grid angezeigt (siehe allAccentSwatches()). Jeder Favorit
// bekommt eine stabile id nach dem Muster 'fav-<hex ohne #>', damit er wie ein normaler
// Swatch per data-accent-id auswählbar ist.
function favoriteAccentColors(){
  return Array.isArray(plan && plan.favoriteAccentColors) ? plan.favoriteAccentColors : [];
}
function allAccentSwatches(){
  const favs = favoriteAccentColors().map(hex => ({ id: `fav-${hex.replace('#','')}`, name: hex.toUpperCase(), hex, isFavorite: true }));
  return [...ACCENT_COLORS, ...favs];
}

function currentAccentColor(){
  // Ein individuell auf der Farbpalette gewählter Ton (plan.accentColorId === 'custom')
  // hat Vorrang vor den festen Swatches — der Hex-Wert selbst steckt dann in
  // plan.accentCustomHex statt in ACCENT_COLORS nachgeschlagen zu werden.
  if (plan && plan.accentColorId === 'custom' && plan.accentCustomHex){
    return { id: 'custom', name: 'Eigene Farbe', hex: plan.accentCustomHex };
  }
  const id = plan && plan.accentColorId;
  return allAccentSwatches().find(c => c.id === id) || ACCENT_COLORS[0];
}
function currentThemeMode(){
  return (plan && plan.themeMode === 'light') ? 'light' : 'dark';
}

// Eigene Rahmenfarbe pro Trainings-Kachel (Kategorie), unabhängig vom globalen App-Akzent —
// per Long-Press auf eine Kachel erreichbar (siehe wireModeLongPress() / openModeSettingsPrompt()).
// Nutzt dieselbe Farbpalette + Favoriten wie der Akzentfarben-Picker in den Einstellungen.
function currentTileColor(mode){
  const ms = plan && plan.modeSettings && plan.modeSettings[mode];
  if (!ms || !ms.tileColorId) return null; // kein eigener Rahmen gesetzt -> Standard-Rahmenfarbe
  if (ms.tileColorId === 'custom' && ms.tileColorHex) return { id: 'custom', name: 'Eigene Farbe', hex: ms.tileColorHex };
  return allAccentSwatches().find(c => c.id === ms.tileColorId) || null;
}

// Wendet die aktuell gespeicherte Akzentfarbe + Hell-/Dunkelmodus auf das Dokument an —
// aufgerufen einmal beim Start (vor dem ersten Render) und jedes Mal, wenn eine der beiden
// Einstellungen geändert wird (siehe renderSettings()). Setzt --accent per Inline-Style auf
// <html>, das überschreibt den Default aus dem :root-Selektor mit höherer Spezifität, ohne
// dass irgendeine andere Stelle im CSS angefasst werden muss (alles nutzt bereits var(--accent)).
// Liest eine CSS-Variable (z. B. '--accent', '--accent-3') als aktuell berechneten Wert vom
// <html>-Element aus — gebraucht für die SVG/Chart-Funktionen weiter unten, die als reine
// JS-Strings arbeiten und daher nicht automatisch von var(--accent) im CSS profitieren.
// Dadurch ziehen Diagrammfarben bei Akzentfarben-/Theme-Wechsel korrekt mit.
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// HSV↔Hex-Umrechnung für die freie Farbpalette (siehe wireAccentColorPicker) — die Palette
// selbst arbeitet mit Sättigung(x)/Helligkeit(y) bei festem Farbton (Hue), daher wird HSV
// statt RGB direkt manipuliert.
function hsvToHex(h, s, v){
  s /= 100; v /= 100;
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r=0,g=0,b=0;
  if (h < 60){ r=c; g=x; b=0; }
  else if (h < 120){ r=x; g=c; b=0; }
  else if (h < 180){ r=0; g=c; b=x; }
  else if (h < 240){ r=0; g=x; b=c; }
  else if (h < 300){ r=x; g=0; b=c; }
  else { r=c; g=0; b=x; }
  const toHex = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function hexToHsv(hex){
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  let h = 0;
  if (d !== 0){
    if (max === r) h = 60 * (((g - b) / d) % 6);
    else if (max === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  if (h < 0) h += 360;
  const s = max === 0 ? 0 : (d / max) * 100;
  const v = max * 100;
  return { h, s, v };
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', currentThemeMode());
  document.documentElement.style.setProperty('--accent', currentAccentColor().hex);
}

async function init(){

  plan = await loadJSON('plan', DEFAULT_PLAN);
  sessions = await loadJSON('sessions', []);
  lastPerformance = await loadJSON('lastPerformance', {});
  applyTheme();

  let planChanged = false;
  DEFAULT_PLAN.exercises.forEach(defEx => {
    if (!plan.exercises.some(e => e.id === defEx.id)){
      plan.exercises.push({ ...defEx });
      planChanged = true;
    }
  });
  plan.exercises.forEach(ex => {
    if (!ex.muscleGroup){
      const def = DEFAULT_PLAN.exercises.find(d => d.id === ex.id);
      ex.muscleGroup = def ? def.muscleGroup : 'Sonstige';
      planChanged = true;
    }
    if (!ex.mainMuscle){
      const def = DEFAULT_PLAN.exercises.find(d => d.id === ex.id);
      ex.mainMuscle = def ? def.mainMuscle : (ex.muscleGroup || '');
      planChanged = true;
    }
  });
  if (plan.bodyWeight === undefined) plan.bodyWeight = null;
  if (!plan._assistedFlagMigration){
    const assistedIds = new Set(['e1']); // Klimmzugmaschine: unterstützt, Volumen = Körpergewicht - eingestelltes Gewicht
    assistedIds.forEach(id => {
      const ex = plan.exercises.find(e => e.id === id);
      if (ex && !ex.assisted){
        ex.assisted = true;
        planChanged = true;
      }
    });
    plan._assistedFlagMigration = true;
    planChanged = true;
  }
  if (!plan._catFixCoreLowerBody){
    ['e6', 'e7', 'e8', 'e14', 'e20'].forEach(id => {
      const ex = plan.exercises.find(e => e.id === id);
      if (ex && ex.category !== 'unterkoerper'){
        ex.category = 'unterkoerper';
        planChanged = true;
      }
    });
    plan._catFixCoreLowerBody = true;
    planChanged = true;
  }
  if (!plan._stripCoreFromOberkoerperList){
    const reclassified = new Set(['e6', 'e7', 'e8', 'e14', 'e20']);
    const stored = plan.modeLists && plan.modeLists.oberkoerper;
    if (stored){
      if (Array.isArray(stored)){
        const filtered = stored.filter(id => !reclassified.has(id));
        if (filtered.length !== stored.length){
          plan.modeLists.oberkoerper = filtered;
          planChanged = true;
        }
      } else if (typeof stored === 'object'){
        ['A', 'B'].forEach(k => {
          if (Array.isArray(stored[k])){
            const filtered = stored[k].filter(id => !reclassified.has(id));
            if (filtered.length !== stored[k].length){
              stored[k] = filtered;
              planChanged = true;
            }
          }
        });
      }
    }
    plan._stripCoreFromOberkoerperList = true;
    planChanged = true;
  }
  if (!plan._defaultModeListsMigration){
    // Setzt die Standard-Übungslisten für Ganzkörper A/B und Oberkörper A/B (siehe
    // DEFAULT_PLAN.modeLists) einmalig auch bei Bestandsnutzer:innen — aber NUR für
    // Modus/Variante-Kombinationen, die noch komplett leer/unbelegt sind. Wurde für einen
    // Modus bereits (auch nur teilweise) manuell etwas eingerichtet, bleibt das unangetastet.
    if (!plan.modeLists) plan.modeLists = {};
    ['ganzkoerper', 'oberkoerper', 'unterkoerper'].forEach(mode => {
      const def = DEFAULT_PLAN.modeLists[mode];
      const stored = plan.modeLists[mode];
      const isEmpty = !stored || (typeof stored === 'object' && !Array.isArray(stored)
        && (!stored.A || !stored.A.length) && (!stored.B || !stored.B.length));
      if (isEmpty && def){
        plan.modeLists[mode] = { A: [...def.A], B: [...def.B] };
        planChanged = true;
      }
    });
    plan._defaultModeListsMigration = true;
    planChanged = true;
  }
  if (!plan._bodyPartMigration){
    // Trägt bei bereits vorhandenen Standardübungen (Abgleich über id mit
    // DEFAULT_PLAN.exercises) nachträglich die Push/Pull/Legs-Zuordnung (ex.bodyPart) nach,
    // falls sie dort noch fehlt — betrifft alle, die ihren Plan bereits vor Einführung dieses
    // Felds gespeichert hatten. Selbst angelegte Übungen ohne passende Standard-id bleiben
    // unangetastet (weiterhin "keine Zuordnung", manuell im Editor setzbar).
    const defaultBodyParts = {};
    DEFAULT_PLAN.exercises.forEach(e => { defaultBodyParts[e.id] = e.bodyPart; });
    plan.exercises.forEach(ex => {
      if (!ex.bodyPart && defaultBodyParts[ex.id]){
        ex.bodyPart = defaultBodyParts[ex.id];
        planChanged = true;
      }
    });
    plan._bodyPartMigration = true;
    planChanged = true;
  }
  if (planChanged) await saveJSON('plan', plan);

  active = await loadJSON('activeSession', null);
  if (active){
    restState = null;
    addExerciseOpen = false;
    replaceView('active');
    renderActive();
    timerHandle = setInterval(updateTimerDisplay, 1000);
  } else {
    replaceView('home');
    renderHome();
    if (plan.bodyWeight === null || plan.bodyWeight === undefined) openBodyWeightPrompt();
  }
}

// Zeigt beim allerersten Öffnen (bzw. solange kein Körpergewicht hinterlegt ist) einmalig ein
// Popup zum Eintragen an — Körpergewicht wird für die Volumen-Berechnung bei unterstützten
// Übungen (z. B. Klimmzugmaschine) und Eigenkörpergewicht-Übungen gebraucht (effectiveSetWeight()),
// ohne es zeigt die App sonst nur das rohe Gerätegewicht statt des tatsächlich bewegten Gewichts.
// Erscheint nur auf der Startseite direkt nach dem Laden, nicht bei jedem View-Wechsel.
// Ersetzt den nativen prompt() für den Reset-Bestätigungscode durch ein eigenes Popup mit
// echtem Zahlenfeld (inputmode="numeric" + type="tel", damit die numerische Tastatur direkt
// aufgeht statt der vollen Buchstabentastatur) — prompt() bietet dafür keine Kontrolle über
// den Tastaturtyp. onConfirm wird nur aufgerufen, wenn der eingegebene Code exakt "0000" ist.
// Popup für eine frei eingegebene Pausendauer — per Long-Press auf einen der drei
// Pausen-Buttons erreichbar (siehe wireRestButtonLongPress() in renderActive()). Mit dem
// grünen Haken bestätigen startet die Pause direkt mit der eingegebenen Sekundenzahl,
// genau wie ein Tap auf einen der festen 30s/60s/90s-Buttons.
function openCustomRestPrompt(){
  const existing = document.getElementById('customRestOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'add-exercise-overlay centered-overlay';
  overlay.id = 'customRestOverlay';
  overlay.innerHTML = `
    <div class="add-exercise-modal" style="max-height:none;">
      <div class="add-exercise-modal-header">
        <div class="add-exercise-modal-title">Eigene Pause</div>
        <button class="add-exercise-modal-close" id="customRestClose" aria-label="Abbrechen">✕</button>
      </div>
      <div class="new-exercise-modal-body">
        <label class="justify-text" style="display:block; font-size:13px; color:var(--muted); margin-bottom:10px;">
          Pausendauer in Sekunden eingeben.
        </label>
        <input type="number" inputmode="numeric" id="customRestSeconds" min="1" placeholder="z. B. 45" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:18px; text-align:center;">
      </div>
      <div class="add-exercise-modal-header" style="border-top:1px solid var(--border); border-bottom:none; justify-content:center;">
        <button class="perf-suggest-btn perf-suggest-btn-confirm" id="customRestSubmit" type="button" aria-label="Pause starten" style="width:56px; height:44px; font-size:20px;">✓</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(remove);

  function remove(){ const el = document.getElementById('customRestOverlay'); if (el) el.remove(); }
  const close = () => { popOverlayStateIfOpen(); remove(); };

  const input = document.getElementById('customRestSeconds');
  input.focus();
  let submitted = false;
  const submit = () => {
    if (submitted) return; // verhindert doppeltes Starten, falls Enter/change kurz hintereinander feuern
    const seconds = Math.round(Number(input.value));
    if (!input.value || isNaN(seconds) || seconds <= 0){
      alert('Bitte eine gültige Anzahl Sekunden eingeben.');
      return;
    }
    submitted = true;
    close();
    startRest(seconds);
  };
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter'){
      ev.preventDefault();
      input.blur(); // löst "change" aus, siehe unten
    }
  };
  // Bestätigt man die Eingabe direkt im Zahlen-Rad/Ziffernblock über deren eigenen Haken
  // (bzw. verlässt das Feld nach Eingabe über die normale Tastatur), startet die Pause sofort
  // — ganz ohne zusätzliche Bestätigung über den Haken hier im Popup. Sowohl das Scroll-Rad
  // als auch der Ziffernblock lösen beim Bestätigen ein natives "change"-Event auf dem Feld
  // aus (siehe openScrollWheelForInput()/openKeypadForInput()), ebenso ein normaler Blur.
  input.addEventListener('change', () => {
    if (input.value) submit();
  });
  document.getElementById('customRestSubmit').onclick = submit;
  document.getElementById('customRestClose').onclick = close;
  overlay.onclick = (ev) => { if (ev.target === overlay) close(); };
}

function openResetConfirmPrompt(onConfirm){
  const existing = document.getElementById('resetConfirmOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'add-exercise-overlay centered-overlay';
  overlay.id = 'resetConfirmOverlay';
  overlay.innerHTML = `
    <div class="add-exercise-modal" style="max-height:none;">
      <div class="add-exercise-modal-header">
        <div class="add-exercise-modal-title">Wirklich zurücksetzen?</div>
        <button class="add-exercise-modal-close" id="resetConfirmClose" aria-label="Abbrechen">✕</button>
      </div>
      <div class="new-exercise-modal-body">
        <label class="justify-text" style="display:block; font-size:13px; color:var(--muted); margin-bottom:10px;">
          Setzt Übungen, Verlauf und den gespeicherten Fortschritt komplett zurück. Zur
          Bestätigung Code eingeben: <strong style="color:var(--text);">0000</strong>
        </label>
        <input type="tel" inputmode="numeric" id="resetConfirmInput" placeholder="Code" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:16px; letter-spacing:4px; text-align:center;">
      </div>
      <div class="add-exercise-modal-header" style="border-top:1px solid var(--border); border-bottom:none; gap:10px;">
        <button class="btn btn-ghost" id="resetConfirmCancel" style="flex:1;">Abbrechen</button>
        <button class="btn btn-danger" id="resetConfirmSubmit" style="flex:1;">Zurücksetzen</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(remove);

  function remove(){ const el = document.getElementById('resetConfirmOverlay'); if (el) el.remove(); }
  const close = () => { popOverlayStateIfOpen(); remove(); };
  const input = document.getElementById('resetConfirmInput');
  input.focus();
  const submit = () => {
    if (input.value !== '0000'){
      alert('Falscher Code. Zurücksetzen abgebrochen.');
      close();
      return;
    }
    close();
    onConfirm();
  };
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter'){
      ev.preventDefault();
      input.blur();
      submit();
    }
  };
  document.getElementById('resetConfirmSubmit').onclick = submit;
  document.getElementById('resetConfirmCancel').onclick = close;
  document.getElementById('resetConfirmClose').onclick = close;
}

/* ---------------------------------------------------
   SCROLL-WHEEL ZAHLENEINGABE (Einstellungen-Schalter)
--------------------------------------------------- */
// Alternative Eingabemethode für alle Zahlenfelder in der App (Sätze, Wdh, kg, Sekunden,
// Körpergewicht, Reset-Code): statt der System-Tastatur öffnet sich ein Scroll-Rad
// (wie man es z. B. von iOS-Datumsauswahl oder Timer-Pickern kennt), fließend animiert
// per CSS scroll-snap. Wird global über einen einzigen focusin-Listener auf document
// verkabelt (siehe wireScrollWheelInputs()), damit jedes bestehende und jedes neu
// gerenderte input[type="number"] automatisch erfasst wird — keine einzelne Render-
// Funktion muss dafür angepasst werden.
let scrollWheelActiveInput = null;

// Zentrale Quelle für den aktuell gewählten alternativen Zahleneingabe-Modus: 'system'
// (normale Gerätetastatur, Standard/Fallback), 'wheel' (Scroll-Rad) oder 'keypad'
// (eigener großer Ziffernblock) — in den Einstellungen umschaltbar, siehe renderSettings().
// Beide Alternativmodi schließen sich gegenseitig aus (immer nur einer aktiv).
function numberInputMode(){
  const m = plan && plan.numberInputMode;
  if (m === 'wheel' || m === 'keypad' || m === 'combo' || m === 'system') return m;
  return 'keypad'; // Standardmäßig aktiviert, statt der normalen System-Tastatur
}
function isScrollWheelInputEnabled(){
  return numberInputMode() === 'wheel';
}
function isKeypadInputEnabled(){
  return numberInputMode() === 'keypad';
}

// Ermittelt für ein gegebenes Zahlenfeld einen sinnvollen Wertebereich und eine
// Schrittweite, damit das Rad weder zu grob (kg in 1er-Schritten bis 999) noch zu fein
// (Sätze in 0.5er-Schritten) wird. Fällt auf min/max/step-Attribute des <input> zurück,
// wo vorhanden, sonst auf plausible Defaults je nach data-field/id.
function scrollWheelRangeFor(input){
  const field = input.dataset.field || input.id || '';
  const attrMin = input.min !== '' ? Number(input.min) : null;
  const attrStep = input.step !== '' && input.step !== undefined ? Number(input.step) : null;
  let min = attrMin ?? 0;
  let max = 300;
  let step = attrStep && !isNaN(attrStep) ? attrStep : 1;

  if (/weight|kg|bodyWeight/i.test(field)){
    min = 0;
    // Trainingsgewicht (an Geräten/mit Hanteln bewegtes Gewicht) endet bei 150kg — das
    // Körpergewicht-Feld in den Einstellungen ("bodyWeight") kann dagegen durchaus darüber
    // liegen und behält den größeren Bereich.
    max = /bodyWeight/i.test(field) ? 300 : 150;
    // An Geräten/Maschinen wird das Gewicht praktisch immer in 5kg-Stufen eingestellt —
    // nur bei echten (Kurz-/Lang-)Hantel-Übungen sind feinere 0,5-2,5kg-Schritte üblich
    // (kleine Scheiben/Kurzhantel-Sätze). Erkennung anhand des Übungsnamens, da es dafür
    // aktuell kein eigenes Datenfeld gibt; ohne erkennbaren Übungsnamen (z. B. Körpergewicht-
    // Feld in den Einstellungen) gilt der 5kg-Standard.
    const exerciseName = (scrollWheelActiveExerciseName() || '').toLowerCase();
    const isDumbbellExercise = /hantel/.test(exerciseName);
    step = isDumbbellExercise ? (attrStep || 0.5) : 5;
  }
  else if (/reps|sets/i.test(field)){ min = attrMin ?? 1; max = 100; step = 1; }
  else if (/seconds/i.test(field)){ min = attrMin ?? 1; max = 600; step = 1; }

  return { min, max, step };
}

// Liefert den Übungsnamen zum aktuell fokussierten Zahlenfeld, soweit ermittelbar — für die
// Hantel-Erkennung in scrollWheelRangeFor(). Sucht zuerst im aktiven Training nach dem
// Namensfeld der Übungskarte, sonst im Übungen-Editor/Popup nach dem data-field="name"-Feld
// derselben .plan-row/.exercise-card. Liefert null, wenn kein Übungskontext auffindbar ist.
function scrollWheelActiveExerciseName(){
  if (!scrollWheelActiveInput) return null;
  if (active && active.entries && active.entries[active.currentIndex]){
    return active.entries[active.currentIndex].name || null;
  }
  const card = scrollWheelActiveInput.closest('.plan-row, .new-exercise-modal-body');
  const nameField = card && card.querySelector('[data-field="name"], #wizName');
  return nameField ? nameField.value : null;
}

function formatWheelValue(v, step){
  // Bei Nachkommaschritten (z. B. 0.5 bei kg) eine Nachkommastelle zeigen, sonst ganzzahlig.
  return step % 1 !== 0 ? v.toFixed(1) : String(Math.round(v));
}

function openScrollWheelForInput(input){
  if (scrollWheelActiveInput === input) return;
  scrollWheelActiveInput = input;
  input.blur();

  const { min, max, step } = scrollWheelRangeFor(input);
  const values = [];
  for (let v = min; v <= max + step / 2; v += step) values.push(Math.round(v * 100) / 100);
  const wasEmpty = input.value === '';
  const current = wasEmpty ? values[0] : Number(input.value);
  let closestIndex = 0;
  let closestDiff = Infinity;
  values.forEach((v, i) => { const d = Math.abs(v - current); if (d < closestDiff){ closestDiff = d; closestIndex = i; } });
  // War das Feld ursprünglich leer (z. B. noch nie protokollierter Satz), soll ein bloßes
  // Öffnen und wieder Schließen des Rads OHNE es zu berühren nicht automatisch den
  // Startwert (üblicherweise min, z. B. "1" bei Sekunden) eintragen — erst eine tatsächliche
  // Interaktion (Ziehen, Antippen einer Zeile, Combo-Tippen) markiert touched=true und macht
  // den aktuell eingerasteten Wert beim Bestätigen verbindlich.
  let touched = !wasEmpty;

  const existing = document.getElementById('scrollWheelOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'scroll-wheel-overlay';
  overlay.id = 'scrollWheelOverlay';
  const label = input.closest('div') && input.closest('div').querySelector('label')
    ? input.closest('div').querySelector('label').textContent
    : (input.placeholder || input.getAttribute('aria-label') || 'Wert');
  const isCombo = numberInputMode() === 'combo';
  const allowDecimalCombo = step % 1 !== 0;
  overlay.innerHTML = `
    <div class="scroll-wheel-sheet">
      <div class="scroll-wheel-header">
        <span class="scroll-wheel-label">${label}</span>
      </div>
      <div class="scroll-wheel-viewport">
        <div class="scroll-wheel-highlight"></div>
        <div class="scroll-wheel-track" id="scrollWheelTrack">
          ${values.map(v => `<div class="scroll-wheel-item">${formatWheelValue(v, step)}</div>`).join('')}
        </div>
      </div>
      ${isCombo ? `
      <div class="keypad-inline">
        <div class="keypad-display-row">
          <span class="keypad-display" id="comboDisplay">&nbsp;</span>
          <button class="keypad-confirm" id="scrollWheelDone" aria-label="Übernehmen"><span class="keypad-check"></span></button>
        </div>
        <div class="keypad-grid">
          ${['1','2','3','4','5','6','7','8','9'].map(n => `<button class="keypad-key" data-key="${n}">${n}</button>`).join('')}
          <button class="keypad-key ${allowDecimalCombo ? '' : 'keypad-key-disabled'}" data-key="." ${allowDecimalCombo ? '' : 'disabled'}>,</button>
          <button class="keypad-key" data-key="0">0</button>
          <button class="keypad-key keypad-key-del" data-key="del" aria-label="Löschen"></button>
        </div>
      </div>
      ` : `<button class="btn btn-primary" id="scrollWheelDone" style="margin:12px 16px 16px;">Fertig</button>`}
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(finish);

  const track = document.getElementById('scrollWheelTrack');
  const items = track.querySelectorAll('.scroll-wheel-item');
  const itemHeight = 44;

  // ---- Eigene Touch-Physik statt browsereigenem Scroll+CSS-snap ----
  // Der native Scroll-Container ist bewusst NICHT scrollbar (overflow:hidden per CSS,
  // siehe .scroll-wheel-track) — stattdessen wird die Position (offsetY, in Pixeln)
  // komplett selbst verwaltet und per CSS-transform auf .scroll-wheel-track angewendet.
  // Das erlaubt "echtes" Momentum-Scrolling mit Reibung/Trägheit nach dem Loslassen
  // (wie man es von iOS-Pickern kennt) und exaktes Vibrationsfeedback bei jedem
  // Werte-Wechsel, was mit reinem CSS scroll-snap / scrollTo() nicht zuverlässig möglich war.
  let offsetY = -closestIndex * itemHeight; // Position des Tracks relativ zur Ruhelage
  let velocity = 0;
  let lastY = 0;
  let lastT = 0;
  let dragging = false;
  let momentumRAF = null;
  let selectedIndex = closestIndex;
  const minOffset = -(values.length - 1) * itemHeight;
  const maxOffset = 0;

  function applyOffset(){
    track.style.transform = `translateY(${offsetY}px)`;
    const idx = Math.round(-offsetY / itemHeight);
    const clamped = Math.max(0, Math.min(values.length - 1, idx));
    if (clamped !== selectedIndex){
      selectedIndex = clamped;
      if (navigator.vibrate) navigator.vibrate(6);
    }
    items.forEach((el, i) => el.classList.toggle('active', i === selectedIndex));
  }
  applyOffset();

  function settle(){
    // Nach Loslassen: sanft (per Feder-artiger Interpolation) auf den nächstgelegenen
    // Rasterwert einrasten, inklusive Begrenzung an den Rändern (kein Überscrollen ins Leere).
    const targetIndex = Math.max(0, Math.min(values.length - 1, Math.round(-offsetY / itemHeight)));
    const target = -targetIndex * itemHeight;
    cancelAnimationFrame(momentumRAF);
    const step2 = () => {
      offsetY += (target - offsetY) * 0.22;
      if (Math.abs(target - offsetY) < 0.5){
        offsetY = target;
        applyOffset();
        return;
      }
      applyOffset();
      momentumRAF = requestAnimationFrame(step2);
    };
    step2();
  }

  // Ab 50kg bremst das Rad zunehmend stärker (nur bei Gewichtsfeldern) — verhindert, dass
  // man mit Schwung aus dem niedrigen Bereich versehentlich bis an die 150kg-Obergrenze
  // durchrutscht. Der Bremsfaktor steigt linear von 1× (bei 50kg) auf 2,6× (bei 150kg) und
  // bleibt außerhalb dieses Bereichs (z. B. bei Wdh/Sätzen/Sekunden) bei 1× unverändert.
  const isWeightField = /weight|kg|bodyWeight/i.test(input.dataset.field || input.id || '');
  const brakeStartValue = 50;
  function brakeFactorAt(offset){
    if (!isWeightField) return 1;
    const idx = Math.max(0, Math.min(values.length - 1, Math.round(-offset / itemHeight)));
    const value = values[idx];
    if (value <= brakeStartValue) return 1;
    const t = Math.min(1, (value - brakeStartValue) / (max - brakeStartValue || 1));
    return 1 + t * 1.6;
  }

  function runMomentum(){
    // Trägheits-Phase nach dem Loslassen: velocity klingt exponentiell ab (Reibung), bis sie
    // vernachlässigbar klein ist, danach wird per settle() eingerastet — das erzeugt genau das
    // "Schwung nehmen"-Gefühl eines echten Scroll-Rads statt eines abrupten Stopps.
    cancelAnimationFrame(momentumRAF);
    const baseFriction = 0.94;
    const step2 = () => {
      // Stärkere Reibung im Bremsbereich: baseFriction wird durch den Bremsfaktor "verstärkt"
      // (näher an 0 gebracht), sodass velocity dort schneller abklingt.
      const brake = brakeFactorAt(offsetY);
      const friction = Math.max(0.5, 1 - (1 - baseFriction) * brake);
      velocity *= friction;
      offsetY += velocity;
      offsetY = Math.max(minOffset - itemHeight, Math.min(maxOffset + itemHeight, offsetY));
      applyOffset();
      if (Math.abs(velocity) > 0.4){
        momentumRAF = requestAnimationFrame(step2);
      } else {
        settle();
      }
    };
    step2();
  }

  function onPointerDown(ev){
    dragging = true;
    touched = true;
    cancelAnimationFrame(momentumRAF);
    lastY = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    lastT = performance.now();
    velocity = 0;
  }
  function onPointerMove(ev){
    if (!dragging) return;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    const now = performance.now();
    const dy = y - lastY;
    const dt = Math.max(1, now - lastT);
    // Im Bremsbereich (siehe brakeFactorAt) wird auch die direkte Fingerbewegung gedämpft,
    // nicht nur das Momentum nach dem Loslassen — sonst würde man beim Ziehen bis 150kg
    // trotzdem "durchrutschen" können, nur das Abbremsen danach wäre stärker.
    const brake = brakeFactorAt(offsetY);
    const dampedDy = dy / brake;
    velocity = dampedDy / dt * 16; // auf "Pixel pro Frame" (≈16ms) normalisiert
    offsetY += dampedDy;
    // Leichter Gummizug-Widerstand über die Ränder hinaus, klar begrenzt statt endlosem Scroll.
    if (offsetY > maxOffset) offsetY = maxOffset + (offsetY - maxOffset) * 0.35;
    if (offsetY < minOffset) offsetY = minOffset + (offsetY - minOffset) * 0.35;
    applyOffset();
    lastY = y; lastT = now;
    ev.preventDefault();
  }
  function onPointerUp(){
    if (!dragging) return;
    dragging = false;
    if (Math.abs(velocity) > 1){
      runMomentum();
    } else {
      settle();
    }
  }

  track.addEventListener('touchstart', onPointerDown, { passive: true });
  track.addEventListener('touchmove', onPointerMove, { passive: false });
  track.addEventListener('touchend', onPointerUp);
  track.addEventListener('touchcancel', onPointerUp);
  // Desktop-Fallback (Maus ziehen)
  track.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  // Tippen auf eine einzelne Zeile springt direkt zu diesem Wert (mit Feder-Einraster).
  items.forEach((el, i) => {
    el.addEventListener('click', () => {
      if (dragging) return;
      touched = true;
      animateToIndex(i);
    });
  });

  function finish(){
    popOverlayStateIfOpen();
    cancelAnimationFrame(momentumRAF);
    window.removeEventListener('mousemove', onPointerMove);
    window.removeEventListener('mouseup', onPointerUp);
    const el = document.getElementById('scrollWheelOverlay');
    if (el) el.remove();
    scrollWheelActiveInput = null;
    // War das Feld ursprünglich leer und wurde das Rad nie berührt (touched === false),
    // bleibt es leer statt automatisch den Startwert (min) einzutragen — siehe touched-
    // Kommentar weiter oben. Sonst hat im kombinierten Modus direkt getippter Text Vorrang
    // vor dem Rad-Rasterwert (erlaubt Feinwerte außerhalb der Rad-Schrittweite, z. B. 63kg
    // bei einem 5kg-Raster); ist nichts getippt, gilt der zuletzt eingerastete Rad-Wert.
    if (!touched){
      // nichts zu tun — input.value bleibt unverändert (leer)
    } else {
      const typedValue = isCombo && comboValueStr !== '' ? Number(comboValueStr) : null;
      const finalValue = typedValue !== null && !isNaN(typedValue) ? typedValue : values[selectedIndex];
      if (input.value !== String(finalValue)){
        input.value = isCombo && typedValue !== null ? comboValueStr : formatWheelValue(finalValue, step);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
  }
  document.getElementById('scrollWheelDone').onclick = () => {
    if (navigator.vibrate) navigator.vibrate(10);
    popOverlayStateIfOpen();
    finish();
  };
  overlay.onclick = (ev) => { if (ev.target === overlay){ popOverlayStateIfOpen(); finish(); } };

  // ---- Kombinierter Modus: Ziffernblock unter dem Rad, beide Richtungen synchronisiert ----
  let comboValueStr = '';
  if (isCombo){
    const comboDisplay = document.getElementById('comboDisplay');
    function updateComboDisplay(){ comboDisplay.innerHTML = comboValueStr || '&nbsp;'; }
    overlay.querySelectorAll('.keypad-key').forEach(btn => {
      btn.onclick = () => {
        if (btn.disabled) return;
        if (navigator.vibrate) navigator.vibrate(10);
        touched = true;
        const key = btn.dataset.key;
        if (key === 'del') comboValueStr = comboValueStr.slice(0, -1);
        else if (key === '.'){ if (!comboValueStr.includes('.')) comboValueStr = (comboValueStr || '0') + '.'; }
        else comboValueStr = (comboValueStr === '0') ? key : comboValueStr + key;
        updateComboDisplay();
        // Rad synchron zum getippten Wert mitscrollen (mit derselben Feder-Animation wie
        // beim Antippen einer Radzeile), solange der getippte Wert eine gültige Zahl ergibt.
        const typed = Number(comboValueStr);
        if (comboValueStr !== '' && !isNaN(typed)){
          let nearestIdx = 0, nearestDiff = Infinity;
          values.forEach((v, i) => { const d = Math.abs(v - typed); if (d < nearestDiff){ nearestDiff = d; nearestIdx = i; } });
          animateToIndex(nearestIdx);
        }
      };
    });
    // Rad-Bewegung synchron im Ziffernblock-Display anzeigen — wer erst am Rad dreht und
    // danach weitertippt, sieht durchgehend einen konsistenten Wert statt zweier
    // auseinanderlaufender Anzeigen.
    const originalApplyOffset = applyOffset;
    applyOffset = function(){
      originalApplyOffset();
      if (!document.activeElement || document.activeElement.tagName !== 'BUTTON'){
        comboValueStr = formatWheelValue(values[selectedIndex], step);
        updateComboDisplay();
      }
    };
    comboValueStr = formatWheelValue(values[closestIndex], step);
    updateComboDisplay();
  }

  function animateToIndex(i){
    cancelAnimationFrame(momentumRAF);
    const target = -i * itemHeight;
    const start = offsetY;
    const startT = performance.now();
    const dur = 220;
    const stepAnim = (now) => {
      const t = Math.min(1, (now - startT) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      offsetY = start + (target - start) * eased;
      applyOffset();
      if (t < 1) momentumRAF = requestAnimationFrame(stepAnim);
    };
    momentumRAF = requestAnimationFrame(stepAnim);
  }
}

// Einmalig verkabelt: fängt jeden Fokus auf ein Zahlenfeld ab (auch neu ins DOM gerenderte,
// da focusin bubblet), solange die Einstellung aktiv ist, und öffnet statt der System-
// Tastatur das Scroll-Rad. readOnly verhindert dabei zusätzlich, dass die virtuelle
// Tastatur kurz aufblitzt, bevor das Overlay erscheint.
// Hält alle offenen Popups (.add-exercise-overlay, .scroll-wheel-overlay,
// .history-context-overlay) über der virtuellen Tastatur, statt dass sie dahinter
// verschwinden. Das reine CSS-Problem: position:fixed bezieht sich auf die volle
// Fenstergröße inkl. des von der Tastatur verdeckten Bereichs — window.visualViewport
// meldet dagegen live die tatsächlich sichtbare Höhe/den sichtbaren Ausschnitt. Setzt bei
// jeder Änderung (Tastatur auf/zu, Zoom, Rotation) height/top aller offenen Overlays neu.
function wireViewportAwareOverlays(){
  const vv = window.visualViewport;
  if (!vv) return; // Fallback: älterer Browser ohne API — Overlays bleiben bei 100%/CSS-Default

  const OVERLAY_SELECTOR = '.add-exercise-overlay, .scroll-wheel-overlay, .history-context-overlay';

  function applyViewport(){
    const overlays = document.querySelectorAll(OVERLAY_SELECTOR);
    if (!overlays.length) return;
    const height = vv.height;
    const top = vv.offsetTop;
    overlays.forEach(el => {
      el.style.height = `${height}px`;
      el.style.top = `${top}px`;
    });
  }

  vv.addEventListener('resize', applyViewport);
  vv.addEventListener('scroll', applyViewport);
  // Neu geöffnete Overlays (per createElement + appendChild) direkt beim Einfügen ins DOM
  // erfassen, ohne dass jede einzelne Popup-Funktion das selbst aufrufen müsste.
  const observer = new MutationObserver(applyViewport);
  observer.observe(document.body, { childList: true });
}

// Eigener großer Ziffernblock (analog zum Scroll-Rad eine Alternative zur System-Tastatur,
// siehe numberInputMode()) — freie Zifferneingabe statt Scrollen, mit Vibrationsfeedback bei
// jedem Tastendruck. Layout entspricht einem klassischen Nummernblock: aktueller Eingabewert
// oben mit Bestätigen-Button daneben, darunter 1-9/Komma/0/Löschen im 3×4-Raster.
let keypadActiveInput = null;

function openKeypadForInput(input){
  if (keypadActiveInput === input) return;
  keypadActiveInput = input;
  input.blur();

  const allowDecimal = (input.step && Number(input.step) % 1 !== 0);
  // Feld startet bewusst LEER (nicht mit dem alten Wert vorbelegt), damit man direkt
  // lostippen kann, ohne vorher erst löschen zu müssen. Der ursprüngliche Wert wird nur dann
  // beibehalten, wenn beim Bestätigen nichts eingetippt wurde (siehe finish()).
  const originalValue = input.value;
  let valueStr = '';

  const existing = document.getElementById('keypadOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'add-exercise-overlay';
  overlay.id = 'keypadOverlay';
  overlay.innerHTML = `
    <div class="keypad-sheet">
      <div class="keypad-display-row">
        <span class="keypad-display" id="keypadDisplay">${valueStr || '&nbsp;'}</span>
        <button class="keypad-confirm" id="keypadConfirm" aria-label="Übernehmen">
          <span class="keypad-check"></span>
        </button>
      </div>
      <div class="keypad-grid">
        ${['1','2','3','4','5','6','7','8','9'].map(n => `<button class="keypad-key" data-key="${n}">${n}</button>`).join('')}
        <button class="keypad-key ${allowDecimal ? '' : 'keypad-key-disabled'}" data-key="." ${allowDecimal ? '' : 'disabled'}>,</button>
        <button class="keypad-key" data-key="0">0</button>
        <button class="keypad-key keypad-key-del" data-key="del" aria-label="Löschen"></button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(finish);

  const display = document.getElementById('keypadDisplay');
  function updateDisplay(){ display.innerHTML = valueStr || '&nbsp;'; }

  overlay.querySelectorAll('.keypad-key').forEach(btn => {
    btn.onclick = () => {
      if (btn.disabled) return;
      if (navigator.vibrate) navigator.vibrate(10);
      const key = btn.dataset.key;
      if (key === 'del'){
        valueStr = valueStr.slice(0, -1);
      } else if (key === '.'){
        if (!valueStr.includes('.')) valueStr = (valueStr || '0') + '.';
      } else {
        // Führende Null sauber ersetzen (z. B. "0" + "5" → "5", nicht "05")
        valueStr = (valueStr === '0') ? key : valueStr + key;
      }
      updateDisplay();
    };
  });

  function finish(commit){
    popOverlayStateIfOpen();
    const el = document.getElementById('keypadOverlay');
    if (el) el.remove();
    keypadActiveInput = null;
    if (commit && valueStr !== '' && input.value !== valueStr){
      input.value = valueStr;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
  document.getElementById('keypadConfirm').onclick = () => {
    if (navigator.vibrate) navigator.vibrate(10);
    finish(true);
  };
  overlay.onclick = (ev) => { if (ev.target === overlay) finish(true); };
}

// Einmalig verkabelt: fängt jeden Fokus auf ein Zahlenfeld ab (auch neu ins DOM gerenderte,
// da focusin bubblet) und öffnet je nach gewähltem Modus (numberInputMode()) entweder das
// Scroll-Rad oder den Ziffernblock statt der System-Tastatur. Bei Modus 'system' greift
// keiner von beiden — dann verhält sich das Feld ganz normal.
// Die Körpergewicht-Felder (Einstellungen + Erstlauf-Popup) sind bewusst von Scroll-Rad/
// Ziffernblock ausgenommen — dort öffnet sich immer die normale System-Tastatur des Handys,
// unabhängig vom gewählten numberInputMode(). Anders als die kurzen Trainings-Zahlenwerte
// (kg pro Satz, Wdh, Sekunden) tippt man das eigene Körpergewicht selten und meist mit
// Nachkommastelle — da ist die gewohnte Tastatur schneller als Rad/Block.
function isSystemKeyboardOnlyField(input){
  return !!input && (input.id === 'bodyWeightInput' || input.id === 'bodyWeightPromptInput');
}

function wireAlternativeNumberInputs(){
  document.addEventListener('focusin', (ev) => {
    const input = ev.target;
    if (!input || input.tagName !== 'INPUT' || input.type !== 'number') return;
    if (input.closest('#scrollWheelOverlay') || input.closest('#keypadOverlay')) return;
    if (isSystemKeyboardOnlyField(input)) return;
    const mode = numberInputMode();
    if (mode === 'wheel' || mode === 'combo') openScrollWheelForInput(input);
    else if (mode === 'keypad') openKeypadForInput(input);
  });
  // Verhindert das kurze Aufblitzen der System-Tastatur bei Touch-Geräten: readOnly wird
  // beim Fokussieren gesetzt und direkt danach wieder entfernt, sobald das Wheel/Keypad
  // offen ist — das Feld bleibt dadurch weiterhin normal per JS beschreibbar (input.value=…).
  document.addEventListener('touchstart', (ev) => {
    const input = ev.target;
    if (!input || input.tagName !== 'INPUT' || input.type !== 'number') return;
    if (numberInputMode() === 'system' || isSystemKeyboardOnlyField(input)) return;
    input.setAttribute('readonly', 'readonly');
    setTimeout(() => input.removeAttribute('readonly'), 400);
  }, true);
}

// Generisches Text-Scroll-Rad für Auswahllisten (z. B. Kategorie-Übungspool-Filter) — nutzt
// dieselbe Momentum-Touch-Physik wie das Zahlen-Scroll-Rad (openScrollWheelForInput:
// eigene transform-basierte Positionierung statt nativem Scroll, Reibung/Trägheit nach dem
// Loslassen, Vibrationsfeedback bei jedem Werte-Wechsel, Feder-Einrasten beim Antippen einer
// Zeile), aber mit beliebigen Text-Labels statt eines Zahlenbereichs und ohne die kg-
// spezifische Bremszone. `options` ist ein Array aus { value, label }, `currentValue` bestimmt
// die Startposition, `onDone(value)` wird beim Bestätigen mit dem final gewählten Wert
// aufgerufen (auch wenn nichts geändert wurde).
function openChoiceScrollWheel(title, options, currentValue, onDone){
  const existing = document.getElementById('scrollWheelOverlay');
  if (existing) existing.remove();

  let closestIndex = options.findIndex(o => o.value === currentValue);
  if (closestIndex === -1) closestIndex = 0;

  const overlay = document.createElement('div');
  overlay.className = 'scroll-wheel-overlay';
  overlay.id = 'scrollWheelOverlay';
  overlay.innerHTML = `
    <div class="scroll-wheel-sheet">
      <div class="scroll-wheel-header">
        <span class="scroll-wheel-label">${title}</span>
      </div>
      <div class="scroll-wheel-viewport">
        <div class="scroll-wheel-highlight"></div>
        <div class="scroll-wheel-track" id="scrollWheelTrack">
          ${options.map(o => `<div class="scroll-wheel-item scroll-wheel-item-text">${o.label}</div>`).join('')}
        </div>
      </div>
      <button class="btn btn-primary" id="scrollWheelDone" style="margin:12px 16px 16px;">Fertig</button>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(finish);

  const track = document.getElementById('scrollWheelTrack');
  const items = track.querySelectorAll('.scroll-wheel-item');
  const itemHeight = 44;

  let offsetY = -closestIndex * itemHeight;
  let velocity = 0;
  let lastY = 0;
  let lastT = 0;
  let dragging = false;
  let momentumRAF = null;
  let selectedIndex = closestIndex;
  const minOffset = -(options.length - 1) * itemHeight;
  const maxOffset = 0;

  function applyOffset(){
    track.style.transform = `translateY(${offsetY}px)`;
    const idx = Math.round(-offsetY / itemHeight);
    const clamped = Math.max(0, Math.min(options.length - 1, idx));
    if (clamped !== selectedIndex){
      selectedIndex = clamped;
      if (navigator.vibrate) navigator.vibrate(6);
    }
    items.forEach((el, i) => el.classList.toggle('active', i === selectedIndex));
  }
  applyOffset();

  function settle(){
    const targetIndex = Math.max(0, Math.min(options.length - 1, Math.round(-offsetY / itemHeight)));
    const target = -targetIndex * itemHeight;
    cancelAnimationFrame(momentumRAF);
    const step = () => {
      offsetY += (target - offsetY) * 0.22;
      if (Math.abs(target - offsetY) < 0.5){
        offsetY = target;
        applyOffset();
        return;
      }
      applyOffset();
      momentumRAF = requestAnimationFrame(step);
    };
    step();
  }

  function runMomentum(){
    cancelAnimationFrame(momentumRAF);
    const friction = 0.94;
    const step = () => {
      velocity *= friction;
      offsetY += velocity;
      offsetY = Math.max(minOffset - itemHeight, Math.min(maxOffset + itemHeight, offsetY));
      applyOffset();
      if (Math.abs(velocity) > 0.4){
        momentumRAF = requestAnimationFrame(step);
      } else {
        settle();
      }
    };
    step();
  }

  function onPointerDown(ev){
    dragging = true;
    cancelAnimationFrame(momentumRAF);
    lastY = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    lastT = performance.now();
    velocity = 0;
  }
  function onPointerMove(ev){
    if (!dragging) return;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    const now = performance.now();
    const dy = y - lastY;
    const dt = Math.max(1, now - lastT);
    velocity = dy / dt * 16;
    offsetY += dy;
    if (offsetY > maxOffset) offsetY = maxOffset + (offsetY - maxOffset) * 0.35;
    if (offsetY < minOffset) offsetY = minOffset + (offsetY - minOffset) * 0.35;
    applyOffset();
    lastY = y; lastT = now;
    ev.preventDefault();
  }
  function onPointerUp(){
    if (!dragging) return;
    dragging = false;
    if (Math.abs(velocity) > 1) runMomentum(); else settle();
  }

  track.addEventListener('touchstart', onPointerDown, { passive: true });
  track.addEventListener('touchmove', onPointerMove, { passive: false });
  track.addEventListener('touchend', onPointerUp);
  track.addEventListener('touchcancel', onPointerUp);
  track.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  items.forEach((el, i) => {
    el.addEventListener('click', () => {
      if (dragging) return;
      cancelAnimationFrame(momentumRAF);
      const target = -i * itemHeight;
      const start = offsetY;
      const startT = performance.now();
      const dur = 220;
      const stepAnim = (now) => {
        const t = Math.min(1, (now - startT) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        offsetY = start + (target - start) * eased;
        applyOffset();
        if (t < 1) momentumRAF = requestAnimationFrame(stepAnim);
      };
      momentumRAF = requestAnimationFrame(stepAnim);
    });
  });

  function finish(){
    popOverlayStateIfOpen();
    cancelAnimationFrame(momentumRAF);
    window.removeEventListener('mousemove', onPointerMove);
    window.removeEventListener('mouseup', onPointerUp);
    const el = document.getElementById('scrollWheelOverlay');
    if (el) el.remove();
    onDone(options[selectedIndex].value);
  }
  document.getElementById('scrollWheelDone').onclick = () => {
    if (navigator.vibrate) navigator.vibrate(10);
    finish();
  };
  overlay.onclick = (ev) => { if (ev.target === overlay) finish(); };
}

// Berechnet das tatsächlich bewegte Gewicht für einen Satz unter Berücksichtigung
// von unterstützten Übungen (z. B. Klimmzugmaschine: Körpergewicht - eingestelltes Gewicht)
// und reinen Eigenkörpergewicht-Übungen (z. B. Liegestütze: Körpergewicht + evtl. Zusatzgewicht).
// planEx: das Übungsobjekt aus plan.exercises (kann undefined sein), setWeight: eingetragenes Gewicht am Gerät.
function effectiveSetWeight(planEx, setWeight){
  const w = setWeight ?? 0;
  if (!planEx) return w;
  const bw = plan && plan.bodyWeight;
  if (planEx.assisted && bw){
    return Math.max(0, bw - w);
  }
  if (planEx.bodyweightExercise && bw){
    return bw + w;
  }
  return w;
}

function fmtDuration(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }) +
         ' · ' + d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// Generisches System, damit Popups/Overlays (Übung hinzufügen, Kategorie-Einstellungen,
// Körpergewicht-Prompt, Reset-Bestätigung, History-Kontextmenü, Undo-Toast etc.) auf
// Android/Chrome korrekt auf die Zurück-Taste reagieren: STATT dass Zurück direkt die
// darunterliegende Seite verlässt (z. B. von "Training starten" zur Startseite springt,
// obwohl nur das Popup gemeint war), pusht jedes geöffnete Overlay einen eigenen
// History-Eintrag. Der globale popstate-Handler erkennt daran, dass ein Overlay offen war,
// und schließt nur dieses (per registrierter closeFn) statt die View zu wechseln.
let openOverlayClose = null;
function pushOverlayState(closeFn){
  openOverlayClose = closeFn;
  history.pushState({ view: '__overlay__', params: {} }, '', '');
}
// Von Overlays selbst aufzurufen, wenn sie sich über ihren eigenen Schließen-Button/Klick
// auf den Hintergrund schließen (nicht über die Zurück-Taste) — nimmt den zuvor gepushten
// History-Eintrag wieder zurück, damit sich kein "Geister-Zurück" ansammelt.
function popOverlayStateIfOpen(){
  if (openOverlayClose){
    openOverlayClose = null;
    history.back();
  }
}
window.addEventListener('popstate', (event) => {
  // Falls gerade ein Overlay/Popup offen ist, schließt die Zurück-Taste NUR dieses Overlay
  // und lässt die eigentliche View (z. B. "Training starten" mit den vier Kreisen)
  // unverändert im Hintergrund stehen — sonst würde Zurück fälschlich die ganze Seite
  // verlassen, obwohl nur das Popup gemeint war.
  if (openOverlayClose){
    const fn = openOverlayClose;
    openOverlayClose = null;
    fn();
    return;
  }
  const state = event.state || { view: 'home', params: {} };
  if (active && state.view !== 'active'){
    if (confirm('Training wirklich verlassen? Die Einheit wird nicht in deinem Verlauf gespeichert.')){
      clearInterval(timerHandle);
      clearInterval(restInterval);
      restState = null;
      active = null;
      persistActiveSession();
      replaceView('home');
      renderHome();
    } else {
      pushView('active');
    }
    return;
  }
  switch(state.view){
    case 'plan': renderPlanEditor(); break;
    case 'settings': renderSettings(); break;
    case 'progressList': renderProgressList(); break;
    case 'progressDetail': renderExerciseProgress(state.params.name); break;
    case 'sessionDetail': renderSessionDetail(state.params.id); break;
    case 'sessionSummary': {
      const s = sessions.find(x => x.id === state.params.id);
      if (s) renderSessionSummary(s); else renderHome();
      break;
    }
    case 'startSelect': renderStartSelect(); break;
    case 'freeSelect': renderFreeSelect(); break;
    case 'modeEdit': renderModeEdit(state.params.mode, state.params.startTab); break;
    case 'statsChart': renderStatsChart(state.params.metric); break;
    case 'workoutsOverview': renderWorkoutsOverview(); break;
    case 'exerciseSessionDetail': renderExerciseSessionDetail(state.params.sessionId, state.params.exerciseId); break;
    case 'active': if (active) renderActive(); else renderHome(); break;
    default: renderHome();
  }
});

   HOME
--------------------------------------------------- */
let historyExpanded = false;
let accentPickerOpen = false;
// Merkt sich, welche Abschnitte auf der Einstellungen-Seite gerade aufgeklappt sind
// (Akkordeon pro Abschnitt, siehe renderSettings()). Standardmäßig alles eingeklappt,
// exakt wie beim Muskelgruppen-Akkordeon im Übungen-Tab.
let settingsSectionOpen = new Set();

// Verkabelt Long-Press auf allen `.history-row`-Elementen im aktuell gerenderten DOM: nach
// LONG_PRESS_MS gedrückt halten öffnet ein kleines Kontextmenü mit Teilen/Löschen für die
// entsprechende Session — ohne dass man dafür erst die Detailseite öffnen muss. Ein normaler
// (kurzer) Tap/Klick navigiert weiterhin ganz normal zur Detailseite (unverändert per
// row.onclick an den beiden Aufrufstellen in renderHome()/renderWorkoutsOverview() gesetzt).
function wireHistoryLongPress(){
  const LONG_PRESS_MS = 450;
  const MOVE_CANCEL_PX = 10;
  document.querySelectorAll('.history-row').forEach(row => {
    let pressTimer = null;
    let startX = 0, startY = 0, longPressFired = false;

    const cancel = () => { clearTimeout(pressTimer); pressTimer = null; };

    // Verhindert das native Browser-Kontextmenü (Textmarkierung/„Kopieren"-Popup), das
    // sonst bei einem Long-Press auf Text konkurrierend zum eigenen Menü aufploppt.
    row.addEventListener('contextmenu', (ev) => ev.preventDefault());
    row.addEventListener('selectstart', (ev) => ev.preventDefault());

    // WICHTIG: touchstart absichtlich NICHT passive, sonst kann preventDefault() hier nicht
    // greifen — genau das war die Ursache dafür, dass Android trotz CSS user-select:none
    // bei einem Long-Press weiterhin eine eigene Wortauswahl-Geste gestartet hat (teils an
    // einer völlig anderen Bildschirmstelle als der tatsächlichen Berührung). preventDefault()
    // wird gezielt erst gerufen, sobald klar ist, dass es sich nicht um ein Scroll-Touch
    // handelt (verzögert per rAF, um normales vertikales Scrollen nicht zu blockieren).
    row.addEventListener('touchstart', (ev) => {
      longPressFired = false;
      const t = ev.touches[0];
      startX = t.clientX; startY = t.clientY;
      // Frühes preventDefault (deutlich vor Erreichen der eigentlichen Long-Press-Schwelle),
      // damit Android gar nicht erst die Chance bekommt, seine eigene Wortauswahl-Geste zu
      // starten — die setzt bei manchen Geräten/Versionen bereits ab ~300ms ein, unabhängig
      // vom hier verwendeten LONG_PRESS_MS-Timer.
      const suppressSelectionTimer = setTimeout(() => { try{ ev.preventDefault(); }catch(err){} }, 200);
      pressTimer = setTimeout(() => {
        longPressFired = true;
        ev.preventDefault();
        if (navigator.vibrate) navigator.vibrate(15);
        openHistoryContextMenu(row.dataset.id);
      }, LONG_PRESS_MS);
      const clearSuppress = () => clearTimeout(suppressSelectionTimer);
      row.addEventListener('touchend', clearSuppress, { once: true });
      row.addEventListener('touchcancel', clearSuppress, { once: true });
    }, { passive: false });
    row.addEventListener('touchmove', (ev) => {
      const t = ev.touches[0];
      if (Math.abs(t.clientX - startX) > MOVE_CANCEL_PX || Math.abs(t.clientY - startY) > MOVE_CANCEL_PX) cancel();
    }, { passive: true });
    row.addEventListener('touchend', cancel);
    row.addEventListener('touchcancel', cancel);

    // Desktop-Fallback (Maus gedrückt halten)
    row.addEventListener('mousedown', (ev) => {
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        openHistoryContextMenu(row.dataset.id);
      }, LONG_PRESS_MS);
    });
    row.addEventListener('mouseup', cancel);
    row.addEventListener('mouseleave', cancel);

    // Klick unterdrücken, wenn er aus einem gerade ausgelösten Long-Press resultiert
    row.addEventListener('click', (ev) => {
      if (longPressFired){ ev.preventDefault(); ev.stopPropagation(); longPressFired = false; }
    }, true);
  });
}

function openHistoryContextMenu(sessionId){
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  const existing = document.getElementById('historyContextOverlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'history-context-overlay';
  overlay.id = 'historyContextOverlay';
  overlay.innerHTML = `
    <div class="history-context-menu">
      <button class="history-context-icon-btn share" id="historyContextShare" aria-label="Teilen">
        <img src="${ICON_SHARE}" alt="" draggable="false">
      </button>
      <button class="history-context-icon-btn delete" id="historyContextDelete" aria-label="Löschen"></button>
    </div>
  `;
  document.body.appendChild(overlay);
  pushOverlayState(remove);

  function remove(){ const el = document.getElementById('historyContextOverlay'); if (el) el.remove(); }
  const close = () => { popOverlayStateIfOpen(); remove(); };
  overlay.onclick = (ev) => { if (ev.target === overlay) close(); };
  document.getElementById('historyContextShare').onclick = () => {
    close();
    shareSession(s, {});
  };
  document.getElementById('historyContextDelete').onclick = () => {
    close();
    if (!confirm('Diese Einheit wirklich löschen?')) return;
    const removedIndex = sessions.findIndex(x => x.id === sessionId);
    const removedSession = sessions[removedIndex];
    sessions = sessions.filter(x => x.id !== sessionId);
    saveJSON('sessions', sessions).then(() => {
      // Aktuelle Ansicht (Startseite oder Workouts-Übersicht) neu rendern, ohne die
      // Navigation zu verändern — history.back() wäre hier falsch, da man ja gerade
      // aus der Liste heraus gelöscht hat und nicht aus der Detailseite kommt.
      if (history.state && history.state.view === 'workoutsOverview') renderWorkoutsOverview();
      else renderHome();
      showUndoToast('Einheit gelöscht.', async () => {
        sessions.splice(removedIndex, 0, removedSession);
        await saveJSON('sessions', sessions);
        if (history.state && history.state.view === 'workoutsOverview') renderWorkoutsOverview();
        else renderHome();
      });
    });
  };
}

/* ---------------------------------------------------
   STATS (Gesamtwerte)
--------------------------------------------------- */
function totalTrainingSeconds(){
  return sessions.reduce((a,s)=> a + s.durationSec, 0);
}
function totalVolumeKg(){
  return sessions.reduce((a,s)=>
    a + s.entries.reduce((a2,e)=>{
      const planEx = plan.exercises.find(x => x.id === e.exerciseId);
      return a2 + e.sets.reduce((a3,st)=> a3 + ((st.reps && st.weight) ? st.reps*effectiveSetWeight(planEx, st.weight) : 0), 0);
    }, 0)
  , 0);
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}
// Formatiert die Satzliste einer Übung als kompakten Text (für PDF-Export und Teilen).
// Bei Übungen ohne relevantes Gewicht — noWeight (z. B. Situps, Beinheben) oder
// bodyweightExercise ohne zusätzliches Zusatzgewicht in JEDEM Satz — wird nur die Wdh-Zahl
// gezeigt (z. B. "12 Wdh"), nicht "12×0kg". Ist bei einer bodyweightExercise in einem Satz
// tatsächlich ein Zusatzgewicht eingetragen (z. B. Gewichtsweste), wird das weiterhin mit
// angezeigt — nur der Fall "kein Gewicht eingetragen" wird ohne "×0kg" dargestellt.
function formatSetsLine(entry, planEx){
  if (entry.type === 'time'){
    return entry.sets.map(s => fmtSec(s.seconds)).join(' · ');
  }
  const isBodyweightType = !!(planEx && (planEx.noWeight || planEx.bodyweightExercise));
  return entry.sets.map(s => {
    if (isBodyweightType && !s.weight){
      return `${s.reps} Wdh`;
    }
    return `${s.reps}×${s.weight ?? 0}kg`;
  }).join(' · ');
}

function fmtSec(sec){
  if (sec === null || sec === undefined) return '—';
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
function sessionVolumeKg(s){
  return s.entries.reduce((a,e) => {
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    return a + e.sets.reduce((a2,st) => a2 + ((st.reps && st.weight) ? st.reps*effectiveSetWeight(planEx, st.weight) : 0), 0);
  }, 0);
}
function weekBucket(d){
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return { key: `${d.getFullYear()}-W${week}`, label: `KW ${week}`, sortKey: d.getFullYear()*100 + week };
}
function aggregateSessions(getValue, period){
  const sorted = sessions.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  if (period === 'total'){
    let running = 0;
    return sorted.map(s => { running += getValue(s); return { label: shortDate(s.date), value: running }; });
  }
  const buckets = new Map();
  sorted.forEach(s => {
    const d = new Date(s.date);
    let key, label, sortKey;
    if (period === 'week'){
      const wb = weekBucket(d);
      key = wb.key; label = wb.label; sortKey = wb.sortKey;
    } else if (period === 'month'){
      key = `${d.getFullYear()}-${d.getMonth()}`;
      label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
      sortKey = d.getFullYear()*100 + d.getMonth();
    } else {
      key = `${d.getFullYear()}`;
      label = `${d.getFullYear()}`;
      sortKey = d.getFullYear();
    }
    if (!buckets.has(key)) buckets.set(key, { label, value: 0, sortKey });
    buckets.get(key).value += getValue(s);
  });
  return [...buckets.values()].sort((a,b) => a.sortKey - b.sortKey);
}

let statsPeriod = 'total';
const PERIOD_LABELS = { total: 'Insgesamt', week: 'Woche', month: 'Monat', year: 'Jahr' };

// Bucketet eine Liste von {date, value}-Punkten nach Periode (analog aggregateSessions(),
// aber für beliebige Datenpunkte statt konkret für Sessions). Bei 'total' bleibt jeder Punkt
// einzeln erhalten (roh, eine Einheit = ein Punkt). Bei week/month/year wird pro Bucket der
// Maximalwert genommen — für Fortschrittsdiagramme aussagekräftiger als eine Summe (z. B.
// "bestes Gewicht in dieser Woche" statt einer wenig sinnvollen Gewichtssumme).
function aggregateHistoryPoints(points, period){
  if (period === 'total') return points;
  const buckets = new Map();
  points.forEach(p => {
    const d = new Date(p.date);
    let key, label, sortKey;
    if (period === 'week'){
      const wb = weekBucket(d);
      key = wb.key; label = wb.label; sortKey = wb.sortKey;
    } else if (period === 'month'){
      key = `${d.getFullYear()}-${d.getMonth()}`;
      label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
      sortKey = d.getFullYear()*100 + d.getMonth();
    } else {
      key = `${d.getFullYear()}`;
      label = `${d.getFullYear()}`;
      sortKey = d.getFullYear();
    }
    if (!buckets.has(key)) buckets.set(key, { label, value: p.value, sortKey });
    else if (p.value > buckets.get(key).value) buckets.get(key).value = p.value;
  });
  return [...buckets.values()].sort((a,b) => a.sortKey - b.sortKey);
}

function renderStatsChart(metric){

    <div class="progress-summary" style="margin-top:18px;">

      ${Object.keys(PERIOD_LABELS).map(p => `
        <button class="period-btn ${statsPeriod === p ? 'active' : ''}" data-period="${p}">${PERIOD_LABELS[p]}</button>
      `).join('')}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">${title} — ${PERIOD_LABELS[statsPeriod]}</div>
      ${buildLineChart(chartPoints, color, formatter)}
    </div>
    ${widgetHTML}
  `;

  document.getElementById('btnBack').onclick = () => history.back();
  if (document.getElementById('btnWorkouts')){
    document.getElementById('btnWorkouts').onclick = () => goWorkoutsOverview();
  }
  app.querySelectorAll('.period-btn').forEach(btn => {
    btn.onclick = () => {
      statsPeriod = btn.dataset.period;
      renderStatsChart(metric);
