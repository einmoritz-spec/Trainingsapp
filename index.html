    });

    app.querySelectorAll('[data-checkset]').forEach(btn => {
      btn.onclick = () => {
        const si = Number(btn.dataset.checkset);
        const wasDone = entry.sets[si].done;
        entry.sets[si].done = !wasDone;
        if (!wasDone){
          // Satz wurde gerade abgehakt: komplett leere Folge-Sätze automatisch
          // mit denselben Werten (kg + Wdh bzw. Sekunden) vorausfüllen, damit man
          // bei gleichbleibendem Gewicht/Wdh nicht jeden Satz neu eintippen muss.
          const doneSet = entry.sets[si];
          for (let j = si + 1; j < entry.sets.length; j++){
            const nextSet = entry.sets[j];
            const isUntouched = entry.type === 'time'
              ? (nextSet.seconds === null || nextSet.seconds === undefined)
              : (nextSet.reps === null || nextSet.reps === undefined) && (nextSet.weight === null || nextSet.weight === undefined);
            if (!isUntouched) break; // ab dem ersten bereits befüllten Satz nicht weiter überschreiben
            if (entry.type === 'time'){
              nextSet.seconds = doneSet.seconds;
            } else {
              nextSet.reps = doneSet.reps;
              nextSet.weight = doneSet.weight;
            }
          }
        }
        if (isEntryDone(entry)) advanceToNextExercise();
        renderActive();
      };
    });

    app.querySelectorAll('[data-removeset]').forEach(btn => {
      btn.onclick = () => {
        const si = Number(btn.dataset.removeset);

      };
    });

    document.getElementById('btnAddSet').onclick = () => {
      if (entry.type === 'time'){
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({ seconds: (last && last.seconds) || null, done: false });
      } else {
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({
          reps: (last && last.reps) || null,
          weight: (last && last.weight) || entry.target.weight || null,
          done: false
        });
      }
      renderActive();
    };

    document.getElementById('btnCheckAllExercise').onclick = () => {
      entry.sets.forEach(s => s.done = true);
      advanceToNextExercise();
      renderActive();
    };

    document.getElementById('btnRemoveExercise').onclick = () => {
      if (confirm(`"${entry.name}" aus dieser Einheit entfernen?`)){
        active.entries.splice(ei, 1);
        if (active.currentIndex >= active.entries.length) active.currentIndex = Math.max(0, active.entries.length - 1);

      }
    };
  }

  app.querySelectorAll('[data-addex]').forEach(row => {

      if (ex){

  });
  document.getElementById('plateEl').onclick = () => {
    if (restState){
      clearInterval(restInterval);
      restInterval = null;
      endRest(false);
    }
  };
}

/* ---------------------------------------------------
   REST TIMER (Pausenzeiten mit Balken-Fortschritt)
--------------------------------------------------- */
let restState = null;   // { endTime, duration }
let restInterval = null;

function startRest(seconds){
  clearInterval(restInterval);
  restState = { endTime: Date.now() + seconds*1000, duration: seconds };
  const rest = document.getElementById('plateRest');
  const bar = document.getElementById('restBar');
  const box = document.getElementById('plateEl');
  if (rest) rest.classList.add('visible');
  if (bar) bar.classList.add('visible');
  if (box) box.classList.add('resting');
  highlightRestButtons();
  restInterval = setInterval(tickRest, 100);
  tickRest();
}

function tickRest(){
  if (!restState) return;
  const remainingMs = Math.max(0, restState.endTime - Date.now());
  const remaining = Math.ceil(remainingMs/1000);
  const restEl = document.getElementById('plateRest');
  if (restEl) restEl.textContent = 'Pause ' + fmtDuration(remaining);
  const bar = document.getElementById('restBar');
  if (bar){
    const frac = Math.max(0, Math.min(1, remainingMs / (restState.duration*1000)));
    bar.style.width = (frac*100).toFixed(1) + '%';
  }
  if (remainingMs <= 0){
    clearInterval(restInterval);
    restInterval = null;
    endRest(true);
  }
}

function endRest(playSound){
  restState = null;
  const bar = document.getElementById('restBar');
  if (bar){ bar.classList.remove('visible'); bar.style.width = '0%'; }
  const box = document.getElementById('plateEl');
  if (box) box.classList.remove('resting');
  const rest = document.getElementById('plateRest');
  if (rest){ rest.classList.remove('visible'); rest.textContent = ''; }
  highlightRestButtons();
  if (playSound) playBeep();
}

function highlightRestButtons(){
  document.querySelectorAll('.rest-btn').forEach(btn => {
    btn.classList.toggle('is-active', !!restState && Number(btn.dataset.rest) === restState.duration);
  });
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.55);
  }catch(e){ /* Audio nicht verfügbar, kein Problem */ }
}

async function endSession(){
  clearInterval(timerHandle);
  clearInterval(restInterval);
  restState = null;
  const durationSec = Math.floor((Date.now() - active.startedAt)/1000);
  const session = {
    id: uid(),
    date: new Date(active.startedAt).toISOString(),
    durationSec,
    entries: active.entries
      .map(e => ({
        exerciseId: e.exerciseId,
        name: e.name,
        type: e.type,
        target: e.target,
        // Leere Sätze (kein Feld außer "done" ausgefüllt) gelten als gelöscht.
        sets: e.sets.filter(s => Object.entries(s).some(([k,v]) => k !== 'done' && v !== null && v !== undefined))
      }))
      // Übungen ganz ohne verbliebene Sätze gelten als nicht durchgeführt
      // und werden komplett verworfen (erscheinen nicht in Zusammenfassung/PDF).
      .filter(e => e.sets.length > 0)
  };
  sessions.push(session);
  session.entries.forEach(e => {
    if (e.exerciseId && e.sets.length){
      const history = Array.isArray(lastPerformance[e.exerciseId]) && Array.isArray(lastPerformance[e.exerciseId][0])
        ? lastPerformance[e.exerciseId]
        : (lastPerformance[e.exerciseId] ? [lastPerformance[e.exerciseId]] : []); // alte Struktur (nur 1 Session) migrieren
      lastPerformance[e.exerciseId] = [e.sets.map(s => ({ ...s })), ...history].slice(0, 2);
    }
  });
  await saveJSON('sessions', sessions);
  await saveJSON('lastPerformance', lastPerformance);
  active = null;
  await saveJSON('activeSession', null);
  // "home" ersetzt den bisherigen History-Eintrag (das aktive Training soll beim Zurück-
  // Navigieren nicht wieder auftauchen), die Zusammenfassung bekommt danach aber ihren
  // EIGENEN History-Eintrag (pushView statt replaceView) — sonst hätte "Zurück" von einer
  // Übungs-Detailansicht aus (siehe goExerciseSessionDetail) direkt zur Startseite gesprungen
  // statt nur die Detailansicht zu schließen und zur Zusammenfassung zurückzukehren.
  replaceView('home');
  goSessionSummary(session);
}

/* ---------------------------------------------------
   ABSCHLUSS-SCREEN NACH TRAINING
--------------------------------------------------- */
function computeWeekStreak(){
  if (!sessions.length) return 0;
  const weekKeys = new Set(sessions.map(s => weekBucket(new Date(s.date)).key));
  let streak = 0;
  let d = new Date();
  while (true){
    const key = weekBucket(d).key;
    if (weekKeys.has(key)){
      streak++;
      d.setDate(d.getDate() - 7);
    } else break;
  }
  return streak;
}

function computeSessionTrends(session){
  const priorSessions = sessions
    .filter(s => s.id !== session.id && new Date(s.date) < new Date(session.date))
    .sort((a,b) => new Date(b.date) - new Date(a.date)); // neueste zuerst

  return session.entries.map(e => {
    const isTime = e.type === 'time';
    let prevEntry = null;
    for (const s of priorSessions){
      const match = s.entries.find(x => x.exerciseId === e.exerciseId);
      if (match && match.sets && match.sets.length){ prevEntry = match; break; }
    }
    let currVol = null, prevVol = null;
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const lowerIsBetter = !!(planEx && planEx.assisted);
    if (isTime){
      const currVals = e.sets.map(s => s.seconds).filter(v => v !== null && v !== undefined);
      currVol = currVals.length ? currVals.reduce((a,v) => a + v, 0) : null;
      if (prevEntry){
        const prevVals = prevEntry.sets.map(s => s.seconds).filter(v => v !== null && v !== undefined);
        prevVol = prevVals.length ? prevVals.reduce((a,v) => a + v, 0) : null;
      }
    } else {
      const currValid = e.sets.filter(s => s.reps !== null && s.reps !== undefined && s.weight !== null && s.weight !== undefined);
      currVol = currValid.length ? currValid.reduce((a,s) => a + s.reps*effectiveSetWeight(planEx, s.weight), 0) : null;
      if (prevEntry){
        const prevValid = prevEntry.sets.filter(s => s.reps !== null && s.reps !== undefined && s.weight !== null && s.weight !== undefined);
        prevVol = prevValid.length ? prevValid.reduce((a,s) => a + s.reps*effectiveSetWeight(planEx, s.weight), 0) : null;
      }
    }
    let trend = 'new';
    if (prevVol !== null && currVol !== null){
      // Hinweis: currVol/prevVol basieren bei Nicht-Zeit-Übungen auf effectiveSetWeight(),
      // das assisted-Übungen bereits so normalisiert, dass höher immer besser ist — daher
      // hier KEINE zusätzliche Umkehrung über lowerIsBetter mehr (sonst doppelt verkehrt).
      if (currVol > prevVol) trend = 'up';
      else if (currVol < prevVol) trend = 'down';
      else trend = 'same';
    }
    return { exerciseId: e.exerciseId, name: e.name, isTime, currVol, prevVol, trend, sets: e.sets, lowerIsBetter };
  });
}

// Ermittelt pro nicht-Zeit-basierter Übung dieser Session, wie viele Kennzahlen einen
// neuen Allzeitrekord (records) bzw. eine Steigerung zum letzten Mal (improved) darstellen
// (siehe computeExerciseMetricComparison). Eine Übung gilt als Highlight, sobald records > 0
// oder improved > 0 ist — unabhängig davon, ob sie zum ersten Mal protokolliert wurde.
function computeExerciseHighlights(session){
  const highlights = [];
  let starCount = 0;
  let improvedCount = 0;
  session.entries.forEach(e => {
    if (e.type === 'time') return;
    const result = computeExerciseMetricComparison(session, e.exerciseId);
    if (result && result.current.hasData){
      const records = countAllTimeRecords(result.comparison);
      // Eine Kennzahl zählt nur dann als "verbessert" (grün), wenn sie NICHT bereits
      // ein Allzeitrekord ist (gelb) — ein Allzeitrekord ist per Definition immer auch
      // eine Verbesserung, soll aber nicht doppelt gezählt/angezeigt werden.
      const improved = Object.values(result.comparison).filter(m => m.lastPct !== null && m.allTimePct === null && !m.isNewAllTime).length;
      // isNew: Übung wurde noch nie zuvor protokolliert (keine der Kennzahlen hat einen
      // "echten" Allzeitrekord-Prozentwert, aber es gibt trotzdem Rekorde durch isNewAllTime).
      const isNew = !result.hasHistory && records > 0;
      starCount += records;
      improvedCount += improved;
      if (records > 0 || improved > 0){
        highlights.push({ exerciseId: e.exerciseId, name: e.name, sets: e.sets, records, improved, isNew });
      }
    }
  });
  return { highlights, starCount, improvedCount };
}

  const sessionNumber = sessions.length;

  const { highlights: exerciseHighlights, starCount, improvedCount } = computeExerciseHighlights(session);

    <div class="section-label">Erfolge</div>
    <div class="summary-list">
      ${rowsHTML || '<div class="history-empty">Keine neuen Bestleistungen diesmal — dranbleiben, beim nächsten Mal klappt’s! 💪</div>'}
    </div>
    <div class="summary-actions no-print">
      <button class="btn btn-ghost" id="btnSummaryShare">Teilen</button>
      <button class="btn btn-ghost" id="btnSummaryPdf">Als PDF</button>
    </div>
    <button class="btn btn-primary no-print" id="btnSummaryDone" style="margin-top:10px;">Fertig</button>
  `;

  app.querySelectorAll('.summary-row[data-exerciseid]').forEach(row => {
    row.onclick = () => goExerciseSessionDetail(session.id, row.dataset.exerciseid);
  });

  document.getElementById('btnSummaryDone').onclick = () => {
    // replaceView statt goHome(): der Zusammenfassungs-History-Eintrag wird durch "home"
    // ersetzt, nicht zusätzlich einer draufgelegt — sonst würde ein nachfolgendes
    // Zurück-Drücken wieder zur bereits abgeschlossenen Zusammenfassung zurückführen.
    replaceView('home');
    renderHome();
  };
  document.getElementById('btnSummaryPdf').onclick = () => {
    const dateStub = (session.date || '').slice(0,10);
    let blob = null;
    try{ blob = buildFullSummaryPdfBlob(session, { sessionNumber, streak, highlights: exerciseHighlights }); }catch(err){ blob = null; }
    if (blob){
      downloadBlob(blob, `trainingsplan-zusammenfassung-${dateStub}.pdf`);
    } else {
      window.print();
    }
  };
  document.getElementById('btnSummaryShare').onclick = () => shareSession(session, { sessionNumber, streak });
}

function pdfSafeText(str){
  // jsPDFs Standardschriften (Helvetica etc.) können nur WinAnsi/Latin-1 darstellen —
  // Emojis und Pfeile/Sonderzeichen außerhalb davon führen sonst zu Zeichensalat im PDF.
  return String(str)
    .replace(/💪/g, '')
    .replace(/🔥/g, '')
    .replace(/▲/g, '(verbessert)')
    .replace(/✨/g, '(Neu)')
    .replace(/→/g, '->')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function buildFullSummaryPdfBlob(session, opts){
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  opts = opts || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marginX = 16;
  const pageWidth = 210 - marginX * 2;
  const pageBottom = 282;
  let y = 20;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
  doc.text(pdfSafeText('Trainingsplan — Zusammenfassung'), marginX, y);
  y += 9;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(60);
  let metaLine = `${fmtDate(session.date)}  ·  Dauer ${fmtDuration(session.durationSec)}`;
  if (opts.sessionNumber) metaLine += `  ·  Einheit Nr. ${opts.sessionNumber}`;
  if (opts.streak) metaLine += `  ·  ${opts.streak} ${opts.streak === 1 ? 'Woche' : 'Wochen'} am Stück`;
  doc.text(pdfSafeText(metaLine), marginX, y);
  y += 10;
  doc.setDrawColor(210);
  doc.line(marginX, y, 210 - marginX, y);
  y += 8;

  // Erfolge pro Übung nachschlagen (records/isNewAllTime > lastPct — sich gegenseitig
  // ausschließend, wie in der Zusammenfassung auf dem Bildschirm), damit jede Übung ihre
  // kompakte Markierung bekommt (Neu / Nx Rekord / Nx verbessert), ohne dass für Übungen
  // ohne jegliche Kennzahlen (z. B. Zeit-Übungen) etwas falsch angezeigt wird.
  const highlightMap = {};
  if (opts.highlights){
    opts.highlights.forEach(h => { highlightMap[h.exerciseId] = h; });
  }

  session.entries.forEach(e => {
    const imgSize = 20;
    const textX = marginX + imgSize + 4;
    const maxTextWidth = 210 - textX - marginX;

    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const setsText = formatSetsLine(e, planEx);

    const h = highlightMap[e.exerciseId];
    let badgeText = '';
    if (h && h.isNew) badgeText = 'Neu';
    else if (h && h.records > 0) badgeText = h.records > 1 ? `${h.records}x Rekord` : 'Rekord';
    else if (h && h.improved > 0) badgeText = h.improved > 1 ? `${h.improved}x verbessert` : 'verbessert';

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    const nameLines = doc.splitTextToSize(pdfSafeText(e.name), maxTextWidth);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const bodyLines = doc.splitTextToSize(pdfSafeText(setsText || '—'), maxTextWidth);
    const textBlockH = nameLines.length * 5 + bodyLines.length * 4.2 + (badgeText ? 4.5 : 0) + 4;
    const blockH = Math.max(textBlockH, imgSize + 6);

    if (y + blockH > pageBottom){
      doc.addPage();
      y = 20;
    }

    if (planEx && planEx.imageData){
      try{ doc.addImage(planEx.imageData, 'JPEG', marginX, y, imgSize, imgSize); }catch(err){ /* Bild überspringen, falls ungültig */ }
    }

    let ty = y + 4;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(20);
    doc.text(nameLines, textX, ty);
    ty += nameLines.length * 5;
    if (badgeText){
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
      const isGold = badgeText === 'Neu' || badgeText.includes('Rekord');
      if (isGold) doc.setTextColor(180, 140, 30); else doc.setTextColor(90, 170, 90);
      doc.text(pdfSafeText(badgeText), textX, ty);
      ty += 4.5;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(bodyLines, textX, ty);
    ty += bodyLines.length * 4.2;

    y += Math.max(blockH, ty - y + 3);
    doc.setDrawColor(230);
    doc.line(marginX, y - 3, 210 - marginX, y - 3);
  });

  return doc.output('blob');
}

// Zeigt einen kurzen Toast mit Rückgängig-Option (z. B. nach dem Löschen einer Einheit).
// Die eigentliche Aktion ist zu diesem Zeitpunkt bereits ausgeführt — onUndo macht sie
// rückgängig, wird der Toast ignoriert (Zeitablauf oder manuelles Wegtippen andernorts),
// bleibt die Aktion endgültig. Es kann immer nur ein Toast gleichzeitig sichtbar sein; ein
// neuer Aufruf ersetzt einen evtl. noch sichtbaren alten Toast sofort (inkl. dessen Timer).
let undoToastTimeout = null;
function showUndoToast(message, onUndo){
  const existing = document.getElementById('undoToast');
  if (existing) existing.remove();
  if (undoToastTimeout) clearTimeout(undoToastTimeout);

  const toast = document.createElement('div');
  toast.className = 'undo-toast';
  toast.id = 'undoToast';
  toast.innerHTML = `
    <span class="undo-toast-text">${message}</span>
    <button class="undo-toast-btn" id="undoToastBtn">Rückgängig</button>
  `;
  document.body.appendChild(toast);

  const remove = () => { const el = document.getElementById('undoToast'); if (el) el.remove(); };
  document.getElementById('undoToastBtn').onclick = () => {
    clearTimeout(undoToastTimeout);
    remove();
    onUndo();
  };
  undoToastTimeout = setTimeout(remove, 5000);
}

function downloadBlob(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function shareSession(session, opts){
  opts = opts || {};
  const { highlights } = computeExerciseHighlights(session);
  const dateStub = (session.date || '').slice(0,10);

  // Immer die vollständige Zusammenfassung (alle Übungen in Reihenfolge, mit kompakten
  // Erfolgs-Markierungen) — sowohl fürs native Teilen als auch als Download-Fallback,
  // entspricht genau dem, was auch auf dem Bildschirm zu sehen ist.
  let fullBlob = null;
  try{ fullBlob = buildFullSummaryPdfBlob(session, { ...opts, highlights }); }catch(err){ fullBlob = null; }
  if (fullBlob){
    try{
      const file = new File([fullBlob], `trainingsplan-zusammenfassung-${dateStub}.pdf`, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: 'Trainingseinheit' });
        return;
      }
    }catch(err){
      return; // Nutzer hat den Teilen-Dialog abgebrochen — kein Fehler
    }
    downloadBlob(fullBlob, `trainingsplan-zusammenfassung-${dateStub}.pdf`);
    return;
  }

  // Letzter Fallback ohne PDF (z. B. jsPDF nicht geladen): Text teilen
  const lines = [];
  lines.push(`💪 Trainingseinheit`);
  lines.push(`${fmtDate(session.date)} · Dauer ${fmtDuration(session.durationSec)}`);
  lines.push('');
  session.entries.forEach(e => {
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    const setsText = formatSetsLine(e, planEx);
    lines.push(`${e.name}: ${setsText || '—'}`);
  });
  const text = lines.join('\n');

  if (navigator.share){
    try{ await navigator.share({ title: 'Trainingseinheit', text }); }
    catch(err){ /* Nutzer hat abgebrochen — kein Fehler */ }
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('Teilen wird auf diesem Gerät nicht direkt unterstützt — die Zusammenfassung wurde stattdessen in die Zwischenablage kopiert.');
  }catch(err){
    alert('Teilen wird auf diesem Gerät leider nicht unterstützt.');
  }
}

/* ---------------------------------------------------
   SESSION DETAIL / PDF
--------------------------------------------------- */
// Exportiert eine einzelne Trainingseinheit als eigenständige JSON-Datei — inklusive der
// zugehörigen Übungsdefinitionen aus dem Plan (Name, Bild, Zielwerte etc.), damit die Datei
// auch auf einem anderen Gerät/Plan importiert werden kann, wo diese Übungen evtl. noch
// nicht existieren (siehe importSingleSessionFile()).
function exportSingleSession(session){
  const exerciseIds = new Set(session.entries.map(e => e.exerciseId));
  const exercises = plan.exercises.filter(x => exerciseIds.has(x.id));
  const payload = { type: 'trainingsplan-session', version: 1, exportedAt: new Date().toISOString(), session, exercises };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const dateStub = (session.date || '').slice(0,10);
  downloadBlob(blob, `trainingsplan-training-${dateStub}.json`);
}

function renderSessionDetail(id){
  const s = sessions.find(x => x.id === id);
  if (!s) return goHome(false);
  viewingSessionId = id;

  const totalSets = s.entries.reduce((a,e)=>a+e.sets.length,0);
  const rows = s.entries.map(e => e.sets.map((set, i) => `
    <tr${i === 0 ? ' class="exercise-start"' : ''}>
      <td>${i===0 ? e.name : ''}</td>
      <td>${i+1}</td>
      <td>${e.type === 'time' ? fmtSec(set.seconds) : (set.reps ?? '—')}</td>
      <td>${e.type === 'time' ? '—' : (set.weight ?? '—') + (set.weight ? ' kg' : '')}</td>
    </tr>
  `).join('')).join('');

  // Highlights wie in der Zusammenfassung nach dem Training berechnen
  const { highlights: exerciseHighlights, starCount: sessionStarCount, improvedCount: sessionImprovedCount } = computeExerciseHighlights(s);
  const highlightsHTML = exerciseHighlights.map(h => {
    const planEx = plan.exercises.find(x => x.id === h.exerciseId);
    const img = planEx && planEx.imageData;
    const setsLine = h.sets.map(s2 => `${s2.reps}×${s2.weight ?? 0}kg`).join(' · ');
    return `
      <div class="summary-row" data-exerciseid="${h.exerciseId}" role="button" tabindex="0">
        <div class="summary-row-media">
          ${img ? `<img class="summary-thumb" src="${img}" alt="">` : `<span class="summary-thumb-fallback">${initials(h.name)}</span>`}
        </div>
        <div class="summary-row-mid">
          <div class="summary-row-name">${h.name}</div>
          <div class="summary-row-meta">${h.sets.length} Sätze
            ${h.records > 0 ? `<span class="summary-row-stat"><img class="summary-row-stat-icon" src="${ICON_RECORD}" alt="">${h.records}</span>` : ''}
            ${h.improved > 0 ? `<span class="summary-row-stat"><img class="summary-row-stat-icon" src="${ICON_IMPROVEMENT}" alt="">${h.improved}</span>` : ''}
          </div>
          <div class="summary-row-sets">${setsLine || '—'}</div>
        </div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="back-row no-print">
      <button class="gear" id="btnBack">‹ Zurück</button>
    </div>
    <div class="detail-header">
      <h2>Trainingseinheit</h2>
      <div class="detail-stats">
        <span>${fmtDate(s.date)}</span>
        <span>${fmtDuration(s.durationSec)}</span>
        <span>${s.entries.length} Übungen · ${totalSets} Sätze</span>
      </div>
    </div>
    <div class="section-label">Erfolge</div>
    <div class="summary-list">
      ${highlightsHTML || '<div class="history-empty">Keine neuen Bestleistungen in dieser Einheit 💪</div>'}
    </div>
    <button class="detail-full-toggle no-print" id="btnToggleFull" aria-expanded="false">
      Gesamtes Training anzeigen <span class="detail-full-toggle-chevron" id="fullToggleChevron">▾</span>
    </button>
    <div class="detail-full-table-wrap" id="fullTableWrap">
      <table class="detail-table">
        <thead><tr><th>Übung</th><th>Satz</th><th>Wdh / Zeit</th><th>Gewicht</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="detail-actions no-print">
      <button class="btn btn-ghost" id="btnDelete">Löschen</button>
      <button class="btn btn-ghost" id="btnShare">Teilen</button>
      <button class="btn btn-primary" id="btnPdf">Speichern</button>
    </div>
    <div class="detail-actions no-print" style="margin-top:10px;">
      <button class="btn btn-ghost" id="btnExportSession">Training exportieren</button>
    </div>
    <button class="btn btn-primary no-print" id="btnRepeat" style="margin-top:10px;">🔁 Nochmal trainieren</button>
  `;

  app.querySelectorAll('.summary-row[data-exerciseid]').forEach(row => {
    row.onclick = () => goExerciseSessionDetail(s.id, row.dataset.exerciseid);
  });

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnRepeat').onclick = () => repeatSession(s);
  document.getElementById('btnToggleFull').onclick = () => {
    const wrap = document.getElementById('fullTableWrap');
    const chevron = document.getElementById('fullToggleChevron');
    const btn = document.getElementById('btnToggleFull');
    const isOpen = wrap.classList.toggle('open');
    chevron.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', String(isOpen));
  };
  document.getElementById('btnPdf').onclick = () => {
    const dateStub = (s.date || '').slice(0,10);
    const sessionNumber = sessions.findIndex(x => x.id === s.id) + 1;
    const streak = computeWeekStreak();
    let blob = null;
    try{ blob = buildFullSummaryPdfBlob(s, { sessionNumber, streak, highlights: exerciseHighlights }); }catch(err){ blob = null; }
    if (blob){
      downloadBlob(blob, `trainingsplan-zusammenfassung-${dateStub}.pdf`);
    } else {
      window.print();
    }
  };
  document.getElementById('btnShare').onclick = () => shareSession(s, {});
  document.getElementById('btnExportSession').onclick = () => {
    exportSingleSession(s);
  };
  document.getElementById('btnDelete').onclick = async () => {
    if (!confirm('Diese Einheit wirklich löschen?')) return;
    const removedIndex = sessions.findIndex(x => x.id === id);
    const removedSession = sessions[removedIndex];
    sessions = sessions.filter(x => x.id !== id);
    await saveJSON('sessions', sessions);
    history.back();
    showUndoToast('Einheit gelöscht.', async () => {
      sessions.splice(removedIndex, 0, removedSession);
      await saveJSON('sessions', sessions);
      goSessionDetail(removedSession.id);
    });
  };
}

function showFatalError(err){
  const msg = (err && err.message) ? err.message : String(err);
  const stack = (err && err.stack) ? err.stack : '';
  app.innerHTML = `
    <div class="brand"><h1>Etwas ist schiefgelaufen</h1></div>
    <div class="history-empty" style="text-align:left; white-space:pre-wrap; word-break:break-word;">
      Die App konnte nicht vollständig laden.

      Fehlermeldung:
      ${msg}

      ${stack ? '\n' + stack : ''}

      Tipp: Falls du die Datei über die Dateien-App geöffnet hast, stelle sicher,
      dass sie wirklich in Safari geöffnet wird (nicht nur als Vorschau) —
      antippen und halten, dann „Öffnen mit" → Safari wählen.
    </div>
  `;
}

window.addEventListener('error', (e) => { showFatalError(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { showFatalError(e.reason); });

wireAlternativeNumberInputs();
wireViewportAwareOverlays();
try{
  init().catch(showFatalError);
}catch(err){
  showFatalError(err);
}
</script>
