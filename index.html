<style>

:root{
  --bg: #121316;
  --surface: #1c1e22;
  --surface-2: #24272c;
  --text: #ece9e4;
  --muted: #8a8e95;
  --accent: #d9c74a;
  --accent-2: #b3453a;
  --accent-3: #6f9bd1;
  --border: #33363b;
  --radius: 10px;
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button{ font-family: inherit; cursor: pointer; }
input{ font-family: inherit; }
::selection{ background: var(--accent); color: #121316; }

.app{ max-width: 640px; margin: 0 auto; padding: 20px 16px 100px; }

/* ---------- Top identity ---------- */
.brand{ margin-bottom: 14px; }
.brand h1{
  font-family:'Bebas Neue', sans-serif;
  font-size: clamp(24px, 8vw, 34px);
  letter-spacing: 1px;
  line-height: 1.05;
  word-break: break-word;
  margin:0;
}
.gear{
  background:none; border:1px solid var(--border); color:var(--muted);
  border-radius: 8px; padding:8px 12px; font-size:13px;
}
.gear:hover{ color: var(--text); border-color: var(--muted); }
.back-row{ margin-bottom: 18px; }
.back-row .gear{ display:inline-block; width:auto; padding:9px 16px; font-size:13px; }

/* ---------- Buttons ---------- */
.btn{
  display:block; width:100%; text-align:center;
  border-radius: var(--radius); border:1px solid var(--border);
  background: var(--surface); color: var(--text);
  padding: 16px; font-size:16px; font-weight:600;
  transition: transform .08s ease, background .15s ease;
}
.btn:active{ transform: scale(0.98); }
.btn-primary{
  background: var(--accent); color:#121316; border-color: var(--accent);
  font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:1px;
  padding: 20px;
}
.btn-danger{ background: var(--accent-2); border-color: var(--accent-2); color:#fff; }
.btn-ghost{ background:none; color:var(--muted); border:1px solid var(--border); font-weight:500; }
.btn-small{ padding:8px 14px; font-size:13px; width:auto; display:inline-block; }

/* ---------- History table ---------- */
.section-label{
  font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color: var(--muted);
  margin: 28px 0 10px;
}
.history{ border-radius: var(--radius); overflow:hidden; border:1px solid var(--border); }
.history-row{
  display:flex; justify-content:space-between; align-items:center;
  padding: 14px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.history-row:last-child{ border-bottom:none; }
.history-row:active{ background: var(--surface-2); }
.history-date{ font-weight:600; }
.history-meta{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); margin-top:2px; }
.history-empty{
  padding: 24px 16px; color: var(--muted); text-align:center; font-size:14px;
  background: var(--surface); border-radius: var(--radius); border:1px solid var(--border);
}
.history-toggle{
  width:100%; background:none; border:1px dashed var(--border); color: var(--muted);
  border-radius: var(--radius); padding:12px; font-size:13px; font-weight:600;
  margin-top:10px; text-align:center;
}
.history-toggle:active{ color: var(--text); border-color: var(--muted); }
.history-month-label{
  font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--muted);
  margin:16px 2px 8px;
}
.history-month-label:first-child{ margin-top:2px; }

/* ---------- Nav row / stat cards ---------- */
.nav-row{ display:flex; gap:8px; margin-bottom:22px; }
.nav-row .gear{
  flex:1; text-align:center; padding:11px 6px; font-size:12.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.nav-row .nav-row-icon-only{ flex:0 0 auto; width:44px; padding:11px 0; font-size:16px; }
.stats-row{ display:flex; gap:10px; margin-bottom:22px; }
.stat-card{
  flex:1; min-width:0; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 14px; transition: background .15s ease, border-color .15s ease;
}
.stat-card:active{ background: var(--surface-2); border-color: var(--muted); }
.stat-value-row{ display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; }
.stat-value{ font-family:'JetBrains Mono', monospace; font-size:21px; font-weight:700; color: var(--accent); white-space:nowrap; }
.stat-unit{ font-family:'Inter', sans-serif; font-size:12px; color: var(--muted); font-weight:600; }
.stat-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); margin-top:6px; }

/* ---------- Kompakte Pill-Zusammenfassung (Abschluss-Screen) ---------- */
.summary-pill{
  display:flex; align-items:stretch; justify-content:space-between; gap:6px;
  background: var(--surface); border:1px solid var(--border); border-radius: 18px;
  padding: 14px 16px; margin: 6px 0 22px;
}
.summary-pill-item{ display:flex; flex-direction:column; align-items:center; flex:1; min-width:0; }
.summary-pill-top{ display:flex; align-items:center; gap:7px; }
.summary-pill-icon{ font-size:19px; line-height:1; flex-shrink:0; }
.summary-pill-icon-img{ width:19px; height:19px; flex-shrink:0; object-fit:contain; }
.summary-pill-value{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; color: var(--text); white-space:nowrap; }
.summary-pill-label{ font-size:12px; color: var(--muted); margin-top:4px; text-align:center; }
.summary-pill-divider{ width:1px; align-self:stretch; background: var(--border); flex-shrink:0; }

/* ---------- Abschluss-Screen nach Training ---------- */
.summary-badge{
  min-width:180px; padding:18px 28px; margin:6px auto 22px; border-radius:20px;
  border:1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--surface-2) inset;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:fit-content;
}
.summary-badge-number{ font-family:'JetBrains Mono', monospace; font-size:34px; font-weight:700; color: var(--accent); display:flex; align-items:center; justify-content:center; gap:8px; }
.summary-badge-icon-img{ width:30px; height:30px; object-fit:contain; }
.summary-badge-label{ font-size:10px; text-transform:uppercase; letter-spacing:2px; color: var(--muted); margin-top:2px; }
.summary-list{ margin-top:4px; }
.summary-row{ cursor:pointer; }
.metric-card-header{
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
}
.metric-card-thumb{ width:64px; height:64px; border-radius:14px; object-fit:cover; flex-shrink:0; }
.metric-card-thumb-fallback{
  width:64px; height:64px; border-radius:14px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; color: var(--text);
}
.metric-card-title{ font-weight:700; font-size:19px; }
.metric-card-subtitle{ font-size:13px; color: var(--muted); margin-top:2px; }
.metric-card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding:16px;
}
.metric-row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:10px 0; border-bottom:1px solid var(--border);
  font-size:15px; color: var(--muted);
}
.metric-row:last-child{ border-bottom:none; }
.metric-row-badges{ display:inline-flex; gap:6px; margin-left:6px; }
.metric-badge{ font-weight:700; font-size:14px; }
.metric-badge-alltime{ color: var(--accent); }
.metric-badge-last{ color:#7cc576; }
.metric-row-value{ font-family:'JetBrains Mono', monospace; color: var(--text); font-weight:600; white-space:nowrap; }
.metric-empty-note{ color: var(--muted); font-size:13px; text-align:center; padding:20px 0; }
.summary-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); margin-bottom:10px;
}
.summary-row-media{ flex-shrink:0; }
.summary-thumb{
  width:44px; height:44px; border-radius:10px; object-fit:cover; display:block;
}
.summary-thumb-fallback{
  width:44px; height:44px; border-radius:10px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; color: var(--text);
}
.summary-row-mid{ flex:1; min-width:0; }
.summary-row-name{ font-weight:600; }
.summary-row-meta{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.summary-row-stat{ display:inline-flex; align-items:center; gap:3px; font-weight:700; color: var(--text); }
.summary-row-stat-icon{ width:15px; height:15px; object-fit:contain; }
.summary-row-sets{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; opacity:0.8; }
.summary-row-icon{ font-size:18px; font-weight:700; flex-shrink:0; }
.summary-row-icon-img{ width:22px; height:22px; flex-shrink:0; object-fit:contain; }
.summary-actions{ display:flex; gap:10px; margin-top:16px; }
.summary-actions .btn{ flex:1; }
.summary-print-meta{ display:none; }
.period-row{ display:flex; gap:8px; margin: 4px 0 18px; }
.period-btn{
  flex:1; padding:9px 4px; border-radius:8px; border:1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size:12px; font-weight:600;
}
.period-btn.active{ border-color: var(--accent); color: var(--accent); background: var(--surface-2); }
.period-btn:active{ transform: scale(0.97); }

/* ---------- Trainings-Widget (Balkendiagramm) ---------- */
.training-widget{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 22px;
}
.training-widget-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.training-widget-header h3{
  font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.5px; margin:0; color: var(--text);
}
.training-widget-link{
  display:flex; align-items:center; gap:6px; background: var(--surface-2); border:1px solid var(--border);
  border-radius: 999px; padding:7px 12px; font-size:12px; font-weight:600; color: var(--accent-3);
}
.training-widget-link:active{ background: var(--surface); }
.bar-chart-empty{ color: var(--muted); font-size:13px; text-align:center; padding: 20px 0; }
.workouts-month-count{ font-family:'JetBrains Mono', monospace; color: var(--muted); font-size:11px; margin-left:6px; }


/* ---------- Progress list ---------- */
.progress-row{
  display:flex; justify-content:space-between; align-items:center;
  padding: 14px 16px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); margin-bottom:10px;
}
.progress-row:active{ background: var(--surface-2); }
.progress-name{ font-weight:600; }
.progress-meta{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); margin-top:2px; }
.progress-chevron{ color: var(--muted); font-size:18px; }

/* ---------- Charts ---------- */
.chart-wrap{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 16px;
}
.chart-title{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); margin-bottom:10px; }
.chart-axis{ stroke: var(--border); stroke-width:1; }
.chart-label{ font-family:'JetBrains Mono', monospace; font-size:10px; fill: var(--muted); }
.chart-empty{ color: var(--muted); font-size:13px; text-align:center; padding: 26px 0; }
.progress-summary{ display:flex; gap:18px; font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); margin: 4px 0 18px; }

/* ---------- Timer-Kasten (kompakt, wächst bei Pause) ---------- */
.time-box{
  position: relative; margin: 4px auto 20px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 14px 24px; overflow: hidden; cursor: pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition: padding .25s ease, border-color .25s ease;
}
.time-box.resting{ padding: 18px 24px 22px; border-color: var(--accent); }
.time-box-time{
  font-family:'JetBrains Mono', monospace; font-size: 32px; font-weight:700;
  color: var(--accent); letter-spacing:1px;
}
.time-box-rest{
  font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:700;
  color: var(--accent); margin-top:0; height:0; overflow:hidden;
  opacity:0; transition: opacity .15s ease, height .15s ease, margin-top .15s ease;
}
.time-box-rest.visible{ opacity:1; height:18px; margin-top:6px; }
.time-box-bar{
  position:absolute; left:0; bottom:0; height:3px; width:0%;
  background: var(--accent); opacity:0; transition: opacity .2s ease;
}
.time-box-bar.visible{ opacity:1; }

/* ---------- Rest timer buttons ---------- */
.rest-row{ display:flex; justify-content:center; gap:16px; margin: 0 0 28px; }
.rest-btn{
  width:64px; height:64px; border-radius:50%;
  border:1px solid var(--border); background: var(--surface); color: var(--text);
  font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  transition: transform .08s ease, border-color .15s ease, color .15s ease;
}
.rest-btn:active{ transform: scale(0.94); background: var(--surface-2); }
.rest-btn.is-active{ border-color: var(--accent); color: var(--accent); }

/* ---------- Übungs-Bilderleiste (aktives Training) ---------- */
.thumb-strip{
  display:flex; gap:10px; overflow-x:auto; padding: 2px 2px 10px;
  margin-bottom:16px; -webkit-overflow-scrolling:touch;
}
.thumb{
  width:60px; height:60px; flex-shrink:0; border-radius:14px;
  border:2px solid var(--border); background: var(--surface-2); position:relative;
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px; color: var(--text);
  touch-action: none; user-select: none;
}
.thumb-media{
  position:absolute; inset:0; border-radius:11px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.thumb-img{
  width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;
  -webkit-user-drag:none;
}
.thumb.active{ border-color: var(--accent); }
.thumb.done{ opacity:0.5; }
.thumb-check{
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  background:#7cc576; color:#121316; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}
.thumb-add{
  border-style:dashed; color: var(--muted); font-size:24px; font-weight:400;
}
.thumb-add:active{ border-color: var(--accent); color: var(--accent); }

/* ---------- Exercise cards ---------- */
.exercise-card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px; position:relative;
}
.exercise-title-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.exercise-title{ font-weight:700; font-size:16px; }
.exercise-target{ font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--muted); margin-top:2px; margin-bottom:10px; }
.icon-x{
  background:none; border:none; color: var(--muted); font-size:16px; line-height:1;
  padding:4px 6px; flex-shrink:0; border-radius:6px;
}
.icon-x:active{ color: var(--accent-2); background: var(--surface-2); }
.set-check{
  width:30px; height:30px; border-radius:8px; border:2px solid var(--border); flex-shrink:0;
  background: var(--surface-2); color: transparent; font-size:15px; font-weight:700;
}
.set-check.checked{ background:#7cc576; border-color:#7cc576; color:#121316; }
.set-row.set-done{ opacity:0.55; }
.entry-menu{ margin: 0 0 12px; display:flex; flex-direction:column; gap:6px; }
.entry-menu-item{
  text-align:left; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:10px 12px; font-size:13px; font-weight:500;
}
.entry-menu-item:disabled{ opacity:.35; }
.entry-menu-danger{ color: var(--accent-2); }
.reference-block{
  margin-top:14px; padding:12px 14px; background: var(--surface-2);
  border-radius: var(--radius); border:1px dashed var(--border);
}
.reference-title{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); margin-bottom:8px; }
.reference-row{
  display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace;
  font-size:12px; color: var(--muted); padding:3px 0;
}
.set-row{
  display:grid; grid-template-columns: 40px 1fr 1fr 52px 40px 32px;
  align-items:center; gap:8px; margin-bottom:8px;
}
.set-row.set-row-time{ grid-template-columns: 40px 1fr 40px 32px; }
.sets-header{
  display:grid; grid-template-columns: 40px 1fr 1fr 52px 40px 32px;
  align-items:center; gap:8px; margin-bottom:8px;
}
.sets-header.sets-header-time{ grid-template-columns: 40px 1fr 40px 32px; }
.sets-header-cell{
  font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted);
  text-align:center;
}
.sets-header-cell:first-child{ text-align:left; }
.set-idx{
  width:auto; font-family:'JetBrains Mono', monospace; color: var(--muted); font-size:13px;
  display:flex; align-items:center; gap:4px;
}
.set-vol{
  font-family:'JetBrains Mono', monospace; color: var(--muted); font-size:15px; text-align:center;
}
.set-row input{
  background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:10px; font-family:'JetBrains Mono', monospace; font-size:15px; text-align:center;
  min-width:0; width:100%;
}
.set-row input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
.set-row input:disabled{ opacity:0.35; background: var(--surface); }
.add-set{
  background:none; border:none; color: var(--accent); font-size:13px; font-weight:600; padding:6px 0;
}

/* ---------- Übung hinzufügen (aktives Training) ---------- */
/* ---------- Übung-hinzufügen-Modal (aktives Training) ---------- */
.add-exercise-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.add-exercise-modal{
  width:100%; max-width:640px; max-height:80vh; background: var(--bg);
  border-top-left-radius:20px; border-top-right-radius:20px;
  border:1px solid var(--border); border-bottom:none;
  display:flex; flex-direction:column; overflow:hidden;
}
.add-exercise-modal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.add-exercise-modal-title{ font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:0.5px; }
.add-exercise-modal-close{
  background:none; border:1px solid var(--border); color: var(--muted);
  border-radius:8px; width:32px; height:32px; font-size:16px;
}
.add-exercise-modal-body{ overflow-y:auto; padding:12px 16px 24px; }
.add-exercise-group-label{
  font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--muted);
  margin:16px 2px 8px;
}
.add-exercise-group-label:first-child{ margin-top:2px; }
.add-exercise-row{
  display:flex; align-items:center; gap:12px;
  padding: 10px 12px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); margin-bottom:8px;
}
.add-exercise-row:active{ background: var(--surface-2); }
.add-exercise-thumb{ width:40px; height:40px; border-radius:9px; object-fit:cover; display:block; flex-shrink:0; }
.add-exercise-thumb-fallback{
  width:40px; height:40px; border-radius:9px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; color: var(--text);
}
.add-exercise-mid{ flex:1; min-width:0; }
.add-exercise-name{ font-weight:600; font-size:14px; }
.add-exercise-meta{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
.add-exercise-plus{ color: var(--accent); font-size:20px; font-weight:700; flex-shrink:0; }


/* ---------- Plan editor ---------- */
.plan-row{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom:12px;
}
.plan-row-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.plan-row-image-actions{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.plan-row-media{ flex-shrink:0; }
.plan-row-thumb{ width:44px; height:44px; border-radius:10px; object-fit:cover; display:block; }
.plan-row-thumb-fallback{
  width:44px; height:44px; border-radius:10px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11px; color: var(--text);
}
.plan-row input[type="text"]{
  flex:1; min-width:0; width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:10px 12px; font-size:15px; font-weight:600; margin-bottom:0;
}
.plan-row-head input[type="text"]{ margin-bottom:0; }
.plan-grid{ display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; }
.plan-grid label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); display:block; margin-bottom:4px; }
.plan-grid input{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:8px; font-family:'JetBrains Mono', monospace; text-align:center; font-size:14px;
}
.plan-row2{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px; }
.plan-row2 label{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color: var(--muted); display:block; margin-bottom:4px; }
.plan-row2 select, .plan-row2 input[type="text"]{
  width:100%; background: var(--surface-2); border:1px solid var(--border); color: var(--text);
  border-radius:8px; padding:9px 10px; font-size:13px; font-weight:500; margin-bottom:0;
}
.plan-row .remove{
  margin-top:10px; background:none; border:none; color: var(--accent-2); font-size:12px; font-weight:600;
}

/* ---------- Übungen: Suche, Muskelgruppen-Akkordeon, Export/Import ---------- */
.plan-search{
  width:100%; background: var(--surface); border:1px solid var(--border); color: var(--text);
  border-radius: var(--radius); padding:12px 14px; font-size:14px; margin-bottom:16px;
}
.plan-search:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
.muscle-group{ margin-bottom:10px; }
.muscle-group-header{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding:13px 16px; color: var(--text); text-align:left;
}
.muscle-group-header .mg-name{
  font-family:'Bebas Neue', sans-serif; font-size:16px; letter-spacing:0.5px;
}
.muscle-group-header .mg-meta{
  font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted);
  display:flex; align-items:center; gap:8px;
}
.muscle-group-body{ margin-top:10px; }
.io-row{ display:flex; gap:10px; margin: 4px 0 12px; }
.io-row .btn{ flex:1; }
.danger-zone{
  margin-top:28px; padding-top:18px; border-top:1px dashed var(--border);
}
.danger-zone-title{
  font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--accent-2);
  margin-bottom:8px; font-weight:700;
}
.danger-zone-text{ font-size:12px; color: var(--muted); line-height:1.4; margin:0 0 12px; }

/* ---------- Start-Auswahl (Ganzkörper/Ober/Unter/Frei) ---------- */
.start-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  max-width: 320px; margin: 4px auto 24px;
}
.start-option{
  aspect-ratio: 1 / 1; border-radius: 50%;
  border:1px solid var(--border); background: var(--surface); color: var(--text);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:'Bebas Neue', sans-serif; font-size:17px; letter-spacing:0.5px; line-height:1.1;
  padding: 10px; transition: transform .08s ease, border-color .15s ease, background .15s ease;
}
.start-option .sub{
  display:block; font-family:'Inter', sans-serif; font-size:9.5px; text-transform:uppercase;
  letter-spacing:1px; color: var(--muted); font-weight:600; margin-top:3px;
}
.start-option:active{ transform: scale(0.95); background: var(--surface-2); }
.start-option.accent{ border-color: var(--accent); color: var(--accent); }
.start-cell{ position:relative; width:100%; }
.start-cell .start-option{ width:100%; }
.start-edit-btn{
  position:absolute; top:-6px; right:-6px; width:28px; height:28px; border-radius:50%;
  background: var(--surface-2); border:1px solid var(--border); color: var(--muted);
  font-size:13px; display:flex; align-items:center; justify-content:center; z-index:2;
}
.start-edit-btn:active{ color: var(--accent); border-color: var(--accent); }
.mode-edit-hint{ font-size:13px; color: var(--muted); margin:0 0 16px; line-height:1.4; }

/* ---------- Split-Kachel (A/B direkt in der Start-Auswahl) ---------- */
.start-cell-split{
  aspect-ratio: 1 / 1; border-radius: 50%;
  border:1px solid var(--border); background: var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding: 10px; transition: background .15s ease, border-color .15s ease;
}
.start-cell-split:active{ background: var(--surface-2); border-color: var(--muted); }
.split-cell-top{ display:flex; align-items:center; gap:4px; }
.split-cell-label{
  font-family:'Bebas Neue', sans-serif; font-size:13px; letter-spacing:0.5px; color: var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px;
}
.split-cell-edit{
  background:none; border:none; color: var(--muted); font-size:12px; padding:2px; flex-shrink:0;
}
.split-cell-edit:active{ color: var(--accent); }
.split-cell-row{ display:flex; gap:8px; }
.split-cell-btn{
  width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-family:'Bebas Neue', sans-serif; font-size:18px;
  transition: transform .08s ease, border-color .15s ease, color .15s ease;
}
.split-cell-btn:active{ transform: scale(0.93); border-color: var(--accent); color: var(--accent); }

/* ---------- Freie Übungsauswahl ---------- */
.select-row{
  display:flex; align-items:center; gap:10px;
  padding: 13px 16px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius); margin-bottom:10px;
}
.select-row.checked{ border-color: var(--accent); }
.select-toggle{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
.select-check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color: transparent;
}
.select-row.checked .select-check{ background: var(--accent); border-color: var(--accent); color:#121316; }
.select-name{ font-weight:600; }
.select-meta{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
.select-move{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
.move-btn{
  width:26px; height:22px; border-radius:6px; border:1px solid var(--border);
  background: var(--surface-2); color: var(--muted); font-size:10px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.move-btn:disabled{ opacity:.25; pointer-events:none; }
.move-btn:active{ color: var(--accent); border-color: var(--accent); }
.card-move-row{ display:flex; gap:8px; margin: 2px 0 10px; }

/* ---------- Frei-Auswahl (Bilder + Drag & Drop) ---------- */
.free-row{
  display:flex; align-items:center; gap:12px;
  height:60px; padding:0 14px; box-sizing:border-box;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  margin-bottom:8px; touch-action: none; user-select: none; position:relative;
}
.free-row.checked{ border-color: var(--accent); }
.free-row-check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color: transparent;
}
.free-row.checked .free-row-check{ background: var(--accent); border-color: var(--accent); color:#121316; }
.free-row-media{ flex-shrink:0; }
.free-row-thumb{ width:40px; height:40px; border-radius:9px; object-fit:cover; display:block; pointer-events:none; }
.free-row-thumb-fallback{
  width:40px; height:40px; border-radius:9px; background: var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11px; color: var(--text);
}
.free-row-mid{ flex:1; min-width:0; }
.free-row-name{ font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.free-row-muscle{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--muted); margin-top:2px; }
.card-move-row .move-btn{ width:auto; height:auto; padding:7px 10px; font-size:11px; flex:1; }

/* ---------- Session detail ---------- */
.detail-header{ margin-bottom: 12px; }
.detail-header h2{ font-family:'Bebas Neue', sans-serif; font-size:30px; margin:0 0 4px; letter-spacing:1px; }
.detail-stats{ display:flex; gap:8px 18px; flex-wrap:wrap; font-family:'JetBrains Mono', monospace; font-size:13px; color: var(--muted); line-height:1.3; }
.detail-stats span{ white-space:nowrap; }
.detail-full-toggle{
  width:100%; background:none; border:1px dashed var(--border); color: var(--muted);
  border-radius: var(--radius); padding:14px; font-size:14px; font-weight:600;
  margin-top:18px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;
}
.detail-full-toggle:active{ color: var(--text); border-color: var(--muted); }
.detail-full-toggle-chevron{ transition: transform .2s ease; display:inline-block; }
.detail-full-toggle-chevron.open{ transform: rotate(180deg); }
.detail-full-table-wrap{
  overflow: hidden; max-height:0; transition: max-height .25s ease;
}
.detail-full-table-wrap.open{ max-height: 6000px; }
table.detail-table{ width:100%; border-collapse: collapse; margin-top: 14px; }
table.detail-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px; color: var(--muted);
  padding: 8px 6px; border-bottom:1px solid var(--border);
}
table.detail-table td{
  padding: 8px 6px; font-family:'JetBrains Mono', monospace; font-size:13px;
}
table.detail-table tr.exercise-start td{ border-top:1px solid var(--border); }
table.detail-table tbody tr:first-child td{ border-top:none; }
.detail-actions{ display:flex; gap:8px; margin-top: 22px; justify-content:center; }
.detail-actions .btn{ flex:0 1 auto; padding:12px 14px; font-size:13.5px; }

/* ---------- Fixed bottom bar for active session ---------- */
/* ---------- Undo-Toast ---------- */
.undo-toast{
  position:fixed; left:16px; right:16px; bottom:20px; z-index:60;
  max-width:608px; margin:0 auto;
  background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius);
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  animation: undoToastIn .2s ease;
}
@keyframes undoToastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.undo-toast-text{ font-size:14px; color: var(--text); }
.undo-toast-btn{
  background:none; border:none; color: var(--accent); font-weight:700; font-size:14px;
  padding:4px 8px; flex-shrink:0;
}

.bottom-bar{
  position:fixed; left:0; right:0; bottom:0;
  background: linear-gradient(180deg, transparent, var(--bg) 30%);
  padding: 20px 16px 22px;
}
.bottom-bar-inner{ max-width: 640px; margin:0 auto; display:flex; gap:10px; }
.bottom-bar-inner .btn{ flex:1; }

/* ---------- Print (PDF export) ---------- */
@media print{
  @page{ margin: 10mm; }
  html, body{ height:auto !important; min-height:0 !important; }
  body{ background:#fff; color:#000; }
  .no-print{ display:none !important; }
  .time-box{ display:none; }
  .app{ padding:0; max-width:100%; min-height:0; }
  table.detail-table td, table.detail-table th{ color:#000; border-color:#999; }
  .detail-full-table-wrap{ max-height:none !important; overflow:visible !important; }

  .brand h1{ color:#000; font-size:26px; }
  .summary-print-meta{
    display:block; font-family:'JetBrains Mono', monospace; font-size:12px;
    color:#555; text-align:center; margin:-14px 0 12px;
  }
  .summary-badge{
    padding:12px 20px; margin:2px auto 10px; border-radius:16px;
    border-color:#ddd; background:#fff; box-shadow:none;
  }
  .summary-badge-number{ color:#000; font-size:24px; }
  .summary-badge-label{ color:#666; }
  .stats-row{ margin-bottom:14px; }
  .stat-card{ background:#fff; border-color:#ccc; padding:10px; }
  .stat-value{ color:#000; }
  .stat-label{ color:#666; }
  .summary-pill{ background:#fff; border-color:#ccc; }
  .summary-pill-value{ color:#000; }
  .summary-pill-label{ color:#666; }
  .summary-pill-divider{ background:#ddd; }
  .section-label{ color:#666; }
  .summary-row{
    background:#fff; border-color:#ccc; padding:8px 10px; margin-bottom:6px;
    page-break-inside: avoid;
  }
  .summary-row-name{ color:#000; }
  .summary-row-meta{ color:#555; }
  .summary-row-sets{ color:#777; }
  .summary-thumb, .summary-thumb-fallback{ width:34px; height:34px; }
  .summary-thumb-fallback{ background:#eee; color:#000; }
  .history-row, .history-month-label{ color:#000; }
}
</style>

/* ---------------------------------------------------
   Storage helpers
--------------------------------------------------- */
async function loadJSON(key, fallback){
  try{
    if (window.storage){
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    }
  }catch(e){ /* window.storage nicht verfügbar hier — auf localStorage ausweichen */ }
  try{
    const raw = localStorage.getItem('eisenprotokoll:' + key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
async function saveJSON(key, value){
  try{
    if (window.storage){
      const res = await window.storage.set(key, JSON.stringify(value), false);
      if (res) return;
    }
  }catch(e){ /* window.storage nicht verfügbar hier — auf localStorage ausweichen */ }
  try{
    localStorage.setItem('eisenprotokoll:' + key, JSON.stringify(value));
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
    alert('Speichern hat nicht geklappt: ' + e.message);
  }
}

async function init(){
  plan = await loadJSON('plan', DEFAULT_PLAN);
  sessions = await loadJSON('sessions', []);
  lastPerformance = await loadJSON('lastPerformance', {});

  let planChanged = false;
  DEFAULT_PLAN.exercises.forEach(defEx => {
    if (!plan.exercises.some(e => e.id === defEx.id)){
      plan.exercises.push({ ...defEx });
      planChanged = true;
    }
  });
  plan.exercises.forEach(ex => {
    if (!ex.muscleGroup){
      const def = DEFAULT_PLAN.exercises.find(d => d.id === ex.id);
      ex.muscleGroup = def ? def.muscleGroup : 'Sonstige';
      planChanged = true;
    }
    if (!ex.mainMuscle){
      const def = DEFAULT_PLAN.exercises.find(d => d.id === ex.id);
      ex.mainMuscle = def ? def.mainMuscle : (ex.muscleGroup || '');
      planChanged = true;
    }
  });
  if (plan.bodyWeight === undefined) plan.bodyWeight = null;
  if (!plan._assistedFlagMigration){
    const assistedIds = new Set(['e1']); // Klimmzugmaschine: unterstützt, Volumen = Körpergewicht - eingestelltes Gewicht
    assistedIds.forEach(id => {
      const ex = plan.exercises.find(e => e.id === id);
      if (ex && !ex.assisted){
        ex.assisted = true;
        planChanged = true;
      }
    });
    plan._assistedFlagMigration = true;
    planChanged = true;
  }
  if (!plan._catFixCoreLowerBody){
    ['e6', 'e7', 'e8', 'e14', 'e20'].forEach(id => {
      const ex = plan.exercises.find(e => e.id === id);
      if (ex && ex.category !== 'unterkoerper'){
        ex.category = 'unterkoerper';
        planChanged = true;
      }
    });
    plan._catFixCoreLowerBody = true;
    planChanged = true;
  }
  if (!plan._stripCoreFromOberkoerperList){
    const reclassified = new Set(['e6', 'e7', 'e8', 'e14', 'e20']);
    const stored = plan.modeLists && plan.modeLists.oberkoerper;
    if (stored){
      if (Array.isArray(stored)){
        const filtered = stored.filter(id => !reclassified.has(id));
        if (filtered.length !== stored.length){
          plan.modeLists.oberkoerper = filtered;
          planChanged = true;
        }
      } else if (typeof stored === 'object'){
        ['A', 'B'].forEach(k => {
          if (Array.isArray(stored[k])){
            const filtered = stored[k].filter(id => !reclassified.has(id));
            if (filtered.length !== stored[k].length){
              stored[k] = filtered;
              planChanged = true;
            }
          }
        });
      }
    }
    plan._stripCoreFromOberkoerperList = true;
    planChanged = true;
  }
  if (!plan._defaultModeListsMigration){
    // Setzt die Standard-Übungslisten für Ganzkörper A/B und Oberkörper A/B (siehe
    // DEFAULT_PLAN.modeLists) einmalig auch bei Bestandsnutzer:innen — aber NUR für
    // Modus/Variante-Kombinationen, die noch komplett leer/unbelegt sind. Wurde für einen
    // Modus bereits (auch nur teilweise) manuell etwas eingerichtet, bleibt das unangetastet.
    if (!plan.modeLists) plan.modeLists = {};
    ['ganzkoerper', 'oberkoerper', 'unterkoerper'].forEach(mode => {
      const def = DEFAULT_PLAN.modeLists[mode];
      const stored = plan.modeLists[mode];
      const isEmpty = !stored || (typeof stored === 'object' && !Array.isArray(stored)
        && (!stored.A || !stored.A.length) && (!stored.B || !stored.B.length));
      if (isEmpty && def){
        plan.modeLists[mode] = { A: [...def.A], B: [...def.B] };
        planChanged = true;
      }
    });
    plan._defaultModeListsMigration = true;
    planChanged = true;
  }
  if (planChanged) await saveJSON('plan', plan);

  active = await loadJSON('activeSession', null);
  if (active){
    restState = null;
    addExerciseOpen = false;
    replaceView('active');
    renderActive();
    timerHandle = setInterval(updateTimerDisplay, 1000);
  } else {
    replaceView('home');
    renderHome();
  }
}

function persistActiveSession(){
  saveJSON('activeSession', active || null).catch(() => {});
}

// Berechnet das tatsächlich bewegte Gewicht für einen Satz unter Berücksichtigung
// von unterstützten Übungen (z. B. Klimmzugmaschine: Körpergewicht - eingestelltes Gewicht)
// und reinen Eigenkörpergewicht-Übungen (z. B. Liegestütze: Körpergewicht + evtl. Zusatzgewicht).
// planEx: das Übungsobjekt aus plan.exercises (kann undefined sein), setWeight: eingetragenes Gewicht am Gerät.
function effectiveSetWeight(planEx, setWeight){
  const w = setWeight ?? 0;
  if (!planEx) return w;
  const bw = plan && plan.bodyWeight;
  if (planEx.assisted && bw){
    return Math.max(0, bw - w);
  }
  if (planEx.bodyweightExercise && bw){
    return bw + w;
  }
  return w;
}

function fmtDuration(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }) +
         ' · ' + d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

window.addEventListener('popstate', (event) => {
  const state = event.state || { view: 'home', params: {} };
  if (active && state.view !== 'active'){
    if (confirm('Training wirklich verlassen? Die Einheit wird nicht in deinem Verlauf gespeichert.')){
      clearInterval(timerHandle);
      clearInterval(restInterval);
      restState = null;
      active = null;
      persistActiveSession();
      replaceView('home');
      renderHome();
    } else {
      pushView('active');
    }
    return;
  }
  switch(state.view){
    case 'plan': renderPlanEditor(); break;
    case 'settings': renderSettings(); break;
    case 'progressList': renderProgressList(); break;
    case 'progressDetail': renderExerciseProgress(state.params.name); break;
    case 'sessionDetail': renderSessionDetail(state.params.id); break;
    case 'startSelect': renderStartSelect(); break;
    case 'freeSelect': renderFreeSelect(); break;
    case 'modeEdit': renderModeEdit(state.params.mode, state.params.startTab); break;
    case 'statsChart': renderStatsChart(state.params.metric); break;
    case 'workoutsOverview': renderWorkoutsOverview(); break;
    case 'exerciseSessionDetail': renderExerciseSessionDetail(state.params.sessionId, state.params.exerciseId); break;
    case 'active': if (active) renderActive(); else renderHome(); break;
    default: renderHome();
  }
});

let historyExpanded = false;

function historyRowHTML(s){
  const totalSets = s.entries.reduce((a,e)=>a+e.sets.length,0);
  return `
    <div class="history-row" data-id="${s.id}" role="button" tabindex="0">
      <div>
        <div class="history-date">${fmtDate(s.date)}</div>
        <div class="history-meta">${s.entries.length} Übungen · ${totalSets} Sätze</div>
      </div>
      <div class="history-meta">${fmtDuration(s.durationSec)}</div>
    </div>`;
}

function monthLabel(iso){
  const label = new Date(iso).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function renderHome(){
  const allSorted = sessions.slice().reverse();
  const recent = allSorted.slice(0, 5);
  const rest = allSorted.slice(5);

  const recentHTML = recent.map(historyRowHTML).join('');

  const groups = [];
  rest.forEach(s => {
    const label = monthLabel(s.date);
    let g = groups.find(g => g.label === label);
    if (!g){ g = { label, sessions: [] }; groups.push(g); }
    g.sessions.push(s);
  });
  const restHTML = groups.map(g => `
    <div class="history-month-label">${g.label}</div>
    ${g.sessions.map(historyRowHTML).join('')}
  `).join('');

  const toggleHTML = rest.length ? `
    <button class="history-toggle" id="btnHistoryToggle">
      ${historyExpanded ? 'Weniger anzeigen' : `${rest.length} weitere Einheit${rest.length === 1 ? '' : 'en'} anzeigen`} ${historyExpanded ? '▾' : '▸'}
    </button>
    <div class="history" id="historyRest" style="display:${historyExpanded ? 'block' : 'none'}; margin-top:10px;">
      ${restHTML}
    </div>
  ` : '';

  app.innerHTML = `
    <div class="brand">
      <h1>Trainingsplan</h1>
    </div>
    <div class="nav-row">
      <button class="gear" id="btnProgress">Fortschritt</button>
      <button class="gear" id="btnPlan">Übungen</button>
      <button class="gear nav-row-icon-only" id="btnSettings" aria-label="Einstellungen">⚙</button>
    </div>

    <button class="btn btn-primary" id="btnStart">Training starten</button>

    <div class="section-label">Verlauf</div>
    <div class="history">
      ${recentHTML || '<div class="history-empty">Noch keine Einheit protokolliert.</div>'}
    </div>
    ${toggleHTML}
  `;

  document.getElementById('btnStart').onclick = () => goStartSelect();
  document.getElementById('btnPlan').onclick = () => goPlan();
  document.getElementById('btnProgress').onclick = () => goProgressList();
  document.getElementById('btnSettings').onclick = () => goSettings();
  if (document.getElementById('btnHistoryToggle')){
    document.getElementById('btnHistoryToggle').onclick = () => {
      historyExpanded = !historyExpanded;
      renderHome();
    };
  }
  app.querySelectorAll('.history-row').forEach(row=>{
    row.onclick = () => goSessionDetail(row.dataset.id);
  });
}

function totalTrainingSeconds(){
  return sessions.reduce((a,s)=> a + s.durationSec, 0);
}
function totalVolumeKg(){
  return sessions.reduce((a,s)=>
    a + s.entries.reduce((a2,e)=>{
      const planEx = plan.exercises.find(x => x.id === e.exerciseId);
      return a2 + e.sets.reduce((a3,st)=> a3 + ((st.reps && st.weight) ? st.reps*effectiveSetWeight(planEx, st.weight) : 0), 0);
    }, 0)
  , 0);
}
function shortDate(iso){
  return new Date(iso).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}
function fmtSec(sec){
  if (sec === null || sec === undefined) return '—';
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
function sessionVolumeKg(s){
  return s.entries.reduce((a,e) => {
    const planEx = plan.exercises.find(x => x.id === e.exerciseId);
    return a + e.sets.reduce((a2,st) => a2 + ((st.reps && st.weight) ? st.reps*effectiveSetWeight(planEx, st.weight) : 0), 0);
  }, 0);
}
function weekBucket(d){
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return { key: `${d.getFullYear()}-W${week}`, label: `KW ${week}`, sortKey: d.getFullYear()*100 + week };
}
function aggregateSessions(getValue, period){
  const sorted = sessions.slice().sort((a,b) => new Date(a.date) - new Date(b.date));
  if (period === 'total'){
    let running = 0;
    return sorted.map(s => { running += getValue(s); return { label: shortDate(s.date), value: running }; });
  }
  const buckets = new Map();
  sorted.forEach(s => {
    const d = new Date(s.date);
    let key, label, sortKey;
    if (period === 'week'){
      const wb = weekBucket(d);
      key = wb.key; label = wb.label; sortKey = wb.sortKey;
    } else if (period === 'month'){
      key = `${d.getFullYear()}-${d.getMonth()}`;
      label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
      sortKey = d.getFullYear()*100 + d.getMonth();
    } else {
      key = `${d.getFullYear()}`;
      label = `${d.getFullYear()}`;
      sortKey = d.getFullYear();
    }
    if (!buckets.has(key)) buckets.set(key, { label, value: 0, sortKey });
    buckets.get(key).value += getValue(s);
  });
  return [...buckets.values()].sort((a,b) => a.sortKey - b.sortKey);
}

let statsPeriod = 'total';
const PERIOD_LABELS = { total: 'Insgesamt', week: 'Woche', month: 'Monat', year: 'Jahr' };

// Bucketet eine Liste von {date, value}-Punkten nach Periode (analog aggregateSessions(),
// aber für beliebige Datenpunkte statt konkret für Sessions). Bei 'total' bleibt jeder Punkt
// einzeln erhalten (roh, eine Einheit = ein Punkt). Bei week/month/year wird pro Bucket der
// Maximalwert genommen — für Fortschrittsdiagramme aussagekräftiger als eine Summe (z. B.
// "bestes Gewicht in dieser Woche" statt einer wenig sinnvollen Gewichtssumme).
function aggregateHistoryPoints(points, period){
  if (period === 'total') return points;
  const buckets = new Map();
  points.forEach(p => {
    const d = new Date(p.date);
    let key, label, sortKey;
    if (period === 'week'){
      const wb = weekBucket(d);
      key = wb.key; label = wb.label; sortKey = wb.sortKey;
    } else if (period === 'month'){
      key = `${d.getFullYear()}-${d.getMonth()}`;
      label = d.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
      sortKey = d.getFullYear()*100 + d.getMonth();
    } else {
      key = `${d.getFullYear()}`;
      label = `${d.getFullYear()}`;
      sortKey = d.getFullYear();
    }
    if (!buckets.has(key)) buckets.set(key, { label, value: p.value, sortKey });
    else if (p.value > buckets.get(key).value) buckets.get(key).value = p.value;
  });
  return [...buckets.values()].sort((a,b) => a.sortKey - b.sortKey);
}

function exerciseHistory(name){
  const planEx = plan.exercises.find(e => e.name === name);
  const isTime = planEx && planEx.type === 'time';
  return sessions
    .filter(s => s.entries.some(e => e.name === name && e.sets.some(st => isTime ? st.seconds : (st.reps && st.weight))))
    .map(s => {
      const e = s.entries.find(e => e.name === name);
      if (isTime){
        const valid = e.sets.filter(st => st.seconds);
        return {
          date: s.date,
          isTime: true,
          maxSeconds: Math.max(...valid.map(st => st.seconds)),
          totalSeconds: valid.reduce((a,st) => a + st.seconds, 0)
        };
      }
      const m = computeExerciseMetrics(e, planEx);
      return {
        date: s.date,
        isTime: false,
        maxWeight: m.hasData ? m.weightMax : 0,
        volume: m.hasData ? m.volume : 0,
        volumeMax: m.hasData ? m.volumeMax : 0,
        volumeAvg: m.hasData ? m.volumeAvg : 0,
        rm10Max: m.hasData ? m.rm10Max : 0,
        rm10Avg: m.hasData ? m.rm10Avg : 0,
        weightAvg: m.hasData ? m.weightAvg : 0,
        repsMax: m.hasData ? m.repsMax : 0,
        repsAvg: m.hasData ? m.repsAvg : 0
      };
    })
    .sort((a,b) => new Date(a.date) - new Date(b.date));
}

// Epley-Formel: geschätztes 1RM aus Gewicht und Wiederholungen eines Satzes.
function estimate1RM(weight, reps){
  if (!weight || !reps) return 0;
  return weight * (1 + reps / 30);
}

// Berechnet alle Kennzahlen für eine Übung innerhalb einer bestimmten Session
// (Sätze, Volumen, Volumen Max/Ø, 10RM Max/Ø, Gewicht Max/Ø, Wdh Max/Ø).
// planEx wird für effectiveSetWeight (unterstützte/Eigenkörpergewicht-Übungen) gebraucht.
function computeExerciseMetrics(entry, planEx){
  const validSets = (entry.sets || []).filter(s => s.reps !== null && s.reps !== undefined && s.weight !== null && s.weight !== undefined);
  if (!validSets.length){
    return { setsCount: entry.sets ? entry.sets.length : 0, hasData: false };
  }
  const setVolumes = validSets.map(s => s.reps * effectiveSetWeight(planEx, s.weight));
  const setWeights = validSets.map(s => effectiveSetWeight(planEx, s.weight));
  const setReps = validSets.map(s => s.reps);
  const set1RMs = validSets.map(s => estimate1RM(effectiveSetWeight(planEx, s.weight), s.reps));
  const avg = arr => arr.reduce((a,v) => a+v, 0) / arr.length;
  return {
    setsCount: entry.sets.length,
    hasData: true,
    volume: setVolumes.reduce((a,v) => a+v, 0),
    volumeMax: Math.max(...setVolumes),
    volumeAvg: avg(setVolumes),
    rm10Max: Math.max(...set1RMs),
    rm10Avg: avg(set1RMs),
    weightMax: Math.max(...setWeights),
    weightAvg: avg(setWeights),
    repsMax: Math.max(...setReps),
    repsAvg: avg(setReps),
    repsTotal: setReps.reduce((a,v) => a+v, 0)
  };
}

// Vergleicht die Metriken einer Session gegen den bisherigen Allzeitrekord (aus allen
// vorherigen Sessions dieser Übung) sowie gegen die direkt vorherige Session, und liefert
// pro Kennzahl die Prozent-Steigerung (falls vorhanden). Wird für die Übungsdetailseite
// in der Zusammenfassung gebraucht (gelb = vs. Allzeitrekord, grün = vs. letztes Mal).
function computeExerciseMetricComparison(session, exerciseId){
  const planEx = plan.exercises.find(x => x.id === exerciseId);
  const entry = session.entries.find(e => e.exerciseId === exerciseId);
  if (!entry) return null;
  const current = computeExerciseMetrics(entry, planEx);

  const priorSessions = sessions
    .filter(s => s.id !== session.id && new Date(s.date) < new Date(session.date))
    .sort((a,b) => new Date(b.date) - new Date(a.date)); // neueste zuerst

  const priorMetrics = [];
  let prevEntryMetrics = null;
  priorSessions.forEach(s => {
    const match = s.entries.find(x => x.exerciseId === exerciseId);
    if (match && match.sets && match.sets.length){
      const m = computeExerciseMetrics(match, planEx);
      if (m.hasData){
        priorMetrics.push(m);
        if (!prevEntryMetrics) prevEntryMetrics = m; // erste gefundene = direkt vorherige Einheit
      }
    }
  });

  // Hinweis: effectiveSetWeight() normalisiert unterstützte Übungen (assisted) bereits so,
  // dass ein höherer Wert immer besser ist (Körpergewicht - Gerätegewicht). Volume/Gewicht/
  // 10RM basieren alle auf effectiveSetWeight, brauchen also KEINE zusätzliche Umkehrung mehr.
  // Nur repsMax/repsAvg sind unabhängig davon ohnehin "höher = besser". Es gibt daher aktuell
  // keine Kennzahl, bei der "niedriger = besser" gelten müsste — lowerIsBetter bleibt nur noch
  // als Info-Flag erhalten (z. B. für den "weniger Unterstützung nötig"-Hinweistext).
  const METRIC_KEYS = ['volume', 'volumeMax', 'volumeAvg', 'rm10Max', 'rm10Avg', 'weightMax', 'weightAvg', 'repsMax', 'repsAvg'];

  function pctGain(curr, best){
    if (curr === null || curr === undefined || best === null || best === undefined || best === 0) return null;
    const improved = curr > best;
    if (!improved) return null;
    const diff = curr - best;
    return Math.round((diff / best) * 100);
  }

  const comparison = {};
  METRIC_KEYS.forEach(key => {
    const curr = current.hasData ? current[key] : null;
    const allTimeBest = priorMetrics.length ? Math.max(...priorMetrics.map(m => m[key])) : null;
    const prevVal = prevEntryMetrics ? prevEntryMetrics[key] : null;
    // Gab es noch nie zuvor Daten zu dieser Übung, ist jeder aktuelle Wert automatisch ein
    // neuer Allzeitrekord (isNewAllTime), auch ohne Prozent-Vergleichswert (allTimePct bleibt
    // in dem Fall null, da kein Vorherwert für eine Prozentangabe existiert).
    const isNewAllTime = allTimeBest === null && curr !== null && curr !== undefined;
    comparison[key] = {
      value: curr,
      allTimePct: allTimeBest !== null ? pctGain(curr, allTimeBest) : null,
      lastPct: prevVal !== null ? pctGain(curr, prevVal) : null,
      isNewAllTime
    };
  });

  return { current, comparison, lowerIsBetter: !!(planEx && planEx.assisted), hasHistory: priorMetrics.length > 0 };
}

const METRIC_LABELS = {
  volume: 'Volumen',
  volumeMax: 'Volumen Max',
  volumeAvg: 'Volumen Ø',
  rm10Max: '10RM Max',
  rm10Avg: '10RM Ø',
  weightMax: 'Gewicht Max',
  weightAvg: 'Gewicht Ø',
  repsMax: 'Wdh Max',
  repsAvg: 'Wdh Ø'
};
const METRIC_UNITS = {
  volume: 'kg', volumeMax: 'kg', volumeAvg: 'kg',
  rm10Max: 'kg', rm10Avg: 'kg', weightMax: 'kg', weightAvg: 'kg',
  repsMax: 'Wdh', repsAvg: 'Wdh'
};

function fmtMetricValue(key, value){
  if (value === null || value === undefined) return '—';
  const rounded = Math.round(value * 10) / 10;
  const shown = Number.isInteger(rounded) ? rounded : rounded.toFixed(1);
  return `${shown} ${METRIC_UNITS[key]}`;
}

// Zählt, wie viele Kennzahlen bei dieser Session neue Allzeitrekorde waren — das ist
// der "Stern"-Wert, der in der Zusammenfassung pro Übung bzw. Session angezeigt wird.
// Zählt sowohl echte Steigerungen gegenüber einem bisherigen Bestwert (allTimePct !== null)
// als auch Kennzahlen einer Übung, die noch nie zuvor protokolliert wurde (isNewAllTime) —
// auch ein erstmalig protokollierter Wert ist per Definition der aktuelle Allzeitrekord.
function countAllTimeRecords(comparison){
  return Object.values(comparison).filter(m => m.allTimePct !== null || m.isNewAllTime).length;
}

function renderExerciseSessionDetail(sessionId, exerciseId){
  const session = sessions.find(s => s.id === sessionId);

        <div class="metric-card-title">${name}</div>

      </div>

  document.getElementById('btnBack').onclick = () => history.back();
}


function buildLineChart(points, color, valueFormatter){
  const fmt = valueFormatter || (v => v);
  if (!points.length) return '<div class="chart-empty">Noch keine Daten — nach der ersten geloggten Einheit erscheint hier der Verlauf.</div>';
  const w = 560, h = 150, padL = 8, padR = 8, padT = 20, padB = 24;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const values = points.map(p => p.value);
  const maxV = Math.max(...values);
  const minV = Math.min(0, Math.min(...values));
  const range = (maxV - minV) || 1;
  const stepX = points.length > 1 ? innerW/(points.length - 1) : 0;
  const coords = points.map((p,i) => ({
    x: padL + stepX*i,
    y: padT + innerH - ((p.value - minV)/range)*innerH,
    ...p
  }));
  const path = coords.map((c,i) => (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${color}"/>`).join('');
  const everyN = Math.max(1, Math.ceil(coords.length/6));
  const xLabels = coords.map((c,i) => (i % everyN === 0 || i === coords.length-1)
    ? `<text class="chart-label" x="${c.x.toFixed(1)}" y="${h-6}" text-anchor="middle">${c.label}</text>` : '').join('');
  const valueLabels = coords.map(c =>
    `<text class="chart-label" style="fill:${color};font-weight:700" x="${c.x.toFixed(1)}" y="${(c.y-8).toFixed(1)}" text-anchor="middle">${fmt(c.value)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Verlaufsdiagramm">
    <line class="chart-axis" x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}${valueLabels}${xLabels}
  </svg>`;
}

function buildBarChart(points, color){
  if (!points.length) return '<div class="bar-chart-empty">Noch keine Einheiten protokolliert.</div>';
  const w = 560, h = 140, padL = 6, padR = 6, padT = 14, padB = 22;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const maxV = Math.max(1, ...points.map(p => p.value));
  const n = points.length;
  const gap = n > 1 ? 6 : 0;
  const barW = Math.max(4, (innerW - gap*(n-1)) / n);
  const bars = points.map((p,i) => {
    const x = padL + i*(barW+gap);
    const barH = Math.max((p.value/maxV)*innerH, p.value > 0 ? 2 : 0);
    const y = padT + innerH - barH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"/>`;
  }).join('');
  const everyN = Math.max(1, Math.ceil(n/6));
  const labels = points.map((p,i) => (i % everyN === 0 || i === n-1)
    ? `<text class="chart-label" x="${(padL + i*(barW+gap) + barW/2).toFixed(1)}" y="${h-6}" text-anchor="middle">${p.label}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Einheiten pro Monat">
    <line class="chart-axis" x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}"/>
    ${bars}${labels}
  </svg>`;
}

function sessionsPerMonth(){
  const buckets = new Map();
  sessions.slice().sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(s => {
    const d = new Date(s.date);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const label = d.toLocaleDateString('de-DE', { month: 'short' });
    const sortKey = d.getFullYear()*100 + d.getMonth();
    if (!buckets.has(key)) buckets.set(key, { label, count: 0, sortKey });
    buckets.get(key).count++;
  });
  return [...buckets.values()].sort((a,b) => a.sortKey - b.sortKey);
}

const MODE_LABELS = { ganzkoerper: 'Ganzkörper', oberkoerper: 'Oberkörper', unterkoerper: 'Unterkörper' };

function getModeExerciseIds(mode, variant){
  const stored = plan.modeLists && plan.modeLists[mode];
  if (stored && typeof stored === 'object' && !Array.isArray(stored)){
    const key = variant || 'A';
    return Array.isArray(stored[key]) ? stored[key] : [];
  }
  if (Array.isArray(stored)) return variant === 'B' ? [] : stored;
  if (variant === 'B') return [];
  if (mode === 'ganzkoerper') return plan.exercises.map(e => e.id);
  return plan.exercises.filter(e => e.category === mode).map(e => e.id);
}
function getModeExercises(mode, variant){
  const ids = new Set(getModeExerciseIds(mode, variant));
  return plan.exercises.filter(e => ids.has(e.id));
}

// Importiert eine einzelne, zuvor über exportSingleSession() exportierte Trainingseinheit
// und startet direkt ein neues Training mit genau denselben Übungen (in derselben
// Reihenfolge) — analog zu repeatSession(), aber die Übungsliste kommt aus der Datei statt
// aus dem lokalen Verlauf. Übungen, die im aktuellen Plan noch fehlen (z. B. Import auf
// einem anderen Gerät), werden aus den mitgelieferten Übungsdefinitionen ergänzt (Abgleich
// über id, nichts Bestehendes wird überschrieben — gleiches Prinzip wie die
// DEFAULT_PLAN-Migration in init()). Übungen ganz ohne mitgelieferte Definition und ohne
// Treffer im aktuellen Plan werden übersprungen.
async function importSingleSessionFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if (!data.session || !Array.isArray(data.session.entries)){
        alert('Diese Datei sieht nicht wie ein exportiertes Training dieser App aus.');
        return;
      }
      const importedExercises = Array.isArray(data.exercises) ? data.exercises : [];
      let planChanged = false;
      importedExercises.forEach(ex => {
        if (ex && ex.id && !plan.exercises.some(p => p.id === ex.id)){
          plan.exercises.push({ ...ex });
          planChanged = true;
        }
      });
      if (planChanged) await saveJSON('plan', plan);

      const exerciseList = data.session.entries
        .map(e => plan.exercises.find(x => x.id === e.exerciseId))
        .filter(Boolean);
      if (!exerciseList.length){
        alert('Keine der Übungen aus dieser Datei konnte zugeordnet werden.');
        return;
      }
      if (exerciseList.length < data.session.entries.length){
        if (!confirm(`${data.session.entries.length - exerciseList.length} Übung(en) aus der Datei fehlen im Plan und werden übersprungen. Trotzdem starten?`)) return;
      }
      if (active){
        if (!confirm('Es läuft bereits ein Training. Dieses verwerfen und das importierte Training starten?')) return;
        clearInterval(timerHandle);
        clearInterval(restInterval);
        restState = null;
        active = null;
        persistActiveSession();
      }
      startSession(exerciseList);
    }catch(err){
      alert('Datei konnte nicht gelesen werden: ' + err.message);
    }
  };
  reader.readAsText(file);
}

let modeEditData = null; // { A: {selected:Set, order:[]}, B: {selected:Set, order:[]} }
let modeEditTab = 'A';

function buildModeEditVariant(ids, mode){
  const pool = (mode === 'oberkoerper' || mode === 'unterkoerper')
    ? plan.exercises.filter(e => e.category === mode)
    : plan.exercises;
  const allIds = new Set(pool.map(e => e.id));
  const ungrouped = (mode === 'oberkoerper' || mode === 'unterkoerper');
  const savedOrder = ids.filter(id => allIds.has(id));
  const groups = {};

  if (ungrouped){
    // Muskelgruppe ist das führende Sortierkriterium (z. B. bleiben alle
    // "Rücken"-Übungen hintereinander), die gespeicherte Reihenfolge zählt
    // nur noch als Tie-Break INNERHALB derselben Muskelgruppe.
    const muscleGroupIndex = g => {
      const i = MUSCLE_GROUP_ORDER.indexOf(g);
      return i === -1 ? MUSCLE_GROUP_ORDER.length : i;
    };
    const sortedPool = [...pool].sort((a, b) => {
      const ga = muscleGroupIndex(a.muscleGroup), gb = muscleGroupIndex(b.muscleGroup);
      if (ga !== gb) return ga - gb;
      const ia = savedOrder.indexOf(a.id), ib = savedOrder.indexOf(b.id);
      if (ia === -1 && ib === -1) return 0;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    groups._all = sortedPool.map(e => e.id);
  } else {
    pool.forEach(ex => {
      const g = ex.muscleGroup || 'Sonstige';
      (groups[g] = groups[g] || []).push(ex.id);
    });
    // bereits gespeicherte Reihenfolge innerhalb jeder Muskelgruppen-Sektion respektieren
    Object.keys(groups).forEach(g => {
      groups[g].sort((a, b) => {
        const ia = savedOrder.indexOf(a), ib = savedOrder.indexOf(b);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    });
  }

  return {
    selected: new Set(savedOrder),
    groups,
    ungrouped
  };
}

    });
  }

  function orderedGroupNames(groups){
    const ordered = MUSCLE_GROUP_ORDER.filter(g => groups[g] && groups[g].length);
    Object.keys(groups).forEach(g => { if (groups[g] && groups[g].length && !ordered.includes(g)) ordered.push(g); });
    return ordered;
  }

  function itemRowHTML(id, g, state){
    const ex = plan.exercises.find(e => e.id === id);

    const img = ex.imageData;

        container.innerHTML = '<div class="history-empty">Noch keine Übungen im Plan.</div>';
        return;
      }
      container.innerHTML = ids.map(id => itemRowHTML(id, '_all', state)).join('');
      wireModeRowDrag(state);
      return;
    }

    const groupNames = orderedGroupNames(state.groups);
    if (!groupNames.length){
      container.innerHTML = '<div class="history-empty">Noch keine Übungen im Plan.</div>';
      return;
    }
    container.innerHTML = groupNames.map(g => {
      const ids = state.groups[g];
      const isOpen = modeGroupOpen.has(g);
      const selCount = ids.filter(id => state.selected.has(id)).length;
      const itemsHTML = ids.map(id => itemRowHTML(id, g, state)).join('');
      return `
        <div class="muscle-group">
          <button class="muscle-group-header" data-group="${g}" type="button">
            <span class="mg-name">${g}</span>
            <span class="mg-meta">${selCount ? selCount + '/' : ''}${ids.length} Übung${ids.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${itemsHTML}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        const g = btn.dataset.group;
        if (modeGroupOpen.has(g)) modeGroupOpen.delete(g); else modeGroupOpen.add(g);
        renderRows();
      };
    });

    wireModeRowDrag(state);
  }

  function wireModeRowDrag(state){
    const LONG_PRESS_MS = 350;
    const MOVE_CANCEL_PX = 8;
    const rowStep = 68;

    document.querySelectorAll('#modeEditRows .free-row').forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        const group = el.dataset.group;
        const id = el.dataset.id;
        const arr = state.groups[group];
        const fromIndex = arr.indexOf(id);
        let targetIndex = fromIndex;
        const startX = e.clientX, startY = e.clientY;
        let lastX = startX, lastY = startY;
        let mode2 = 'pending';

        const groupEls = () => Array.from(document.querySelectorAll(`#modeEditRows .free-row[data-group="${CSS.escape(group)}"]`));

        const longPressTimer = setTimeout(() => {
          if (mode2 !== 'pending') return;
          mode2 = 'armed';
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
          el.style.transition = 'transform .1s ease';
          el.style.transform = 'scale(1.02)';
          if (navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);

        const onMove = (ev) => {
          const dyStep = ev.clientY - lastY;
          const dxStep = ev.clientX - lastX;
          lastX = ev.clientX; lastY = ev.clientY;

          if (mode2 === 'pending'){
            window.scrollBy(0, -dyStep);
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX){
              mode2 = 'scrolling';
              clearTimeout(longPressTimer);
            }
            return;
          }
          if (mode2 === 'scrolling'){
            window.scrollBy(0, -dyStep);
            return;
          }
          if (mode2 === 'armed'){
            mode2 = 'dragging';
            el.style.transition = 'none';
            el.style.zIndex = 5;
            groupEls().forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
          }
          ev.preventDefault();
          const dy = ev.clientY - startY;
          el.style.transform = `translateY(${dy}px) scale(1.03)`;
          el.style.boxShadow = '0 8px 16px rgba(0,0,0,0.4)';

          const shift = Math.round(dy / rowStep);
          const newTarget = Math.max(0, Math.min(arr.length - 1, fromIndex + shift));
          if (newTarget !== targetIndex){
            targetIndex = newTarget;
            groupEls().forEach((t, i) => {
              if (t === el) return;
              let offset = 0;
              if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -rowStep;
              else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = rowStep;
              t.style.transform = offset ? `translateY(${offset}px)` : '';
            });
          }
        };

        const finish = () => {
          clearTimeout(longPressTimer);
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onCancel);
          groupEls().forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
        };
        const onUp = () => {
          const finalMode = mode2;
          finish();
          if (finalMode === 'dragging' && targetIndex !== fromIndex){
            const [moved] = arr.splice(fromIndex, 1);
            arr.splice(targetIndex, 0, moved);
            renderRows();
          } else if (finalMode !== 'scrolling'){
            if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
            renderRows();
          }
        };
        const onCancel = () => { finish(); };

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onCancel);
      });
    });
  }
  renderRows();

  document.querySelectorAll('#modeEditTabs .period-btn').forEach(btn => {
    btn.onclick = () => {
      modeEditTab = btn.dataset.tab;
      renderTabs();
      renderRows();
    };
  });

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnSaveMode').onclick = async () => {
    if (!plan.modeLists) plan.modeLists = {};
    const flatten = state => orderedGroupNames(state.groups)
      .flatMap(g => state.groups[g])
      .filter(id => state.selected.has(id));
    plan.modeLists[mode] = {
      A: flatten(modeEditData.A),
      B: flatten(modeEditData.B)
    };
    await saveJSON('plan', plan);
    history.back();
  };
}

            <div class="free-row-media">
              ${img ? `<img class="free-row-thumb" src="${img}" alt="">` : `<span class="free-row-thumb-fallback">${initials(ex.name)}</span>`}
            </div>
            <div class="free-row-mid">
              <div class="free-row-name">${ex.name}</div>

            </div>

      }).join('');
      return `

            <span class="mg-meta">${selCount ? selCount + '/' : ''}${ids.length} Übung${ids.length === 1 ? '' : 'en'} ${isOpen ? '▾' : '▸'}</span>
          </button>
          <div class="muscle-group-body" style="display:${isOpen ? 'block' : 'none'}">
            ${itemsHTML}
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.muscle-group-header').forEach(btn => {
      btn.onclick = () => {
        const g = btn.dataset.group;
        if (freeGroupOpen.has(g)) freeGroupOpen.delete(g); else freeGroupOpen.add(g);
        renderRows();
      };
    });

    wireFreeRowDrag();
  }

  function wireFreeRowDrag(){
    const LONG_PRESS_MS = 350;
    const MOVE_CANCEL_PX = 8;
    const rowStep = 68; // Zeilenhöhe (60px) + Abstand (8px), muss zur CSS-Lücke passen

    document.querySelectorAll('.free-row').forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        const group = el.dataset.group;
        const id = el.dataset.id;
        const arr = freeGroups[group];
        const fromIndex = arr.indexOf(id);
        let targetIndex = fromIndex;
        const startX = e.clientX, startY = e.clientY;
        let lastX = startX, lastY = startY;
        let mode = 'pending'; // pending -> armed -> dragging, oder pending -> scrolling

        const groupEls = () => Array.from(document.querySelectorAll(`.free-row[data-group="${CSS.escape(group)}"]`));

        const longPressTimer = setTimeout(() => {
          if (mode !== 'pending') return;
          mode = 'armed';
          try{ el.setPointerCapture(e.pointerId); }catch(err){}
          el.style.transition = 'transform .1s ease';
          el.style.transform = 'scale(1.02)';
          if (navigator.vibrate) navigator.vibrate(10);
        }, LONG_PRESS_MS);

        const onMove = (ev) => {
          const dyStep = ev.clientY - lastY;
          const dxStep = ev.clientX - lastX;
          lastX = ev.clientX; lastY = ev.clientY;

          if (mode === 'pending'){
            // touch-action:none blockiert natives Scrollen auf den Zeilen komplett,
            // deshalb bilden wir das Scrollen selbst nach, solange noch nicht "gehalten" wurde
            window.scrollBy(0, -dyStep);
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (Math.abs(dx) > MOVE_CANCEL_PX || Math.abs(dy) > MOVE_CANCEL_PX){
              mode = 'scrolling';
              clearTimeout(longPressTimer);
            }
            return;
          }
          if (mode === 'scrolling'){
            window.scrollBy(0, -dyStep);
            return;
          }
          if (mode === 'armed'){
            mode = 'dragging';
            el.style.transition = 'none';
            el.style.zIndex = 5;
            groupEls().forEach(t => { if (t !== el) t.style.transition = 'transform .18s ease'; });
          }
          ev.preventDefault();
          const dy = ev.clientY - startY;
          el.style.transform = `translateY(${dy}px) scale(1.03)`;
          el.style.boxShadow = '0 8px 16px rgba(0,0,0,0.4)';

          const shift = Math.round(dy / rowStep);
          const newTarget = Math.max(0, Math.min(arr.length - 1, fromIndex + shift));
          if (newTarget !== targetIndex){
            targetIndex = newTarget;
            groupEls().forEach((t, i) => {
              if (t === el) return;
              let offset = 0;
              if (fromIndex < targetIndex && i > fromIndex && i <= targetIndex) offset = -rowStep;
              else if (fromIndex > targetIndex && i < fromIndex && i >= targetIndex) offset = rowStep;
              t.style.transform = offset ? `translateY(${offset}px)` : '';
            });
          }
        };

        const finish = () => {
          clearTimeout(longPressTimer);
          el.removeEventListener('pointermove', onMove);
          el.removeEventListener('pointerup', onUp);
          el.removeEventListener('pointercancel', onCancel);
          groupEls().forEach(t => { t.style.transform = ''; t.style.transition = ''; t.style.boxShadow = ''; t.style.zIndex = ''; });
        };
        const onUp = () => {
          const finalMode = mode;
          finish();
          if (finalMode === 'dragging' && targetIndex !== fromIndex){
            const [moved] = arr.splice(fromIndex, 1);
            arr.splice(targetIndex, 0, moved);
            renderRows();
          } else if (finalMode !== 'scrolling'){
            if (freeSelected.has(id)) freeSelected.delete(id); else freeSelected.add(id);
            renderRows();
          }
        };
        const onCancel = () => { finish(); };

        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
        el.addEventListener('pointercancel', onCancel);
      });
    });
  }
  renderRows();

  document.getElementById('btnBack').onclick = () => history.back();
  document.getElementById('btnGo').onclick = () => {
    const orderedIds = orderedGroupNames().flatMap(g => freeGroups[g]);
    const list = orderedIds.filter(id => freeSelected.has(id)).map(id => plan.exercises.find(e => e.id === id));
    if (!list.length){ alert('Bitte mindestens eine Übung auswählen.'); return; }
    startSession(list);
  };
}

// Lädt eine Bilddatei, skaliert sie auf max. 300px Kantenlänge herunter
// und liefert sie als komprimiertes JPEG-DataURL zurück (klein genug fürs Storage).
function downscaleImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Bild konnte nicht geladen werden'));
      img.onload = () => {
        const maxDim = 300;
        let { width, height } = img;
        if (width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trainingsplan-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
